<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 9-10B</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #university-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #university-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .university-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #university-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 9-10B)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="university-reward">
            <div class="university-text" id="reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="reward-img" src="" alt="University Crest">
            <p id="reward-desc" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Polar bears rely on a thick layer of blubber beneath their skin to survive in subzero Arctic temperatures. This dense layer of body fat traps heat generated by the bear's body, preventing thermal loss into the surrounding cold air and icy water. This physical feature serves to ________ the animal against freezing weather.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["insulate", "expose", "diminish", "abandon"],
            correctAnswer: 0,
            explanation: "'Insulate' means to protect by preventing heat loss, accurately describing how blubber keeps polar bears warm."
        },
        {
            passage: "Fireflies emit flashes of light from their abdomens using a chemical reaction involving luciferin and oxygen. Different firefly species flash distinct patterns, rhythms, and colors to communicate with potential mates. By signaling in specific sequences, fireflies ensure that they attract individuals of their own species in dense night foliage.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Fireflies use unique flashing light patterns to communicate and identify mates of their own species.",
                "Luciferin is a chemical found in all flying insects during warm summer months.",
                "Fireflies flash brighter lights when escaping from hungry nocturnal predators.",
                "Dense night foliage prevents fireflies from seeing signals from other insects."
            ],
            correctAnswer: 0,
            explanation: "The text explains how fireflies produce distinct light rhythms to communicate with and locate mates of their species."
        },
        {
            passage: "Solar panels collect energy directly from sunlight using photovoltaic cells, converting light energy into electrical current. However, solar panels cannot generate electricity at night when sunlight is unavailable. To provide continuous power to homes after sunset, solar power systems often depend on ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "rechargeable storage batteries that save excess energy produced during the day.",
                "mirrors that reflect moonlight directly onto the panels at night.",
                "turning off all electrical appliances as soon as the sun sets.",
                "replacing photovoltaic cells with wooden solar panels every evening."
            ],
            correctAnswer: 0,
            explanation: "Storage batteries collect excess solar energy generated during daylight hours so electricity remains available throughout the night."
        },
        {
            passage: "In the 1440s, Johannes Gutenberg invented the movable type printing press in Germany, revolutionizing how information was shared. Before this invention, books had to be copied by hand, making them rare and expensive. Gutenberg's press used movable metal letters that could be rearranged and reused, enabling printers to produce hundreds of identical book pages quickly and affordably.",
            prompt: "Which detail from the text best supports the idea that the printing press made books more accessible?",
            options: [
                "Movable metal letters enabled printers to produce hundreds of identical pages quickly and affordably.",
                "Johannes Gutenberg invented the printing press in Germany during the 1440s.",
                "Before the press was invented, all books were bound in heavy leather covers.",
                "Movable type was used exclusively for printing government proclamations."
            ],
            correctAnswer: 0,
            explanation: "Printing hundreds of pages quickly and cheaply directly explains why books became affordable and accessible to wider audiences."
        },
        {
            passage: "Sea otters play a crucial role in maintaining healthy kelp forest ecosystems along Pacific coastlines. By consuming large quantities of sea urchins, otters prevent these marine invertebrates from overgrazing on underwater kelp beds. Without otters present, urchin populations explode and ________ entire kelp forests.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["devastate", "nourish", "construct", "ignore"],
            correctAnswer: 0,
            explanation: "'Devastate' means to ruin or destroy. Unchecked urchin populations consume kelp until underwater forests are destroyed."
        },
        {
            passage: "Text 1\nElectric vehicles (EVs) produce zero direct tailpipe emissions, making them a key tool in reducing air pollution and slowing global climate change. Transitioning from gasoline vehicles to electric cars significantly improves urban air quality.\n\nText 2\nWhile electric vehicles eliminate tailpipe emissions, producing their lithium-ion batteries requires intensive mining for minerals like cobalt and lithium. Additionally, if the electricity used to charge EVs comes from coal power plants, the environmental benefits are greatly reduced.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By pointing out that electric vehicles still carry environmental costs through battery production and energy sources.",
                "By arguing that gasoline-powered cars should be banned immediately in all urban areas.",
                "By stating that lithium-ion batteries are harmless to mine and easy to dispose of.",
                "By claiming that electric cars require more gasoline than traditional hybrid vehicles."
            ],
            correctAnswer: 0,
            explanation: "Text 2 emphasizes that EV manufacturing and power source pollution create environmental impacts not addressed by Text 1."
        },
        {
            passage: "Deep inside a volcano, magma rises toward the surface as gases dissolved within the molten rock expand. **When the pressure becomes too high to be contained by surrounding rock layers, the volcano erupts violently, expelling ash, gas, and lava.** Understanding this pressure buildup helps scientists monitor volcanic activity and predict potential eruptions.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It describes the moment trapped pressure forces a volcano to erupt violently.",
                "It lists the mineral components found inside cooled lava rocks.",
                "It compares the size of active volcanoes to extinct underwater mountains.",
                "It explains how local residents construct barriers against moving lava flows."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence explains how built-up pressure overcomes rock layers to trigger a volcanic eruption."
        },
        {
            passage: "Monarch butterflies undertake a multi-generational migration covering thousands of miles from North America to central Mexico every autumn. Navigating by the position of the sun and Earth's magnetic forces, millions of monarchs fly southward to find warmer winter roosting sites. This extraordinary journey demonstrates the insect's ability to ________ vast geographical distances.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["navigate", "surrender", "obstruct", "conceal"],
            correctAnswer: 0,
            explanation: "'Navigate' means to travel across or direct a course over long distances."
        },
        {
            passage: "Coral reefs are formed by tiny marine animals called coral polyps that live in colonies. These polyps share a symbiotic relationship with microscopic algae called zooxanthellae that reside inside their tissues. The algae produce energy through photosynthesis and share nutrients with the corals, while the polyps provide the algae with shelter and carbon dioxide.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Coral polyps and microscopic algae rely on a mutually beneficial partnership to survive and thrive.",
                "Coral reefs are found exclusively in cold, deep ocean waters near the North Pole.",
                "Microscopic algae are harmful parasites that drain nutrients away from coral polyps.",
                "Coral polyps build hard limestone shells to protect themselves from ocean currents."
            ],
            correctAnswer: 0,
            explanation: "The passage centers on the cooperative, mutually beneficial relationship between coral polyps and algae."
        },
        {
            passage: "Bats navigate and hunt in total darkness using echolocation, emitting high-frequency sound waves that bounce off nearby objects. By listening to the returning echoes, a bat can determine an object's size, shape, distance, and direction of movement in milliseconds. Consequently, echolocation allows bats to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "pinpoint and catch fast-moving insect prey in pitch darkness.",
                "lose track of flying insects and collide frequently with tree branches.",
                "rely entirely on sharp daylight vision to find fruits and seeds.",
                "stop flying during the night and sleep until sunrise."
            ],
            correctAnswer: 0,
            explanation: "Echolocation provides precise target feedback so bats can catch moving insects in total darkness."
        }
    ];

    // Rotating award possibilities for 10/10 perfect score
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 9-10B</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Dynamic reward selection (Rotates daily between Harvard, BU, and Yale)
        if (score === quizData.length) {
            const todayIndex = new Date().getDate() % universityRewards.length;
            const selectedReward = universityRewards[todayIndex];

            const rewardContainer = document.getElementById('university-reward');
            const rewardTitle = document.getElementById('reward-title');
            const rewardImg = document.getElementById('reward-img');
            const rewardDesc = document.getElementById('reward-desc');

            rewardContainer.style.borderColor = selectedReward.color;
            rewardTitle.style.color = selectedReward.color;
            rewardTitle.textContent = `★ FLAWLESS ACADEMIC EXCELLENCE ★`;
            rewardImg.src = selectedReward.img;
            rewardImg.alt = `${selectedReward.name} Crest`;
            rewardDesc.textContent = `You have successfully earned the ${selectedReward.name} verification crest for achieving a perfect 10/10 score!`;

            rewardContainer.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
