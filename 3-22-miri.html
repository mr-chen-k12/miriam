<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Worksheet - Form B</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .question-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
        }
        .question {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 15px;
        }
        .svg-container {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }
        .btn-toggle {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-toggle:hover {
            background-color: #2980b9;
        }
        .answer-section {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f6f3;
            border-radius: 5px;
            border-left: 4px solid #1abc9c;
        }
        .answer {
            font-weight: bold;
            font-size: 1.1em;
            color: #16a085;
            margin-bottom: 10px;
        }
        .explanation {
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <h1>Lesson 69 Worksheet Practice - Form B</h1>

    <div id="questions"></div>

    <script>
        const problems = [
            {
                id: 1,
                question: "David's pen is \\(14.3 \\text{ cm}\\) long. How many millimeters long is his pen?",
                answer: "143 mm",
                explanation: "There are 10 millimeters in every centimeter. To convert from centimeters to millimeters, multiply by 10. <br> \\( 14.3 \\times 10 = 143 \\)"
            },
            {
                id: 2,
                question: "Sarah has 412 postage stamps. John has 198 postage stamps. Sarah has how many more stamps than John?",
                answer: "214 stamps",
                explanation: "Set up a subtraction problem to find the difference between their totals. <br> \\( 412 - 198 = 214 \\)"
            },
            {
                id: 3,
                question: "A theater has 25 rows of seats. There are 18 seats in each row. How many seats are there in total?",
                answer: "450 seats",
                explanation: "Multiply the number of rows by the number of seats per row. <br> \\( 25 \\times 18 = 450 \\)"
            },
            {
                id: 4,
                question: "To what number is the arrow pointing?",
                svg: `<svg width="300" height="80" viewBox="0 0 300 80">
                        <line x1="20" y1="50" x2="280" y2="50" stroke="black" stroke-width="2"/>
                        <line x1="150" y1="45" x2="150" y2="55" stroke="black" stroke-width="2"/>
                        <text x="146" y="70">0</text>
                        <line x1="250" y1="45" x2="250" y2="55" stroke="black" stroke-width="2"/>
                        <text x="246" y="70">5</text>
                        <line x1="50" y1="45" x2="50" y2="55" stroke="black" stroke-width="2"/>
                        <text x="42" y="70">-5</text>
                        <line x1="70" y1="47" x2="70" y2="53" stroke="black" stroke-width="1"/><line x1="90" y1="47" x2="90" y2="53" stroke="black" stroke-width="1"/><line x1="110" y1="47" x2="110" y2="53" stroke="black" stroke-width="1"/><line x1="130" y1="47" x2="130" y2="53" stroke="black" stroke-width="1"/>
                        <line x1="170" y1="47" x2="170" y2="53" stroke="black" stroke-width="1"/><line x1="190" y1="47" x2="190" y2="53" stroke="black" stroke-width="1"/><line x1="210" y1="47" x2="210" y2="53" stroke="black" stroke-width="1"/><line x1="230" y1="47" x2="230" y2="53" stroke="black" stroke-width="1"/>
                        <line x1="110" y1="15" x2="110" y2="40" stroke="black" stroke-width="2"/>
                        <polygon points="105,35 115,35 110,45" fill="black"/>
                      </svg>`,
                answer: "-2",
                explanation: "The number line shows increments of 1. Starting from 0 and moving to the left, the ticks represent -1, -2, -3, etc. The arrow points exactly 2 ticks to the left of 0, which is -2."
            },
            {
                id: 5,
                question: "Copy this square and shade one fourth of it.",
                svg: `<svg width="150" height="150" viewBox="0 0 150 150">
                        <polygon points="20,20 130,20 75,75" fill="#a2d9ce"/>
                        <rect x="20" y="20" width="110" height="110" fill="none" stroke="black" stroke-width="2"/>
                        <line x1="20" y1="20" x2="130" y2="130" stroke="black" stroke-width="1"/>
                        <line x1="130" y1="20" x2="20" y2="130" stroke="black" stroke-width="1"/>
                      </svg>`,
                answer: "One of the four inner triangles is shaded.",
                explanation: "A square can be divided into 4 identical triangles by drawing diagonals from opposite corners. Shading one of these triangles represents shading \\( \\frac{1}{4} \\) of the square."
            },
            {
                id: 6,
                question: "(a) This pencil is how many centimeters long? <br> (b) This pencil is how many millimeters long?",
                svg: `<svg width="400" height="100" viewBox="0 0 400 100">
                        <rect x="50" y="20" width="300" height="30" fill="none" stroke="black"/>
                        <text x="55" y="35" font-size="12">mm</text>
                        <text x="100" y="35" font-size="10">10</text><text x="150" y="35" font-size="10">20</text><text x="200" y="35" font-size="10">30</text><text x="250" y="35" font-size="10">40</text><text x="300" y="35" font-size="10">50</text>
                        <rect x="50" y="60" width="300" height="30" fill="none" stroke="black"/>
                        <text x="55" y="75" font-size="12">cm</text>
                        <text x="100" y="85" font-size="12">1</text><text x="150" y="85" font-size="12">2</text><text x="200" y="85" font-size="12">3</text><text x="250" y="85" font-size="12">4</text><text x="300" y="85" font-size="12">5</text>
                        <polygon points="50,45 285,45 300,50 285,55 50,55" fill="#f1c40f" stroke="black"/>
                        <polygon points="285,45 300,50 285,55" fill="#ecf0f1" stroke="black"/>
                        <circle cx="297" cy="50" r="3" fill="#34495e"/>
                      </svg>`,
                answer: "(a) 5 cm <br> (b) 50 mm",
                explanation: "The tip of the pencil ends exactly at the 5 cm mark on the bottom scale. Since \\(1 \\text{ cm} = 10 \\text{ mm}\\), \\(5 \\text{ cm}\\) is equal to \\(50 \\text{ mm}\\)."
            },
            {
                id: 7,
                question: "Forty percent of the class earned a B on the test. What percent of the class did not earn a B?",
                answer: "60%",
                explanation: "The total class represents 100%. To find the percentage who did not earn a B, subtract the given percentage from 100%. <br> \\( 100\\% - 40\\% = 60\\% \\)"
            },
            {
                id: 8,
                question: "One meter equals 100 centimeters. If each side of a square is 2 meters long, what is the perimeter of the square in centimeters?",
                answer: "800 cm",
                explanation: "First, find the perimeter in meters: a square has 4 equal sides, so \\( 4 \\times 2 \\text{ meters} = 8 \\text{ meters} \\). Then, convert to centimeters: \\( 8 \\times 100 = 800 \\text{ cm} \\)."
            },
            {
                id: 9,
                question: "Estimate the sum of 581, 214, and 892 by rounding each number to the nearest hundred before adding.",
                answer: "1,700",
                explanation: "\\( 581 \\) rounds up to 600. <br> \\( 214 \\) rounds down to 200. <br> \\( 892 \\) rounds up to 900. <br> Add the rounded numbers: \\( 600 + 200 + 900 = 1700 \\)."
            },
            {
                id: 10,
                question: "Segment AC is \\(15.2 \\text{ cm}\\) long. Segment AB is \\(6.8 \\text{ cm}\\) long. How long is segment BC? Write a decimal subtraction problem and find the answer.",
                svg: `<svg width="300" height="50" viewBox="0 0 300 50">
                        <line x1="20" y1="25" x2="280" y2="25" stroke="black" stroke-width="2"/>
                        <circle cx="20" cy="25" r="3" fill="black"/><text x="16" y="15">A</text>
                        <circle cx="120" cy="25" r="3" fill="black"/><text x="116" y="15">B</text>
                        <circle cx="280" cy="25" r="3" fill="black"/><text x="276" y="15">C</text>
                      </svg>`,
                answer: "\\(15.2 - 6.8 = 8.4 \\text{ cm}\\)",
                explanation: "AC is the total length. To find the missing segment BC, subtract AB from AC. <br> \\( \\text{BC} = \\text{AC} - \\text{AB} \\) <br> \\( \\text{BC} = 15.2 - 6.8 = 8.4 \\)"
            },
            {
                id: 11,
                question: "A train traveled 180 miles in 3 hours. Its average speed was how many miles per hour?",
                answer: "60 miles per hour (mph)",
                explanation: "Average speed is found by dividing the total distance by the total time. <br> \\( \\frac{180}{3} = 60 \\)"
            },
            {
                id: 12,
                question: "A car can travel 45 miles in 1 hour. At that rate, how many miles could the car travel in 4 hours?",
                answer: "180 miles",
                explanation: "Multiply the rate (miles per hour) by the total number of hours. <br> \\( 45 \\times 4 = 180 \\)"
            },
            {
                id: 13,
                question: "A sandwich costs $12.15 and a drink costs $3.80. Estimate the total price for both items by rounding each amount to the nearest dollar before adding.",
                answer: "$16.00",
                explanation: "Round $12.15 down to $12.00. <br> Round $3.80 up to $4.00. <br> Add them together: \\( \\$12.00 + \\$4.00 = \\$16.00 \\)."
            },
            {
                id: 14,
                question: "\\( 300 \\div 7 \\)",
                answer: "\\( 42 \\text{ R } 6 \\)",
                explanation: "7 goes into 30 four times (28), with a remainder of 2. Bring down the 0 to make 20. 7 goes into 20 two times (14), with a remainder of 6."
            },
            {
                id: 15,
                question: "\\( 150 \\div 8 \\)",
                answer: "\\( 18 \\text{ R } 6 \\)",
                explanation: "8 goes into 15 one time, with 7 left over. Bring down the 0 to make 70. 8 goes into 70 eight times (64), leaving a remainder of 6."
            },
            {
                id: 16,
                question: "Add: <br> \\( 22.4 \\)<br>\\( \\phantom{+} 5.1 \\)<br>\\( 18.6 \\)<br>\\( 112.3 \\)<br>\\( 40.2 \\)<br>\\( + \\phantom{0}8.0 \\)",
                answer: "206.6",
                explanation: "Line up the decimal points vertically and add straight down: <br> \\( 22.4 + 5.1 + 18.6 + 112.3 + 40.2 + 8.0 = 206.6 \\)"
            },
            {
                id: 17,
                question: "\\( \\frac{342}{9} \\)",
                answer: "38",
                explanation: "Perform long division: 9 goes into 34 three times (27) with 7 left over. Bring down the 2 to make 72. 9 goes into 72 exactly eight times."
            },
            {
                id: 18,
                question: "\\( 5Y = 75 \\)",
                answer: "\\( Y = 15 \\)",
                explanation: "To find \\( Y \\), use inverse operations by dividing both sides of the equation by 5. <br> \\( Y = \\frac{75}{5} = 15 \\)."
            },
            {
                id: 19,
                question: "\\( 7 \\times \\$3.45 \\)",
                answer: "$24.15",
                explanation: "Multiply as if there is no decimal: \\( 7 \\times 345 = 2415 \\). Place the decimal 2 spots from the right: \\( \\$24.15 \\)."
            },
            {
                id: 20,
                question: "\\( 60 \\times 45¢ \\)",
                answer: "2,700¢ or $27.00",
                explanation: "Multiply: \\( 60 \\times 45 = 2700 \\). This means you have 2,700 cents. Divide by 100 to convert to dollars ($27.00)."
            },
            {
                id: 21,
                question: "\\( \\$20.00 - \\$4.85 \\)",
                answer: "$15.15",
                explanation: "Line up the decimals and subtract. Borrowing across zeros gives you \\( 19.99 - 4.84 \\) essentially, which equals $15.15."
            },
            {
                id: 22,
                question: "\\( 45,210 - 18,564 \\)",
                answer: "26,646",
                explanation: "Perform multi-digit subtraction, making sure to borrow properly across the place values: \\( 45210 - 18564 = 26646 \\)."
            },
            {
                id: 23,
                question: "\\( 84 \\times 50 \\)",
                answer: "4,200",
                explanation: "Multiply \\( 84 \\times 5 = 420 \\), then attach the zero at the end for multiplying by a ten. <br> Result is 4,200."
            },
            {
                id: 24,
                question: "\\( 5 \\overline{) 415 } \\)",
                answer: "83",
                explanation: "5 goes into 41 eight times (40), leaving a remainder of 1. Bring down the 5 to make 15. 5 goes into 15 three times."
            },
            {
                id: 25,
                question: "\\( 6 \\overline{) 430 } \\)",
                answer: "\\( 71 \\text{ R } 4 \\)",
                explanation: "6 goes into 43 seven times (42), remainder 1. Bring down the 0 to make 10. 6 goes into 10 one time, with a remainder of 4."
            },
            {
                id: 26,
                question: "\\( 4 \\overline{) 424 } \\)",
                answer: "106",
                explanation: "4 goes into 4 one time. 4 goes into 2 zero times. Bring down the 4 to make 24. 4 goes into 24 six times."
            },
            {
                id: 27,
                question: "\\( B + 8 = 30 + 12 \\)",
                answer: "\\( B = 34 \\)",
                explanation: "Combine the numbers on the right side: \\( 30 + 12 = 42 \\). Now you have \\( B + 8 = 42 \\). Subtract 8 from both sides to get \\( B = 34 \\)."
            },
            {
                id: 28,
                question: "\\( 6.5 - (4.2 - 2.8) \\)",
                answer: "5.1",
                explanation: "Follow the order of operations by solving inside the parentheses first: \\( 4.2 - 2.8 = 1.4 \\). Then subtract: \\( 6.5 - 1.4 = 5.1 \\)."
            },
            {
                id: 29,
                question: "(a) Find the perimeter of this rectangle in millimeters.<br>(b) Find the area of this rectangle in square centimeters.",
                svg: `<svg width="200" height="120" viewBox="0 0 200 120">
                        <rect x="50" y="30" width="100" height="60" fill="none" stroke="black" stroke-width="2"/>
                        <text x="85" y="20" font-size="12">5 cm</text>
                        <text x="85" y="105" font-size="12">50 mm</text>
                        <text x="160" y="65" font-size="12">4 cm</text>
                        <text x="5" y="65" font-size="12">40 mm</text>
                      </svg>`,
                answer: "(a) \\( 180 \\text{ mm} \\) <br> (b) \\( 20 \\text{ sq cm} \\)",
                explanation: "(a) Perimeter is the total distance around. In mm, sides are 50, 40, 50, 40. \\( P = 50 + 40 + 50 + 40 = 180 \\text{ mm} \\).<br> (b) Area is length times width. In cm, sides are 5 and 4. \\( A = 5 \\times 4 = 20 \\text{ cm}^2 \\)."
            },
            {
                id: 30,
                question: "This triangle is classified as:<br>A. acute<br>B. right<br>C. obtuse",
                svg: `<svg width="150" height="100" viewBox="0 0 150 100">
                        <polygon points="20,80 80,80 140,20" fill="none" stroke="black" stroke-width="2"/>
                        <path d="M 65 80 A 15 15 0 0 1 73 68" fill="none" stroke="gray" stroke-width="1.5"/>
                      </svg>`,
                answer: "C. obtuse",
                explanation: "An obtuse triangle has one angle that is strictly greater than 90 degrees. Looking at the bottom-left inner angle of the triangle shown, it is visibly wider than a right corner."
            }
        ];

        const container = document.getElementById('questions');

        problems.forEach(prob => {
            const card = document.createElement('div');
            card.className = 'question-container';

            const qText = document.createElement('div');
            qText.className = 'question';
            qText.innerHTML = `<strong>${prob.id}.</strong> ${prob.question}`;
            card.appendChild(qText);

            if (prob.svg) {
                const svgDiv = document.createElement('div');
                svgDiv.className = 'svg-container';
                svgDiv.innerHTML = prob.svg;
                card.appendChild(svgDiv);
            }

            const btn = document.createElement('button');
            btn.className = 'btn-toggle';
            btn.textContent = 'Show Answer & Explanation';
            const answerId = `answer-${prob.id}`;
            btn.onclick = () => {
                const ansDiv = document.getElementById(answerId);
                if (ansDiv.style.display === 'none' || ansDiv.style.display === '') {
                    ansDiv.style.display = 'block';
                    btn.textContent = 'Hide Answer';
                } else {
                    ansDiv.style.display = 'none';
                    btn.textContent = 'Show Answer & Explanation';
                }
            };
            card.appendChild(btn);

            const ansSection = document.createElement('div');
            ansSection.className = 'answer-section';
            ansSection.id = answerId;
            ansSection.innerHTML = `
                <div class="answer">Answer: ${prob.answer}</div>
                <div class="explanation"><strong>Explanation:</strong> ${prob.explanation}</div>
            `;
            card.appendChild(ansSection);

            container.appendChild(card);
        });
    </script>
</body>
</html>
