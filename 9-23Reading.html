                    "It explains why chameleons hunt insects using long sticky tongues.",
                    "It describes how cold temperatures affect chameleon metabolic rates."
                ],
                correctAnswer: 0,
                explanation: "The bold sentence explicitly describes the biological mechanism (iridophore cells shifting nanocrystals) that changes skin color."
            },
            {
                passage: "In 1761, clockmaker John Harrison perfected the marine chronometer (H4), a spring-driven sea clock capable of keeping precise time on turbulent ocean voyages. Prior navigation methods could easily determine latitude but struggled to calculate longitude, resulting in catastrophic shipwrecks. By keeping accurate time relative to a home port, Harrison's clock allowed navigators to determine precise longitude at sea, making ocean transit significantly ________",
                prompt: "Which choice completes the text with the most logical and precise word?",
                options: ["safer", "hazardous", "unpredictable", "perilous"],
                correctAnswer: 0,
                explanation: "'Safer' fits how calculating precise longitude reduced shipwrecks and made ocean journeys safer."
            },
            {
                passage: "Carnivorous sundew plants (*Drosera*) thrive in nitrogen-poor wetland bogs by trapping insects on leaves covered with glistening, sticky glandular hairs. Insects attracted to the sweet secretion become stuck on the sticky tentacles, which curl around the victim and release digestive enzymes to dissolve insect tissue, supplying essential nitrogen to the plant.",
                prompt: "Which choice best describes why sundew plants capture insects?",
                options: [
                    "To extract vital nitrogen missing from nutrient-poor bog soils.",
                    "To generate thermal energy required for root growth during winter.",
                    "To protect surrounding flower petals from destructive fungus spores.",
                    "To store excess water absorbed during heavy spring rains."
                ],
                correctAnswer: 0,
                explanation: "The passage explicitly notes that trapping insects supplies nitrogen missing from bog soil."
            },
            {
                passage: "Quantum computing utilizes quantum bits (qubits) that can exist simultaneously in multiple states through a property called superposition, unlike classical bits that represent strictly 0 or 1. This capability enables quantum computers to execute complex multi-variable calculations millions of times faster than traditional supercomputers. Consequently, quantum technology promises to ________",
                prompt: "Which choice most logically completes the text?",
                options: [
                    "accelerate complex scientific simulations like molecular drug discovery.",
                    "eliminate the need for electrical energy in electronic computing devices.",
                    "replace all physical fiber-optic cables with deep-space satellite signals.",
                    "prevent digital data storage hardware from deteriorating over time."
                ],
                correctAnswer: 0,
                explanation: "Processing complex multi-variable calculations rapidly enables breakthroughs like molecular simulations for drug discovery."
            },
            {
                passage: "The CRISPR-Cas9 gene editing system adapted a naturally occurring bacterial defense mechanism into a tool for genetic engineering. The Cas9 enzyme acts as molecular scissors, guided by a synthetic RNA sequence to cut specific DNA strands with exact precision, allowing scientists to insert or remove specific genetic sequences in living cells.",
                prompt: "Which detail from the text best supports the claim that CRISPR-Cas9 allows precise genetic modifications?",
                options: [
                    "A synthetic RNA sequence directs the Cas9 enzyme to cut specific DNA target locations.",
                    "CRISPR technology was originally discovered in freshwater amphibian species.",
                    "Bacterial defense systems protect single-celled organisms against fungal spores.",
                    "Enzymes are protein molecules that speed up biological metabolic reactions."
                ],
                correctAnswer: 0,
                explanation: "Guided targeting by synthetic RNA to cut specific DNA locations explains how precise genetic edits are achieved."
            }
        ]
    };

    // University Achievement Crests mapped to sets (MIT for Set A, Oxford for Set B, Cambridge for Set C)
    const universityRewards = [
        {
            name: "Massachusetts Institute of Technology (MIT)",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#A31F34"
        },
        {
            name: "University of Oxford",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#002147"
        },
        {
            name: "University of Cambridge",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#003262"
        }
    ];

    let currentSetKey = "Set A";
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let isLocked = [];

    // Helper function to shuffle choices dynamically so correct answer position varies
    function shuffleOptions(question) {
        let optionsWithInfo = question.options.map((text, originalIndex) => ({
            text: text,
            isCorrect: originalIndex === question.correctAnswer
        }));

        for (let i = optionsWithInfo.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [optionsWithInfo[i], optionsWithInfo[j]] = [optionsWithInfo[j], optionsWithInfo[i]];
        }

        return {
            passage: question.passage,
            prompt: question.prompt,
            options: optionsWithInfo.map(o => o.text),
            correctAnswer: optionsWithInfo.findIndex(o => o.isCorrect),
            explanation: question.explanation
        };
    }

    function initQuiz() {
        switchSet("Set A");
    }

    function switchSet(setName) {
        currentSetKey = setName;
        
        currentQuestions = rawQuizSets[setName].map(q => shuffleOptions(q));
        currentQuestionIndex = 0;
        userAnswers = new Array(currentQuestions.length).fill(null);
        isLocked = new Array(currentQuestions.length).fill(false);

        document.getElementById('results').style.display = 'none';
        document.getElementById('nav-buttons').style.display = 'flex';
        document.getElementById('progress-tracker').style.display = 'block';

        renderQuestions();
        updateNav();
    }

    function renderQuestions() {
        const wrapper = document.getElementById('questions-wrapper');
        wrapper.innerHTML = '';

        currentQuestions.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv && feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestionIndex]) return; 

        const selected = userAnswers[currentQuestionIndex];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestionIndex}`);
        const q = currentQuestions[currentQuestionIndex];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestionIndex] = true;
        
        const radios = document.getElementsByName(`q${currentQuestionIndex}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestionIndex}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestionIndex}`).classList.remove('active');
        currentQuestionIndex += direction;
        document.getElementById(`question-${currentQuestionIndex}`).classList.add('active');
        
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestionIndex + 1} of ${currentQuestions.length} (${currentSetKey})`;

        if (currentQuestionIndex === currentQuestions.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestionIndex]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        currentQuestions.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            const selected = userAnswers[index];
            
            qBlock.classList.add('active');
            
            isLocked[index] = true;
            const radios = document.getElementsByName(`q${index}`);
            radios.forEach(r => r.disabled = true);
            q.options.forEach((_, optIndex) => {
                const label = document.getElementById(`label-${index}-${optIndex}`);
                if (label) label.classList.add('disabled');
            });

            if (selected === null) {
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else if (selected === q.correctAnswer) {
                score++;
                feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback correct";
            } else {
                feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Set Score: ${score} out of ${currentQuestions.length} (${Math.round((score/currentQuestions.length)*100)}%)`;
        
        const rewardContainer = document.getElementById('university-reward');
        const retryNotice = document.getElementById('retry-notice');
        
        // REWARD LOGIC: Logo is ONLY displayed if score is 100% (score === currentQuestions.length)
        if (score === currentQuestions.length) {
            let rewardIdx = 0;
            if (currentSetKey === "Set B") rewardIdx = 1;
            if (currentSetKey === "Set C") rewardIdx = 2;

            const selectedReward = universityRewards[rewardIdx];

            const rewardTitle = document.getElementById('reward-title');
            const rewardImg = document.getElementById('reward-img');
            const rewardDesc = document.getElementById('reward-desc');
            const fallbackBadge = document.getElementById('fallback-badge');

            rewardContainer.style.borderColor = selectedReward.color;
            rewardTitle.style.color = selectedReward.color;
            rewardTitle.textContent = `★ ACADEMIC ACHIEVEMENT CREST ★`;
            
            rewardImg.style.display = 'block';
            fallbackBadge.style.display = 'none';
            fallbackBadge.style.backgroundColor = selectedReward.color;
            rewardImg.src = selectedReward.img;
            rewardImg.alt = `${selectedReward.name} Crest`;

            rewardDesc.textContent = `Outstanding work! You achieved 100% mastery on ${currentSetKey} and earned the official ${selectedReward.name} emblem!`;

            rewardContainer.style.display = 'block';
            retryNotice.style.display = 'none';
        } else {
            rewardContainer.style.display = 'none';
            retryNotice.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function resetCurrentSet() {
        switchSet(currentSetKey);
    }

    window.onload = initQuiz;
</script>
