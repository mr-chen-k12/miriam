<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 1</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Many people think that bats are completely blind, but they actually have decent eyesight. In addition to seeing with their eyes, bats use sound waves to navigate in total darkness. By emitting high-pitched squeaks and listening to the echoes, bats can map out their surroundings. This special ability makes them remarkably _______ hunters at night, capable of catching thousands of flying insects without bumping into trees.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["skilled", "clumsy", "careless", "lazy"],
            correctAnswer: 0,
            explanation: "'Skilled' means having the ability to do something well. The text states that bats use both eyesight and sound echoes to catch thousands of insects without crashing, which shows they are very effective hunters."
        },
        {
            passage: "Monarch butterflies are famous for their amazing long-distance journey each fall. Millions of these colorful insects fly up to 3,000 miles from Canada and the northern United States down to the warm forests of central Mexico. They make this incredible trip every year to escape freezing winter temperatures, even though an individual butterfly will only make the journey once in its lifetime.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Monarch butterflies travel thousands of miles every fall to escape cold winter weather.",
                "Monarch butterflies are the only insects that can live in the forests of Mexico.",
                "Freezing weather in Canada is dangerous for most species of birds during autumn.",
                "Monarch butterflies prefer living inside dark green trees for their entire lives."
            ],
            correctAnswer: 0,
            explanation: "The passage focuses on the long migration journey monarch butterflies make each fall from northern regions down to Mexico to avoid cold winter temperatures."
        },
        {
            passage: "Honeybees use a special movement called the 'waggle dance' to talk to one another. When a worker bee finds a field of bright flowers full of sweet nectar, it returns to the hive and moves in a special figure-eight pattern. The direction and length of the dance tell the other bees exactly how far away the flowers are and which direction to fly. Therefore, when other bees watch the waggle dance, they are able to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "find the new food source quickly without getting lost.",
                "forget where their beehive was originally located.",
                "build a completely new hive closer to the deep river.",
                "teach the worker bee how to fly much faster."
            ],
            correctAnswer: 0,
            explanation: "Because the dance communicates the exact distance and direction of the flowers, watching the dance allows the other bees to easily locate the food source."
        },
        {
            passage: "Maya's science class built a simple solar oven using a cardboard box, aluminum foil, and plastic wrap. The shiny foil reflected sunlight into the center of the box, while the black paper lining on the bottom absorbed heat. Within one hour, the temperature inside reached 150°F, which was hot enough to melt cheese over tortilla chips to make a warm snack.",
            prompt: "Which detail from the text best supports the idea that the solar oven successfully trapped heat?",
            options: [
                "The temperature inside the box reached 150°F and melted cheese.",
                "Maya's science class used cardboard boxes brought from home.",
                "Tortilla chips are a popular afternoon snack for elementary students.",
                "The students built their project during their morning science period."
            ],
            correctAnswer: 0,
            explanation: "The temperature rising to 150°F and successfully melting cheese directly proves that the solar oven was effective at collecting and trapping heat."
        },
        {
            passage: "When the unexpected storm hit the coastal town, heavy rain poured down and high winds blew for hours. Luckily, the oak trees planted in the town park remained _______, standing strong and upright without losing a single large branch.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["unharmed", "fragile", "damaged", "invisible"],
            correctAnswer: 0,
            explanation: "'Unharmed' means not hurt or damaged. The text states the trees stood strong and upright without losing any branches, showing they survived the storm without damage."
        },
        {
            passage: "Text 1\nElectric cars are great for the environment because they do not produce harmful exhaust smoke like gas cars do. Charging a car with electricity helps keep the air clean in busy cities.\n\nText 2\nWhile electric cars do not produce smoke while driving, the electricity used to charge them often comes from power plants that burn coal or gas. To make electric cars truly clean, communities must switch to renewable energy like solar or wind power.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By pointing out that electric cars still depend on energy that might come from polluting power plants.",
                "By arguing that gas-powered cars are much better for city air than electric cars.",
                "By suggesting that cities should ban all cars and encourage citizens to walk everywhere.",
                "By stating that solar panels do not generate electricity during sunny weather."
            ],
            correctAnswer: 0,
            explanation: "Text 2 notes that electric cars rely on electricity that is often generated by power plants burning coal or gas, showing that clean air depends on where the electricity originates."
        },
        {
            passage: "Deep under the ocean floor, hydrothermal vents spew super-heated water packed with rich minerals. **Even though sunlight cannot reach these dark ocean zones, giant tube worms and ghost crabs thrive around the vents.** They rely on special bacteria that turn chemical energy from the vents into food, proving that complex animal life can survive without sunlight.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It gives examples of ocean animals that can live in extreme environments without sunlight.",
                "It explains why giant tube worms prefer swimming near the sunny surface of the sea.",
                "It proves that ghost crabs require bright light to catch their prey.",
                "It describes how marine scientists build underwater robotic cameras."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence highlights tube worms and ghost crabs to show specific examples of animals that live deep underwater where light cannot reach."
        },
        {
            passage: "Rather than giving up after failing his first coding attempt, Leo showed great _______ by spending hours practicing until his computer program worked perfectly.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["determination", "fear", "impatience", "doubt"],
            correctAnswer: 0,
            explanation: "'Determination' means continuing to try to do something even when it is difficult. Leo did not give up and kept working for hours until he succeeded."
        },
        {
            passage: "Beavers are often called 'nature's engineers' because they actively change their surroundings. By cutting down small trees with their sharp teeth and building wooden dams across streams, beavers create calm ponds. These new ponds create habitats for fish, frogs, and water birds, showing how a single animal can transform an entire ecosystem.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Beavers build dams that create new ponds, transforming the environment for many animals.",
                "Beavers mainly eat small fish and frogs that live in fast-moving rivers.",
                "Cutting down trees is harmful to birds living in forest environments.",
                "Beavers prefer to build their homes in ocean saltwater rather than freshwater streams."
            ],
            correctAnswer: 0,
            explanation: "The main focus of the text is how beavers construct dams to form ponds, altering the environment and helping create homes for other wildlife."
        },
        {
            passage: "The planet Mars has a very thin atmosphere and extremely cold surface temperatures. Liquid water cannot exist on the surface for long before freezing into ice or evaporating into gas. Because liquid water is essential for human survival, future astronauts traveling to Mars will need to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "bring special systems to produce and store liquid water inside heated living spaces.",
                "drink ocean water directly from the surface of Mars as soon as they land.",
                "stop drinking liquid water entirely while completing their long mission.",
                "wear light summer clothing to stay cool while exploring the planet."
            ],
            correctAnswer: 0,
            explanation: "Since water freezes or turns to gas on Mars and humans need liquid water to survive, astronauts must use special equipment to generate and store water inside warm habitats."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 1</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
