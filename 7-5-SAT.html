<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Grade Reading Practice - Set 17 (Harvard Challenge)</title>
<style>
    /* General Styles - Harvard Crimson Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fcf8f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        position: relative;
        border: 3px solid #a51c30;
    }
    h1 {
        text-align: center;
        color: #a51c30;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #fffafb;
        padding: 20px;
        border-left: 5px solid #a51c30;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fffcfc;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #f5e6e8;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f9e8ea;
        border-color: #e2b3b8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #4a5568;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2d3748; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #a51c30; }
    .check-btn:hover { background-color: #821424; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #219653; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #fffdf9;
        border: 3px dashed #bc9b6a;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>4th Grade Reading Practice - Set 17</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 15</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #a51c30; margin: 10px 0;"></p>
        <div id="reward-container"></div>
        <p id="results-footer" style="font-size: 1.1em; color: #4a5568;"></p>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "Marine biologists have discovered that sea clover is completely ______ to the coastal ecosystem; without this single plant species to anchor the sandy ocean floor, powerful underwater currents would wash away the habitats of dozens of small crab and fish species.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["harmful", "optional", "indispensable", "temporary"],
            correctAnswer: 2,
            explanation: "'Indispensable' means absolutely necessary. The text emphasizes that without this specific plant, the entire habitat structure would collapse, making it essential.",
        },
        {
            passage: "The subterranean star-nosed mole possesses an extraordinary hunting ability adapted for total darkness. Its snout is ringed with twenty-two fleshy, pink tentacles that can touch and identify more than ten microscopic insects in a single second. This specialized organ sends electrical signals to the mole's brain faster than the human eye can blink, allowing the creature to find and consume prey entirely by touch without ever needing sight.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Star-nosed moles prefer living in dark environments rather than sunny fields.",
                "The star-nosed mole uses a highly specialized snout to hunt efficiently without sight.",
                "Fleshy tentacles protect the star-nosed mole from dangerous underground predators.",
                "Microscopic insects are the only food source available in deep subterranean caves."
            ],
            correctAnswer: 1,
            explanation: "This choice accurately captures the main focus of the text, which details how the tentacles on the snout allow the mole to find food by touch in the dark.",
        },
        {
            passage: "In the historical mystery *The Midnight Watch*, the author suggests that a successful navigator must rely on multiple astronomical instruments rather than trusting a single tool during a storm.",
            prompt: "Which sentence from *The Midnight Watch* best supports this idea?",
            options: [
                "\"The wooden ship tossed violently as the cold midnight waves crashed against the deck.\"",
                "\"The sailor wore a thick wool coat that protected him from the freezing rain.\"",
                "\"Knowing that the heavy clouds could completely block the North Star, Captain Reed carefully cross-referenced his magnetic compass readings with his brass sextant to confirm the ship's exact heading.\"",
                "\"The brass sextant was kept in a velvet-lined box inside the captain's private cabin.\""
            ],
            correctAnswer: 2,
            explanation: "This sentence directly shows a character using and comparing two different tools (a compass and a sextant) to ensure accuracy, which perfectly mirrors the author's message.",
        },
        {
            passage: "Leafcutter ants do not actually eat the leaves they harvest from the rainforest canopy. Instead, they carry the leaf fragments underground, chew them into a mushy paste, and use them to cultivate a specific type of nutritious fungus. This fungus serves as the primary food source for the entire ant colony. Therefore, if a sudden biological blight completely eliminates this specific fungus from the region, the leafcutter ants will likely ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "begin eating the raw leaves directly to survive.",
                "struggle to survive unless they find an alternative food source.",
                "move their colony to the top of the rainforest trees permanently.",
                "learn to hunt large forest animals for meat."
            ],
            correctAnswer: 1,
            explanation: "The text establishes that the fungus is the primary food source for the colony, so losing it would naturally threaten their survival.",
        },
        {
            passage: "While the first half of the astronomy lecture was highly **perplexing**, leaving the students confused by advanced formulas and abstract theories, the second half was remarkably ______; the professor used simple everyday analogies and clear diagrams that everyone understood instantly.",
            prompt: "Which choice completes the text with the word that is the most logical *opposite* of **perplexing**?",
            options: ["complicated", "lucid", "tedious", "lengthy"],
            correctAnswer: 1,
            explanation: "'Lucid' means clear and easy to understand, which perfectly contrasts with the confusing nature of the first half and matches the description of the clear analogies used.",
        },
        {
            passage: "High-altitude weather balloons are essential tools for modern meteorology. They carry heavy instruments called radiosondes deep into the stratosphere to measure temperature, humidity, and atmospheric pressure. *However, these balloons possess a major operational vulnerability: as they rise into the thin air of the upper atmosphere, the gas inside expands until the rubber fabric inevitably bursts, ending the data collection.* To maximize the lifespan of these missions, engineers are developing new stretchable polymers that can expand to ten times their original size without tearing.",
            prompt: "Which choice best describes the function of the italicized sentence in the text?",
            options: [
                "It lists the specific weather metrics that radiosondes are designed to measure.",
                "It introduces a critical limitation of weather balloons that engineers are trying to solve.",
                "It argues that ground-based weather stations are more accurate than balloons.",
                "It details the historical invention of the first stretchable rubber polymer."
            ],
            correctAnswer: 1,
            explanation: "The italicized sentence outlines a fatal flaw (bursting due to expansion), which sets up the reason why engineers are creating new stretchable materials in the final sentence.",
        },
        {
            passage: "Text 1<br>Enrolling children in competitive team sports at a young age is an excellent way to build character. By playing soccer or basketball, children learn the value of cooperation, develop physical fitness, and understand how to handle both victory and defeat gracefully.<br><br>Text 2<br>Forcing young children into highly competitive sports leagues can have negative psychological effects. When the pressure to win becomes too intense, children often experience severe anxiety and low self-esteem. Instead of developing a lifelong love for exercise, many kids become burned out and quit sports entirely before reaching middle school.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's positive view of competitive sports?",
            options: [
                "By arguing that competitive leagues can place too much pressure on children, leading to anxiety and burnout.",
                "By agreeing that winning matches is the most important part of a child's character development.",
                "By suggesting that all sports should be banned from elementary schools entirely.",
                "By proving that children who play team sports perform better on academic exams."
            ],
            correctAnswer: 0,
            explanation: "This choice directly summarizes the main argument of Text 2, which outlines the negative emotional and psychological consequences of intense sports competition.",
        },
        {
            passage: "Venus flytraps grow natively in coastal bogs where the soil lacks essential nutrients, particularly nitrogen. To compensate for this environmental deficiency, the plants have evolved specialized leaves that snap shut to trap insects, which are then digested to extract the necessary minerals. Because a nearby construction project has accidentally leaked nitrogen-rich fertilizer into a section of the bog, making the soil highly fertile, scientists predict that the Venus flytraps in that area will ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "stop growing leaves entirely and rely on their roots to walk to a new bog.",
                "rely less on trapping insects because they can absorb nitrogen directly from the soil.",
                "double the speed at which their traps snap shut to capture larger prey.",
                "turn completely white to reflect the excess fertilizer minerals."
            ],
            correctAnswer: 1,
            explanation: "Since insect trapping is an adaptation specifically to get nitrogen when the soil lacks it, having abundant nitrogen in the soil makes trapping less necessary.",
        },
        {
            passage: "Creating a piece of stained glass art requires a highly structured and patient process. First, the artist draws a detailed pattern on paper to serve as a blueprint. Next, diamond-tipped tools are used to carefully cut sheets of colored glass into the precise shapes outlined in the pattern. Then, the artist wraps the edges of each glass piece in thin copper foil. Finally, a hot soldering iron melts metal along the copper seams, joining the pieces together into a beautiful, solid window.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It compares the durability of stained glass to modern transparent plastics.",
                "It details a chronological sequence of steps used to create a stained glass window.",
                "It explains the economic history of glassmaking in ancient European cities.",
                "It presents an argument about why artists should use copper instead of lead."
            ],
            correctAnswer: 1,
            explanation: "The passage uses time-order transition words like 'First,' 'Next,' 'Then,' and 'Finally' to map out the step-by-step assembly process.",
        },
        {
            passage: "Although early colonial ships appeared sturdy, their wooden hulls were highly ______ to a tiny marine pest known as the shipworm; these specialized clams burrowed through the timber, creating thousands of microscopic tunnels that could cause a massive vessel to sink without warning.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["invulnerable", "vulnerable", "indifferent", "hostile"],
            correctAnswer: 1,
            explanation: "This term means open to attack or easily damaged. The passage outlines how easily the shipworms could damage the wooden hull and destroy the ship.",
        },
        {
            passage: "The invention of the printing press by Johannes Gutenberg in the fifteenth century completely transformed human history. Before this invention, books had to be copied entirely by hand, a laborious process that made them incredibly rare and expensive. The printing press allowed thousands of identical pages to be produced quickly and cheaply, making literature and education accessible to ordinary citizens for the very first time and accelerating the spread of scientific knowledge across the globe.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Gutenberg's printing press made books widely accessible and accelerated the spread of knowledge.",
                "Hand-copied books were much more beautiful and valuable than printed books.",
                "Scientific knowledge was completely ignored by citizens before the fifteenth century.",
                "The printing press was primarily used to manufacture cheap paper for schools."
            ],
            correctAnswer: 0,
            explanation: "This option correctly captures the core thesis of the text, describing both the mechanical impact and the historical significance of the invention.",
        },
        {
            passage: "In the science fiction novel *The Crystal Moon*, the author demonstrates that working together in a crisis is far more effective than trying to solve a complex technological emergency alone.",
            prompt: "Which sentence from *The Crystal Moon* best supports this idea?",
            options: [
                "\"The silver spaceship landed gently on the cratered surface of the distant moon.\"",
                "\"The astronaut wore a pressurized helmet equipped with a small communication radio.\"",
                "\"While Commander Vance struggled fruitlessly for an hour to repair the broken oxygen generator by himself, the entire crew eventually formed a line, pooled their mechanical tools, and fixed the engine in under ten minutes.\"",
                "\"The oxygen generator was located in the lower engineering bay near the main fuel tanks.\""
            ],
            correctAnswer: 2,
            explanation: "This option directly contrasts one person's failed individual effort with a group's rapid collective success, reinforcing the core message.",
        },
        {
            passage: "While the exterior of the ancient temple appeared completely **plain**, consisting of rough gray stones without any carvings or decorations, the interior was remarkably ______; every wall was covered in shimmering gold leaf, intricate mosaics, and brilliantly painted murals of historical battles.",
            prompt: "Which choice completes the text with the word that is the most logical *opposite* of **plain**?",
            options: ["simple", "ornate", "weathered", "modern"],
            correctAnswer: 1,
            explanation: "'Ornate' means heavily decorated or elaborate, which perfectly opposes 'plain' and matches the subsequent details about gold leaf and mosaics.",
        },
        {
            passage: "The beaver is often called an ecosystem engineer due to its unique ability to alter its environment. By cutting down trees and building sturdy wooden dams across rivers, beavers create large, still ponds. *These newly formed wetlands slow down fast-moving water, filtering out harmful dirt and agricultural pollution before it travels downstream.* Consequently, regions with active beaver dams often experience cleaner water and a significant increase in local biodiversity, as many species of fish and birds thrive in the calm ponds.",
            prompt: "Which choice best describes the function of the italicized sentence in the text?",
            options: [
                "It lists the specific types of trees that beavers prefer to use when building dams.",
                "It details the exact mechanism by which beaver wetlands clean the water supply.",
                "It argues that beavers cause dangerous flooding in nearby human neighborhoods.",
                "It compares the engineering skills of beavers to those of human construction teams."
            ],
            correctAnswer: 1,
            explanation: "The italicized text explains the operational process of filtration (slowing water and trapping dirt), providing the reason for the cleaner water mentioned in the next sentence.",
        },
        {
            passage: "Text 1<br>Electric vehicles (EVs) represent the ultimate solution to urban air pollution. By replacing traditional gasoline-powered cars with vehicles that produce zero tailpipe emissions, cities can drastically reduce greenhouse gases, improve public health, and create a cleaner environment for future generations.<br><br>Text 2<br>While electric vehicles reduce emissions on the road, their overall environmental impact is often misunderstood. Generating the electricity needed to charge millions of EVs still relies heavily on burning coal and natural gas at power plants, which transfers the pollution from the city streets to rural power stations rather than eliminating it entirely.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that electric vehicles \"produce zero tailpipe emissions\"?",
            options: [
                "By pointing out that charging EVs still relies on electricity generated by burning fossil fuels at power plants.",
                "By agreeing that electric vehicles cause no environmental damage during their entire lifecycle.",
                "By suggesting that cities should ban all electric vehicles from public highways immediately.",
                "By demonstrating that traditional gasoline cars are cheaper to manufacture than electric models."
            ],
            correctAnswer: 0,
            explanation: "This directly aligns with Text 2's argument that pollution is shifted to power plants that burn coal and gas to produce the charging energy.",
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Sensational text evaluation! 🌟</strong><br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        const rewardContainer = document.getElementById('reward-container');
        const NavFooter = document.getElementById('results-footer');
        
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            rewardContainer.innerHTML = `
                <div style="margin: 20px auto; padding: 20px; background-color: #fff9f9; border: 2px solid #a51c30; border-radius: 8px; max-width: 400px;">
                    <h3 style="color: #a51c30; margin-top: 0; font-size: 1.4em;">🏆 Flawless 15/15 Score! 🏆</h3>
                    <p style="font-weight: bold; color: #2c3e50; margin-bottom: 15px;">Exceptional! You have officially won the Harvard Logo Badge:</p>
                    <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard Logo" style="max-width: 220px; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            `;
            NavFooter.textContent = "Unparalleled reading mastery! You integrated every contextual element perfectly. Review your flawless work below.";
        } else {
            rewardContainer.innerHTML = "";
            NavFooter.textContent = "Fantastic effort on this set! Carefully examine the systematic breakdowns below to polish your reasoning skills, clear the test again, and earn your 15/15 Harvard badge!";
        }
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
