<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3rd Grade Reading Practice - Set 4</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f3f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        position: relative;
        border: 3px solid #6c5ce7;
    }
    h1 {
        text-align: center;
        color: #2c3e50;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #faf9ff;
        padding: 20px;
        border-left: 5px solid #6c5ce7;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fcfbfe;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #e2e0f4;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f1f0ff;
        border-color: #d6d3ff;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #34495e;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2c3e50; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #6c5ce7; }
    .check-btn:hover { background-color: #5b4cc4; }
    
    .submit-btn { background-color: #2ecc71; }
    .submit-btn:hover { background-color: #27ae60; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #eafaf1;
        border: 3px solid #2ecc71;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>3rd Grade Reading Practice - Set 4</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #16a085;"></p>
        <p>Scroll down to look over your answers and explanations.</p>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "Although the little puppy was usually very ______ and spent the whole afternoon napping on the soft rug, he became wild and full of energy the moment he saw his favorite squeaky toy.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["lazy", "excited", "loud", "hungry"],
            correctAnswer: 0,
            explanation: "'Lazy' means slow-moving or resting instead of working or playing. Because the passage says the puppy usually spent the whole afternoon napping, 'lazy' fits perfectly before describing how he suddenly switched to being wild and energetic."
        },
        {
            passage: "Owls have incredible features that make them amazing night hunters. Their giant eyes let them see tiny movements in the dark, and their ears can pick up the quietest rustle of leaves. Best of all, owls have unique, soft feathers that muffle the sound of their wings. This lets them fly completely silently through the air to catch mice before they are ever heard.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Mice like to run around in dry, crunchy leaves at night.",
                "Owls have special body parts that help them hunt successfully in the dark.",
                "Giant eyes are the most important part of a bird's body.",
                "All birds of prey prefer to sleep during the daytime."
            ],
            correctAnswer: 1,
            explanation: "The text explains how an owl's specific features (giant eyes, sharp ears, and silent feathers) combine to make them excellent at hunting when it is dark."
        },
        {
            passage: "In the book 'The Big Race', Max's coach explains that beating a difficult level or winning a game takes determination and trying again, rather than just quitting when it gets hard.",
            prompt: "Which sentence from 'The Big Race' best supports the coach's idea?",
            options: [
                "\"The race track was made of black asphalt and had yellow lines painted along the edges.\"",
                "\"Max drank a cold bottle of water and sat down on a green bench to rest.\"",
                "\"Even though Max crashed his toy car ten times in a row, he wiped his hands, smiled, and tried the track one more time.\"",
                "\"The shiny silver trophy sat on the top shelf of the display case in the gym.\""
            ],
            correctAnswer: 2,
            explanation: "This sentence shows Max facing repeated failures ('crashed his toy car ten times') but continuing to try anyway, which perfectly illustrates determination."
        },
        {
            passage: "New skateboards with small plastic wheels are great because they roll incredibly fast on smooth kitchen floors and flat sidewalks. However, these small wheels can easily get stuck or trip you up if you roll onto bumpy grass or gravel pathways. Therefore, to make these skateboards safe for park trails, inventors must ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "make the skateboards out of cardboard instead of wood.",
                "design wider, rubbery wheels that can roll smoothly over bumpy ground.",
                "tell children that they should only skateboard inside the house.",
                "paint the wheels bright green so they blend in with the park grass."
            ],
            correctAnswer: 1,
            explanation: "The problem mentioned is that small wheels get stuck on rough surfaces like gravel and grass. Creating wider, rubbery wheels directly addresses this issue to make riding on trails safe."
        },
        {
            passage: "Although the puzzle had one thousand tiny pieces and looked completely impossible at first, Chloe was incredibly ______; she sat at the dining room table for three hours straight until every last piece was in its correct place.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["bored", "determined", "scared", "forgetful"],
            correctAnswer: 1,
            explanation: "'Determined' means refusing to give up even when something is hard. Chloe sitting for three hours to finish a difficult puzzle proves she was determined."
        },
        {
            passage: "Many people think that all spiders are insects because they are small crawling bugs. However, scientists know that spiders are actually arachnids because they have eight legs and two body parts instead of six legs and three body parts. This discovery helps us group animals correctly by looking at their bodies instead of just their size. Today, we know spiders are closer to scorpions than to ants.",
            prompt: "Which choice best describes what the second sentence ('However, scientists... parts.') does in the story?",
            options: [
                "It explains why some insects are able to fly up into high trees.",
                "It corrects a common mistake by sharing a scientific fact about spider bodies.",
                "It lists the favorite hiding spots of different types of ants.",
                "It proves that spiders are the scariest animals in the garden."
            ],
            correctAnswer: 1,
            explanation: "The first sentence mentions a common misconception (that spiders are insects). The second sentence uses 'However' to state the scientific correction regarding their leg count and body structure."
        },
        {
            passage: "Text 1<br>Zoos are wonderful places because they protect endangered animals from danger in the wild. By feeding them healthy meals, treating them when they are sick, and keeping them safe from hunters, zoos help animal species survive.<br><br>Text 2<br>Keeping wild animals inside cages at a zoo is unfair. Animals need wide open spaces to run, hunt, and fly freely, and locking them up behind bars makes them lonely and deeply unhappy, even if they have food.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's idea that zoos 'help animal species survive'?",
            options: [
                "By agreeing that animals prefer living in small cages rather than wide open fields.",
                "By arguing that making animals unhappy and keeping them locked up is worse than the safety a zoo provides.",
                "By suggesting that all wild zoo animals should be taught how to perform circus tricks.",
                "By saying that wild animals never get sick or hurt when they live in nature."
            ],
            correctAnswer: 1,
            explanation: "Text 2 focuses heavily on the negative emotional state of the animals (lonely, unhappy, locked up). This implies that the author thinks these negative effects outweigh the safety benefits praised in Text 1."
        },
        {
            passage: "Earthworms breathe through their sensitive, moist skin and need to stay deep inside wet soil to live. However, when heavy rain completely floods the underground dirt, the worms can no longer get air and must crawl to the surface to avoid drowning. Because a major summer rainstorm is currently flooding the neighborhood park, scientists believe that ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "the earthworms will swim down into deep lakes to find food.",
                "lots of earthworms will soon crawl out onto the grass and sidewalks.",
                "earthworms will grow wings to fly away from the wet puddles.",
                "the worms will build tiny umbrellas out of fallen leaves."
            ],
            correctAnswer: 1,
            explanation: "The text sets up a cause-and-effect relationship: heavy rain floods the dirt, forcing earthworms to the surface to breathe. Therefore, a major rainstorm in the park will logically result in worms emerging on the surface."
        },
        {
            passage: "To see which material keeps ice cream from melting fastest on a hot day, students wrapped identical ice cream bars in different wrappers. One bar was wrapped in shiny tin foil, while the other was wrapped in brown paper packaging. The students left both bars out in the sun for ten minutes. They found that the ice cream in the tin foil stayed mostly frozen, while the paper one turned into soup, showing that foil blocks heat best.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It tells a story about a kid who opened an ice cream shop in the summer.",
                "It describes a test, compares how two different wrappers kept ice cream cold, and shares the discovery.",
                "It explains the exact steps required to bake a hot apple pie in an oven.",
                "It argues that children should never eat cold treats outside."
            ],
            correctAnswer: 1,
            explanation: "The text describes an experimental scientific project (testing two wrappers), compares the physical state of the ice cream bars afterward, and sums up the takeaway rule."
        },
        {
            passage: "While the school library was completely silent and peaceful in the morning, the afternoon book club meeting was remarkably ______; the room was filled with children laughing, shouting out answers, and clapping loudly.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["dark", "noisy", "calm", "empty"],
            correctAnswer: 1,
            explanation: "'Noisy' means making a lot of loud sound. Since the kids were laughing, shouting, and clapping, the room was noisy, creating a direct contrast to the 'silent' morning."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Way to go! 🏅</strong><br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
