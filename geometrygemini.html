<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation Learning Module</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        canvas {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:active {
            transform: scale(0.95);
        }
        button.next-btn {
            background-color: #27ae60;
            display: none;
        }
        button.next-btn:hover {
            background-color: #2ecc71;
        }
        #feedback {
            min-height: 80px;
            font-size: 18px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
        }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Identify the Transformation</h1>
        <p>Watch the animation carefully. The faint gray shape is the <strong>before</strong> image, and the blue shape is the <strong>after</strong> image. What transformation is taking place?</p>
        
        <canvas id="mathCanvas" width="500" height="500"></canvas>
        
        <div class="controls" id="options">
            <button onclick="checkAnswer('Translation')">Translation</button>
            <button onclick="checkAnswer('Rotation')">Rotation</button>
            <button onclick="checkAnswer('Dilation')">Dilation</button>
            <button onclick="checkAnswer('Reflection')">Reflection</button>
        </div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>

        <div id="feedback"></div>
    </div>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Mathematical definitions for feedback
        const mathFormulas = {
            'Translation': '\\( (x, y) \\rightarrow (x + h, y + k) \\)',
            'Rotation': '\\( (x, y) \\rightarrow (x\\cos\\theta - y\\sin\\theta, x\\sin\\theta + y\\cos\\theta) \\)',
            'Dilation': '\\( (x, y) \\rightarrow (kx, ky) \\)',
            'Reflection': '\\( (x, y) \\rightarrow (-x, y) \\) or \\( (x, -y) \\)'
        };

        // State variables
        let currentTransformation = '';
        let animationTime = 0;
        let isAnimating = true;
        let answered = false;

        // Base shape: an asymmetrical triangle so transformations are obvious
        const baseShape = [
            { x: 20, y: 20 },
            { x: 100, y: 30 },
            { x: 40, y: 90 }
        ];

        // Transformation parameters
        let params = {};

        function initCartesian() {
            // Set (0,0) to center of canvas and standard mathematical quadrants
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset
            ctx.clearRect(0, 0, width, height);
            ctx.translate(width / 2, height / 2);
            ctx.scale(1, -1); // Invert Y axis
        }

        function drawGrid() {
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#ecf0f1';
            for (let i = -width/2; i < width/2; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, -height/2); ctx.lineTo(i, height/2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-width/2, i); ctx.lineTo(width/2, i); ctx.stroke();
            }
            // Axes
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-width/2, 0); ctx.lineTo(width/2, 0); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(0, -height/2); ctx.lineTo(0, height/2); ctx.stroke(); // Y
        }

        function drawPolygon(points, color, isDashed = false) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            
            if (isDashed) {
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fill();
                ctx.setLineDash([]);
            } else {
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Generate a random transformation
        function nextQuestion() {
            const types = ['Translation', 'Rotation', 'Dilation', 'Reflection'];
            currentTransformation = types[Math.floor(Math.random() * types.length)];
            
            // Generate random parameters for the animation
            if (currentTransformation === 'Translation') {
                params = { dx: (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 50), 
                           dy: (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 50) };
            } else if (currentTransformation === 'Rotation') {
                // Rotate 90, 180, or 270 degrees
                const angles = [Math.PI/2, Math.PI, 3*Math.PI/2];
                params = { angle: angles[Math.floor(Math.random() * angles.length)] };
            } else if (currentTransformation === 'Dilation') {
                params = { scale: 2 + Math.random() * 1.5 }; // Scale up
            } else if (currentTransformation === 'Reflection') {
                params = { axis: Math.random() > 0.5 ? 'x' : 'y' }; // Reflect over X or Y axis
            }

            // Reset UI
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').className = '';
            document.getElementById('options').style.display = 'flex';
            document.getElementById('nextBtn').style.display = 'none';
            answered = false;
            animationTime = 0;
        }

        // Apply transformation to points based on an animation progress (0.0 to 1.0)
        function getTransformedPoints(points, type, progress) {
            // Easing function for smoother animation (Ease In Out Cubic)
            const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

            return points.map(p => {
                let nx = p.x, ny = p.y;
                
                if (type === 'Translation') {
                    nx = p.x + params.dx * ease;
                    ny = p.y + params.dy * ease;
                } 
                else if (type === 'Rotation') {
                    const a = params.angle * ease;
                    nx = p.x * Math.cos(a) - p.y * Math.sin(a);
                    ny = p.x * Math.sin(a) + p.y * Math.cos(a);
                } 
                else if (type === 'Dilation') {
                    const s = 1 + (params.scale - 1) * ease;
                    nx = p.x * s;
                    ny = p.y * s;
                } 
                else if (type === 'Reflection') {
                    // Animate reflection by squishing and flipping across the axis (3D style turn)
                    if (params.axis === 'y') {
                        nx = p.x * (1 - 2 * ease);
                    } else {
                        ny = p.y * (1 - 2 * ease);
                    }
                }
                return { x: nx, y: ny };
            });
        }

        // The animation loop
        function animate() {
            initCartesian();
            drawGrid();

            // Draw original static shape (before)
            drawPolygon(baseShape, '#7f8c8d', true);

            // Calculate progress (Ping-pong loop)
            // 0 -> 1 -> 0
            let cycle = (Date.now() / 2000) % 2; 
            let progress = cycle < 1 ? cycle : 2 - cycle; 
            
            // Hold at the extremes slightly for better viewing
            if (progress < 0.1) progress = 0;
            else if (progress > 0.9) progress = 1;
            else progress = (progress - 0.1) / 0.8;

            // Get interpolated points and draw (after)
            let currentPoints = getTransformedPoints(baseShape, currentTransformation, progress);
            drawPolygon(currentPoints, 'rgba(52, 152, 219, 0.8)');

            requestAnimationFrame(animate);
        }

        // Check user answer
        function checkAnswer(guess) {
            if (answered) return;
            const feedbackDiv = document.getElementById('feedback');
            
            if (guess === currentTransformation) {
                feedbackDiv.className = 'correct';
                feedbackDiv.innerHTML = `<strong>Correct!</strong> The shape underwent a <strong>${currentTransformation}</strong>.<br><br>Math Form: ${mathFormulas[currentTransformation]}`;
                document.getElementById('options').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
                answered = true;
            } else {
                feedbackDiv.className = 'incorrect';
                feedbackDiv.innerHTML = `<strong>Incorrect.</strong> That was not a ${guess}. Watch how the shape moves and try again!`;
            }

            // Force MathJax to re-render dynamically injected equations
            if (window.MathJax) {
                MathJax.typesetPromise([feedbackDiv]);
            }
        }

        // Initialize first question and start animation
        nextQuestion();
        animate();
    </script>
</body>
</html>
