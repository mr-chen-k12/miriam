<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Grade Reading Practice - Set 15 (Harvard Challenge)</title>
<style>
    /* General Styles - Harvard Crimson Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fcf8f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        position: relative;
        border: 3px solid #a51c30;
    }
    h1 {
        text-align: center;
        color: #a51c30;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #fffafb;
        padding: 20px;
        border-left: 5px solid #a51c30;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fffcfc;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #f5e6e8;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f9e8ea;
        border-color: #e2b3b8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #4a5568;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2d3748; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #a51c30; }
    .check-btn:hover { background-color: #821424; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #219653; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #fffdf9;
        border: 3px dashed #bc9b6a;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>4th Grade Reading Practice - Set 15</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #a51c30; margin: 10px 0;"></p>
        <div id="reward-container"></div>
        <p id="results-footer" style="font-size: 1.1em; color: #4a5568;"></p>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "While the lowlands of the Amazon rainforest are teeming with an incredibly dense variety of colorful plants and animal life, the high-altitude peaks of the Andes mountains remain completely ______; frozen winds sweep across rocky, snow-covered ground where almost no vegetation can take root.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["desolate", "vibrant", "tropical", "crowded"],
            correctAnswer: 0,
            explanation: "'Desolate' means empty, lonely, and lacking life or vegetation. The text states that frozen winds sweep across rocky ground where 'almost no vegetation can take root,' which directly contrasts with the teeming life of the rainforest."
        },
        {
            passage: "Sea otters play a critical role in maintaining the health of coastal kelp forests. Sea urchins eat kelp, and if left unchecked, they can destroy entire underwater ecosystems by chewing through the bases of the plants. Fortunately, sea otters hunt sea urchins aggressively, keeping their population under strict control. This allows the tall kelp stalks to thrive, which in turn provides shelter, oxygen, and food for hundreds of other marine species, from small fish to harbor seals.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Sea urchins are the favorite food source of large harbor seals.",
                "Kelp forests grow much faster in deep ocean waters than near coastal environments.",
                "Sea otters help protect coastal kelp forests by controlling the sea urchin population.",
                "Small marine fish rely entirely on sea otters to construct underwater wooden shelters."
            ],
            correctAnswer: 2,
            explanation: "The passage focuses primarily on how sea otters preserve coastal kelp ecosystems by eating sea urchins, preventing them from destroying the kelp that supports other marine wildlife."
        },
        {
            passage: "In the biography *The Marathon Maker*, the author emphasizes that achieving a grand goal requires steady perseverance through minor setbacks, rather than giving up at the first sign of physical difficulty.",
            prompt: "Which sentence from *The Marathon Maker* best supports this idea?",
            options: [
                "\"The runner wore blue lightweight sneakers with reflective silver stripes on the side.\"",
                "\"Even though a sudden muscle cramp forced her to stop and stretch for ten painful minutes during the twentieth mile, Elena refused to quit, re-entered the race, and eventually crossed the finish line to secure her medal.\"",
                "\"The weather on Saturday morning was bright, sunny, and absolutely perfect for an outdoor athletic event.\"",
                "\"Elena drank a large cup of cold water and ate half of a banana before the opening whistle blew.\""
            ],
            correctAnswer: 1,
            explanation: "This sentence shows a character encountering a painful setback (a muscle cramp) but continuing to push forward ('refused to quit', 'crossed the finish line'), which directly supports the definition of perseverance through difficulty."
        },
        {
            passage: "The desert tortoise spends up to 95 percent of its life underground in deep burrows to escape extreme environmental threats. In the scorching summer, these burrows remain cool and damp, preventing the tortoise from overheating and dehydrating. During the freezing winter, the deep tunnels insulate the tortoise from frost. Because a severe earthquake has collapsed all the underground burrows in a local nature reserve right before a record-breaking summer heatwave, scientists predict that the tortoises will ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "instantly grow thick coats of insulating fur to stay cool.",
                "face a dangerous threat from extreme heat and dehydration unless they find shelter.",
                "fly to cooler mountain ranges until the winter frost arrives.",
                "start eating solid rocks to absorb hidden mineral moisture."
            ],
            correctAnswer: 1,
            explanation: "The text explains that tortoises rely on their burrows to survive extreme summer heat and prevent dehydration. If the burrows collapse right before a heatwave, they will logically face extreme danger from heat and dehydration unless they find alternative cover."
        },
        {
            passage: "While the antique glass vase on display was incredibly **fragile**, requiring museum curators to wear velvet gloves and handle it with extreme care, the ancient stone statue next to it was thoroughly ______; it had survived centuries of exposure to wind, rain, and minor earthquakes without a single crack.",
            prompt: "Which choice completes the text with the word that is the most logical *opposite* of **fragile**?",
            options: ["delicate", "ornate", "robust", "temporary"],
            correctAnswer: 2,
            explanation: "'Robust' means strong, sturdy, and durable. This directly contrasts with 'fragile' (easily broken) and matches the description of a statue surviving centuries of storms and earthquakes without cracking."
        },
        {
            passage: "Total solar eclipses are breathtaking celestial events that attract millions of viewers globally. However, looking directly at the sun during an eclipse poses a severe danger: the intense solar radiation can permanently damage the retina of the eye, causing blindness in a matter of seconds. To eliminate this hazard, astronomers recommend using certified eclipse glasses that filter out 99.9% of harmful light rays.",
            prompt: "Which choice best describes the function of the second sentence (*'However, looking directly... seconds.'*) in the text?",
            options: [
                "It explains why solar radiation is useful for generating electricity in clean energy systems.",
                "It identifies a serious physical danger that explains why special protective gear is necessary.",
                "It provides step-by-step instructions for building a homemade cardboard telescope.",
                "It lists the historical dates of famous solar eclipses from ancient history."
            ],
            correctAnswer: 1,
            explanation: "The second sentence introduces the severe physical danger of looking at the sun, which directly sets up and explains the need for the protective eclipse glasses mentioned in the following sentence."
        },
        {
            passage: "Text 1<br>Daily homework assignments are highly beneficial for elementary students. By practicing math problems and reading chapters at home, students reinforce what they learned in class, build strong independent study habits, and perform significantly better on school exams.<br><br>Text 2<br>Assigning mandatory homework every night causes unnecessary stress for young children. After spending seven hours working hard at school, kids need free time to play outside, exercise, and rest. Forcing them to complete worksheets at night leads to mental exhaustion and reduces their actual excitement for learning.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that homework helps students 'build strong independent study habits'?",
            options: [
                "By arguing that excessive nightly assignments cause exhaustion and lower a student's actual enthusiasm for school.",
                "By agreeing that practicing math at night is the best way to ensure deep sleep.",
                "By suggesting that schools should double the amount of homework assigned on holiday weekends.",
                "By proving that children who play outside never learn how to read properly."
            ],
            correctAnswer: 0,
            explanation: "The author of Text 2 argues that forcing homework on kids leads to 'mental exhaustion' and 'reduces their actual excitement for learning,' counteracting the idea that it builds positive or beneficial learning habits."
        },
        {
            passage: "Barn owls possess exceptionally sensitive hearing, allowing them to detect the faint rustling of mice moving beneath thick grass or snow in total darkness. Their unique facial discs act like satellite dishes, funneling sound directly into their asymmetrical ears. However, heavy, torrential downpours create loud, continuous background noise that completely masks the subtle sounds made by scurrying prey. Therefore, if a massive rainstorm lasts throughout the night in a forest habitat, scientists predict that the barn owl will ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "easily catch three times as many mice as usual due to the wet conditions.",
                "experience great difficulty hunting and capturing food.",
                "use its glowing feathers to illuminate the dark forest floor.",
                "teach the woodland mice how to swim across deep rain puddles."
            ],
            correctAnswer: 1,
            explanation: "The text explains that barn owls rely on hearing faint rustling sounds to catch prey, and that heavy rain masks those sounds with loud background noise. Logically, a massive rainstorm will make it very difficult for the owl to hunt successfully."
        },
        {
            passage: "Extracting pure maple syrup from maple trees is a traditional process that depends on changing seasonal temperatures. First, in early spring, farmers drill small holes into the tree trunks and insert spouts to collect the clear, watery sap. Next, the collected sap is transported to a sugarhouse and poured into large, flat boiling pans. Then, the sap is boiled for many hours to evaporate the water content, causing the liquid to thicken and turn amber. Finally, the hot syrup is filtered to remove impurities, poured into bottles, and sealed for families to enjoy.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It compares the sugar content of maple syrup to honey and corn syrup.",
                "It outlines a chronological sequence of physical steps required to produce maple syrup from sap.",
                "It presents an argument about why maple trees should only grow in warm climates.",
                "It details the cause-and-effect relationship between tree roots and soil nutrients."
            ],
            correctAnswer: 1,
            explanation: "The passage uses sequential keywords ('First,' 'Next,' 'Then,' 'Finally') to lay out the step-by-step chronological process of making maple syrup."
        },
        {
            passage: "While the first half of the cross-country train ride was incredibly **monotonous**, featuring hours of flat, empty cornfields under a gray sky with nothing to look at, the second half of the journey was remarkably ______; the train wound through majestic snow-capped mountains, crossed roaring canyon rivers, and passed historic frontier towns filled with colorful buildings.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["tedious", "dreary", "eventful", "brief"],
            correctAnswer: 2,
            explanation: "'Eventful' means full of interesting or exciting events and sights. The vivid descriptions of mountains, roaring rivers, and colorful frontier towns show that the second half of the trip was exciting and full of variety, directly contrasting with the 'monotonous' and empty first half."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Magnificent logical analysis! 🌟</strong><br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        const rewardContainer = document.getElementById('reward-container');
        const resultsFooter = document.getElementById('results-footer');
        
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        if (score === quizData.length) {
            rewardContainer.innerHTML = `
                <div style="margin: 20px auto; padding: 20px; background-color: #fff9f9; border: 2px solid #a51c30; border-radius: 8px; max-width: 400px;">
                    <h3 style="color: #a51c30; margin-top: 0; font-size: 1.4em;">🏆 Perfect 10/10 Score! 🏆</h3>
                    <p style="font-weight: bold; color: #2c3e50; margin-bottom: 15px;">Incredible! You have officially claimed the Harvard Logo Badge:</p>
                    <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard Logo" style="max-width: 220px; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            `;
            resultsFooter.textContent = "Exemplary precision! You analyzed every single context clue, opposite meaning, and structural transition flawlessly. Review your work below.";
        } else {
            rewardContainer.innerHTML = "";
            resultsFooter.textContent = "Wonderful attempt! Take a close look at the detailed breakdowns and logical rationales provided below. Correct your understanding, try again, and achieve a perfect 10/10 to unlock your Harvard badge!";
        }
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
