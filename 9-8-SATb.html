
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 6</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 6)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Desert camels store dense fat inside their humps, allowing them to travel for weeks across dry landscapes without eating food. When water is scarce, their bodies slowly convert this stored fat into water and energy. This remarkable physical adaptation helps camels ________ long journeys through harsh, barren environments.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["endure", "surrender", "prevent", "complain"],
            correctAnswer: 0,
            explanation: "'Endure' means to withstand difficult or harsh conditions over time. Stored fat helps camels survive and complete long, difficult desert trips."
        },
        {
            passage: "Electric vehicles (EVs) produce zero tailpipe emissions, helping reduce air pollution in busy city neighborhoods. Additionally, EVs require less routine maintenance than traditional gas vehicles because their electric motors contain far fewer moving parts. These environmental and financial benefits make EVs an increasingly popular choice for commuters.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Electric vehicles offer environmental and practical benefits compared to traditional gas cars.",
                "Gasoline cars are much cheaper to repair than modern electric vehicles.",
                "Air pollution in major cities is caused entirely by large delivery trucks.",
                "Electric car batteries require many days to charge fully during long trips."
            ],
            correctAnswer: 0,
            explanation: "The passage discusses how electric vehicles reduce air pollution and require less maintenance, demonstrating their overall benefits."
        },
        {
            passage: "The Great Wall of China was constructed over centuries to protect northern borders and secure trade routes like the Silk Road. Watchtowers were built at regular intervals along the wall to store supplies and house guards. When sentries spotted approaching danger, they lit signal fires atop these towers, allowing guards to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "warn neighboring garrisons of threats across vast distances quickly.",
                "cook large meals for visiting merchants during winter storms.",
                "light up underground tunnels built deep beneath the stone wall.",
                "predict weather changes weeks before heavy rainstorms arrived."
            ],
            correctAnswer: 0,
            explanation: "Lighting signal fires atop watchtowers was a fast method used to send visual warnings to nearby troops across long distances."
        },
        {
            passage: "In 1911, explorer Roald Amundsen became the first person to reach the South Pole. Amundsen's team succeeded largely because they selected native sled dogs well-adapted to freezing weather and skied alongside them to save energy. Amundsen's careful planning and selection of equipment allowed his expedition to complete the dangerous journey safely.",
            prompt: "Which detail from the text best supports the idea that Amundsen's preparation contributed to his success?",
            options: [
                "The South Pole is located in one of the coldest regions on Earth.",
                "Amundsen chose cold-adapted sled dogs and skied to preserve energy.",
                "Several other European explorers attempted to reach the pole in the 1900s.",
                "Traditional wooden sleds were held together using leather straps."
            ],
            correctAnswer: 1,
            explanation: "Selecting well-adapted dogs and skiing alongside them directly illustrates the careful planning and preparation that helped Amundsen succeed."
        },
        {
            passage: "Octopuses are master camouflage artists in ocean waters. Specialized skin cells called chromatophores expand and contract to alter the octopus's color and texture instantly. By perfectly matching surrounding rocks or coral reefs, the octopus becomes practically ________ to passing predators.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["invisible", "noisy", "clumsy", "heavy"],
            correctAnswer: 0,
            explanation: "'Invisible' means impossible or difficult to see. Matching the color and texture of surrounding coral makes the octopus hidden from predators."
        },
        {
            passage: "Text 1\nPublic libraries are vital community hubs. They offer free access to books, internet access, and educational workshops for people of all ages.\n\nText 2\nWhile physical libraries provide good resources, operating large buildings requires substantial taxpayer funding. As digital reading grows, cities could save money by focusing on digital libraries accessible via smartphone apps.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By suggesting that digital access might be a more cost-effective alternative to maintaining physical library buildings.",
                "By arguing that children should not be allowed to read digital books on tablets.",
                "By claiming that physical libraries are the only place communities can gather.",
                "By recommending that all libraries be closed immediately without any replacement."
            ],
            correctAnswer: 0,
            explanation: "Text 2 emphasizes that operating buildings is costly and suggests digital library apps as a way for cities to save taxpayer money."
        },
        {
            passage: "Sea turtles swim thousands of miles across open ocean basins to lay eggs on the exact beaches where they hatched decades earlier. **Scientists believe sea turtles navigate using Earth's magnetic fields, which act like an invisible internal map.** This incredible sense of direction allows them to locate tiny oceanic islands across vast stretches of open water.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It explains the scientific explanation for how sea turtles navigate long distances.",
                "It describes the diet of young sea turtles hatching on sandy ocean beaches.",
                "It proves that sea turtles prefer swimming in warm tropical waters near shore.",
                "It details how sea turtles construct safe nests in high sand dunes."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence provides the scientific explanation (sensing Earth's magnetic fields) that accounts for how sea turtles navigate across oceans."
        },
        {
            passage: "The development of steam locomotives in the 19th century transformed global transportation. Before steam power, traveling inland relied on horses or walking, making long trips slow and exhausting. Trains allowed people and heavy cargo to travel across vast distances with unprecedented ________",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["efficiency", "hesitation", "delay", "discomfort"],
            correctAnswer: 0,
            explanation: "'Efficiency' refers to achieving maximum productivity with minimal wasted effort or time. Trains allowed faster, smoother transport compared to horse-drawn travel."
        },
        {
            passage: "Honey badgers are famous for their toughness and fearlessness. They possess thick, rubbery skin that protects them from bee stings and sharp quills. Their strong claws enable them to dig quickly into hard ground for prey, and they will boldly fight off larger predators like lions to protect their food.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Honey badgers possess physical traits and tough behaviors that help them survive and deter predators.",
                "Lions are the primary hunters of honey badgers in African grasslands.",
                "Honey badgers eat only honey harvested directly from wild beehives.",
                "Thick skin prevents honey badgers from running fast when escaping danger."
            ],
            correctAnswer: 0,
            explanation: "The text focuses on the honey badger's physical traits (thick skin, claws) and fearless behavior that aid its survival against predators."
        },
        {
            passage: "Hydrofoil boats feature underwater wing-like blades attached beneath their hulls. As the boat speeds up, water flowing over these foils creates upward lift, raising the ship's body completely out of the water. By eliminating hull drag against surface waves, hydrofoils are able to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "travel much faster and smoother through rough waters than traditional boats.",
                "sink safely to the ocean floor to study marine plant life.",
                "stop using engines entirely and rely on wind currents.",
                "remain parked on dry land during winter weather."
            ],
            correctAnswer: 0,
            explanation: "By lifting the boat hull out of the water to eliminate wave drag, the hydrofoil can travel smoother and at much higher speeds."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 6</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
