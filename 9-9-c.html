<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 9-9-A</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 9-9-A)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Arctic foxes have dense coats of thick fur that change color with the changing seasons. In winter, their fur turns snowy white to blend in with ice and snow, while in summer, it shifts to earthy brown or gray to match tundra rocks and soil. This adaptive camouflage allows foxes to ________ stealthily across the landscape without alerting prey.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["navigate", "abandon", "destroy", "surrender"],
            correctAnswer: 0,
            explanation: "'Navigate' means to travel or move through an area. Blending in with the scenery helps foxes move around stealthily while hunting."
        },
        {
            passage: "Mangrove forests grow along tropical coastlines where land meets sea. Their tangled root systems trap floating sediment, stabilizing shoreline soil against strong ocean waves and preventing erosion. Additionally, these dense roots create calm, sheltered nursery habitats for juvenile fish, crabs, and young marine life.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Mangrove forests protect tropical coastlines from erosion and provide vital habitats for young sea life.",
                "Tropical ocean waves destroy most plants that attempt to grow along coastal shores.",
                "Crabs and shrimp are the primary food source for larger fish living in mangrove roots.",
                "Mangrove trees can only grow in freshwater lakes located far away from the ocean."
            ],
            correctAnswer: 0,
            explanation: "The main idea combines the two core points: mangroves prevent shoreline erosion and serve as sheltered habitats for young marine animals."
        },
        {
            passage: "Bats use echolocation to navigate dark caves and hunt for insects at night. By emitting high-frequency sound waves that bounce off nearby objects, bats can determine the exact size, distance, and direction of moving targets. This sophisticated biological sonar system allows them to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "catch tiny flying insects in total darkness without relying on eyesight.",
                "fly toward bright city lights to locate larger fruit trees.",
                "hibernate underwater throughout the coldest months of winter.",
                "build strong nests out of twigs high up in tall pine trees."
            ],
            correctAnswer: 0,
            explanation: "Echolocation uses sound waves to help bats navigate and locate targets, allowing them to hunt insect prey in complete darkness."
        },
        {
            passage: "Before Johannes Gutenberg invented the movable-type printing press around 1440, books in Europe had to be copied entirely by hand. This painstaking process took months or even years for a single manuscript, making books extremely rare and expensive. Gutenberg's metal letters could be rearranged quickly to print hundreds of pages a day, dramatically lowering costs and spreading knowledge across the continent.",
            prompt: "Which detail from the text best supports the idea that Gutenberg's invention made books more accessible?",
            options: [
                "Hand-copying manuscripts required specialized tools and months of careful labor.",
                "Gutenberg's moveable metal letters allowed hundreds of pages to be printed daily, lowering costs.",
                "Ancient libraries stored rolled scrolls made from animal hides.",
                "European monks spent long hours writing inside quiet monastery rooms."
            ],
            correctAnswer: 1,
            explanation: "Printing hundreds of pages a day lowered costs, directly making books cheaper and more widely available to the public."
        },
        {
            passage: "Geothermal energy taps into natural heat stored deep within Earth's mantle. By pumping water underground into hot rock layers, power plants generate steam that drives turbines to produce electricity. Because Earth's internal heat is continuously renewed, geothermal energy is considered a ________ source of power.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["sustainable", "temporary", "harmful", "scarce"],
            correctAnswer: 0,
            explanation: "'Sustainable' means able to be maintained without depleting natural resources. Because internal heat is constantly renewed, geothermal power is sustainable."
        },
        {
            passage: "Text 1\nElectric scooters offer a convenient, eco-friendly way to travel short distances in urban areas. By replacing car trips, scooters help decrease traffic congestion and reduce carbon emissions in crowded cities.\n\nText 2\nWhile electric scooters reduce vehicle exhaust, untended scooters parked on sidewalks create trip hazards for pedestrians and block wheelchair ramps. Furthermore, frequent vandalism and battery wear lead to high repair costs for municipal programs.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By arguing that scooters present notable safety and maintenance challenges despite their environmental benefits.",
                "By claiming that electric scooters produce more carbon emissions than gasoline trucks.",
                "By suggesting that all city streets be reserved exclusively for electric scooters.",
                "By stating that pedestrians prefer walking around broken scooters on busy sidewalks."
            ],
            correctAnswer: 0,
            explanation: "Text 2 acknowledges the reduction in vehicle exhaust, but points out clear drawbacks like safety hazards and maintenance costs."
        },
        {
            passage: "Deep beneath Earth's surface, massive tectonic plates slowly slide past one another along fault lines. **When friction prevents these plates from sliding smoothly, tremendous pressure builds up until the rock suddenly slips, releasing waves of energy.** This sudden movement of Earth's crust causes the ground shaking known as an earthquake.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It explains the physical mechanism behind the sudden release of energy during an earthquake.",
                "It describes how scientists measure the temperature of underground rock layers.",
                "It proves that tectonic plates move faster near ocean trenches than on mountain ranges.",
                "It outlines steps families should take to prepare their homes for natural disasters."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence explains how friction and pressure buildup cause rocks to slip, which releases energy during an earthquake."
        },
        {
            passage: "Emperor moths possess feather-like antennae lined with thousands of microscopic nerve endings. These delicate structures allow male moths to detect tiny scent molecules released by females from miles away. This extraordinary sensitivity helps male moths ________ mates across vast distances in complete darkness.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["locate", "confuse", "frighten", "overlook"],
            correctAnswer: 0,
            explanation: "'Locate' means to find the exact position of something. Sensitive antennae help male moths track scent signals to find female mates."
        },
        {
            passage: "Sea otters are a keystone species in kelp forest ecosystems along the Pacific coast. Sea otters eat sea urchins, which feed heavily on kelp roots. Without otters to control urchin populations, the urchins overgraze and destroy entire underwater kelp forests, driving away hundreds of fish species that rely on kelp for shelter.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Sea otters play a critical role in maintaining kelp forest ecosystems by preying on sea urchins.",
                "Kelp plants grow faster in warm tropical waters near equator coastlines.",
                "Sea urchins build protective nests on rocky ocean floors to hide from fish.",
                "Pacific coastal waters are becoming too shallow for kelp forests to survive."
            ],
            correctAnswer: 0,
            explanation: "The main focus is how sea otters control sea urchin numbers, preventing the destruction of kelp forest habitats."
        },
        {
            passage: "High-speed maglev (magnetic levitation) trains do not use traditional wheels or rails. Instead, powerful electromagnets levitate the train cars a few inches above a specialized guide track and propel them forward. By floating above the track and eliminating physical wheel friction, maglev trains are able to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "travel at remarkably high speeds with a smooth, quiet ride.",
                "sink beneath riverbeds to travel safely underwater.",
                "stop using electricity by relying entirely on wind sails.",
                "carry heavy coal loads across unpaved dirt roads."
            ],
            correctAnswer: 0,
            explanation: "Eliminating wheel friction allows maglev trains to travel much faster and smoother than conventional wheeled trains."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 9-9-A</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
