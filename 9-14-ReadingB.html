<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 9-14B (Miri)</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #university-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #university-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .university-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #university-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 9-14B - Miri)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="university-reward">
            <div class="university-text" id="reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="reward-img" src="" alt="University Crest">
            <p id="reward-desc" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Arctic foxes undergo a dramatic seasonal transformation. In summer, their coats are brown or gray to blend in with tundra rocks and soil, but in winter, they grow thick white fur to match the snow. This seasonal camouflage helps them ________ detection by both prey and larger predators.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["evade", "attract", "reveal", "accelerate"],
            correctAnswer: 0,
            explanation: "'Evade' means to avoid or escape from, accurately describing how camouflage prevents predators and prey from spotting the fox."
        },
        {
            passage: "Desert tortoises survive extreme summer heat and prolonged dry spells by digging deep underground burrows. These burrows stay significantly cooler than the surface air during scorching afternoons and trap humidity to reduce water loss. Additionally, tortoises spend up to 95 percent of their lives underground to protect themselves from harsh climate conditions.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Desert tortoises rely on underground burrows to survive extreme temperatures and conserve water.",
                "Desert tortoises travel long distances across sand dunes to locate freshwater streams.",
                "Scorching summer heat causes desert plants to bloom earlier in the spring.",
                "Underground burrows are constructed primarily by desert rodents rather than reptiles."
            ],
            correctAnswer: 0,
            explanation: "The passage focuses on how desert tortoises use underground burrows as their primary strategy to survive heat and conserve moisture."
        },
        {
            passage: "Trees in temperate forests shed their leaves each autumn as daylight hours shorten and temperatures drop. Because broad leaves lose significant amounts of water through evaporation, dropping them allows trees to conserve vital water and energy throughout the frozen winter months. Consequently, trees that lose their leaves in winter are able to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "survive harsh cold periods without drying out or freezing damaged tissue.",
                "produce double the amount of fruit during freezing winter storms.",
                "absorb maximum sunlight through their roots during dark nights.",
                "grow new green foliage rapidly while temperatures remain below freezing."
            ],
            correctAnswer: 0,
            explanation: "Shedding leaves prevents water loss and tissue damage, enabling trees to survive cold winters successfully."
        },
        {
            passage: "In 1969, the Apollo 11 mission successfully landed human astronauts on the Moon for the first time in history. Millions of viewers watched live television footage as Neil Armstrong stepped onto the lunar surface and declared, 'That's one small step for man, one giant leap for mankind.' The lunar module carried advanced scientific instruments that allowed the crew to collect rock samples and record soil data before returning safely to Earth.",
            prompt: "Which detail from the text best supports the claim that the Apollo 11 mission collected physical evidence from the lunar environment?",
            options: [
                "The lunar module carried advanced scientific instruments that allowed the crew to collect rock samples.",
                "Millions of viewers watched live television footage of the landing.",
                "Neil Armstrong spoke famous words as he stepped onto the Moon.",
                "The Apollo 11 mission occurred in the summer of 1969."
            ],
            correctAnswer: 0,
            explanation: "Collecting physical rock samples directly proves that the astronauts gathered physical evidence from the Moon's surface."
        },
        {
            passage: "Coral reefs require clear, shallow water to thrive because the microscopic algae living inside coral tissues depend on sunlight for photosynthesis. When coastal pollution or muddy runoff darkens the water, sunlight cannot reach the algae, causing the coral colonies to gradually ________ and lose their vibrant colors.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["weaken", "flourish", "expand", "replicate"],
            correctAnswer: 0,
            explanation: "'Weaken' means to lose health or strength, fitting the context of corals losing vital sunlight and struggling to survive."
        },
        {
            passage: "Text 1\nHydroelectric dams produce renewable electricity by capturing energy from flowing river water. Unlike coal plants, hydroelectric facilities do not release greenhouse gases or air pollutants during power generation, making them a clean energy source.\n\nText 2\nConstructing large hydroelectric dams floods upstream land, destroying forest habitats and displacing local wildlife. Furthermore, these massive barriers block migrating fish like salmon from reaching their native spawning grounds upstream.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By pointing out that hydroelectric dams create significant environmental disruptions for land habitats and migratory fish.",
                "By claiming that hydroelectric energy is responsible for creating urban smog in major cities.",
                "By arguing that river water flows backwards whenever dams are constructed.",
                "By stating that fish prefer living in artificial reservoirs rather than flowing rivers."
            ],
            correctAnswer: 0,
            explanation: "Text 2 highlights the negative ecological impacts of dams on local wildlife habitats and fish migration, balancing Text 1's praise of clean energy."
        },
        {
            passage: "Archerfish have developed a unique hunting technique to catch insects perched on low-hanging branches above water. **By pressing their tongues against a groove in the roof of their mouth, archerfish shoot a precise jet of water up to six feet through the air.** This sudden blast knocks unsuspecting insects off leaves and into the water where the fish quickly swallows them.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It describes the physical mechanism archerfish use to shoot water jets at insects above the surface.",
                "It compares the swimming speed of archerfish with other tropical freshwater species.",
                "It explains how archerfish build hidden nests among submerged tree roots.",
                "It lists the types of aquatic plants that archerfish consume during winter months."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence details the mouth structure and physical action archerfish use to shoot water at prey."
        },
        {
            passage: "Navigating through dense jungle foliage requires specialized tools like machetes to clear tangled vines and fallen branches. Without a clear path, travelers find it nearly impossible to ________ dense vegetation without becoming disoriented or trapped.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["traverse", "demolish", "disregard", "abandon"],
            correctAnswer: 0,
            explanation: "'Traverse' means to travel across or pass through, which accurately describes moving through dense vegetation."
        },
        {
            passage: "Chameleons are renowned for changing skin colors, but this ability is primarily used for communication and body temperature regulation rather than hiding from predators. Darker shades absorb more heat when the lizard is cold, while lighter shades reflect sunlight during hot afternoons. Additionally, bright color patterns signal mood changes or warn rival chameleons to stay away.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Chameleons change color mainly to regulate body temperature and communicate, rather than to blend in with surroundings.",
                "Chameleons are the largest species of lizards residing in tropical rainforest canopy layers.",
                "Lizards living in desert environments cannot change their skin color under any circumstances.",
                "Bright colors attract dangerous predators to chameleons resting on open tree branches."
            ],
            correctAnswer: 0,
            explanation: "The passage clarifies that color changes serve temperature control and communication functions rather than pure camouflage."
        },
        {
            passage: "Electric vehicles (EVs) utilize rechargeable battery packs instead of gasoline engines to power their electric motors. Because electric motors convert stored battery energy into motion far more efficiently than internal combustion engines burn fuel, EVs waste much less energy as heat. Consequently, this high efficiency allows electric vehicles to ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "travel further on a given amount of energy compared to conventional gas-powered cars.",
                "require double the amount of oil changes each year to keep engines running smoothly.",
                "generate zero electricity while driving down steep mountain highways.",
                "eliminate the need for brakes or rubber tires during highway driving."
            ],
            correctAnswer: 0,
            explanation: "Converting energy into motion more efficiently means the vehicle can cover more distance per unit of energy used."
        }
    ];

    // Rotating award possibilities for 10/10 perfect score
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 9-14B (Miri)</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Dynamic reward selection (Rotates daily between Harvard, BU, and Yale)
        if (score === quizData.length) {
            const todayIndex = new Date().getDate() % universityRewards.length;
            const selectedReward = universityRewards[todayIndex];

            const rewardContainer = document.getElementById('university-reward');
            const rewardTitle = document.getElementById('reward-title');
            const rewardImg = document.getElementById('reward-img');
            const rewardDesc = document.getElementById('reward-desc');

            rewardContainer.style.borderColor = selectedReward.color;
            rewardTitle.style.color = selectedReward.color;
            rewardTitle.textContent = `★ FLAWLESS ACADEMIC EXCELLENCE ★`;
            rewardImg.src = selectedReward.img;
            rewardImg.alt = `${selectedReward.name} Crest`;
            rewardDesc.textContent = `You have successfully earned the ${selectedReward.name} verification crest for achieving a perfect 10/10 score!`;

            rewardContainer.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
