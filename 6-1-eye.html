<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Eye Unit Interactive Study Guide</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --white: #ffffff;
            --pulse-color: rgba(52, 152, 219, 0.6);
        }

        @keyframes selectPulse {
            0% { box-shadow: 0 0 10px 5px var(--pulse-color); transform: scale(1.05); }
            50% { box-shadow: 0 0 20px 10px var(--pulse-color); transform: scale(1.10); }
            100% { box-shadow: 0 0 10px 5px var(--pulse-color); transform: scale(1.05); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f5f7fa;
            color: var(--dark);
            margin: 0;
            padding: 10px;
            overscroll-behavior: none;
            touch-action: pan-y;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2, h3 {
            color: var(--dark);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 6px;
            background: var(--light);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--white);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .diagram-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #mobile-instructions {
            background: #eaf2f8;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .vocab-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            min-height: 60px;
            box-sizing: border-box;
        }

        .vocab-card {
            background: var(--white);
            padding: 10px 18px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            user-select: none;
        }

        .vocab-card.selected {
            background: var(--primary-dark) !important;
            color: white !important;
            border-color: #2c3e50;
            animation: selectPulse 2s infinite;
        }

        .vocab-card.dragging {
            position: fixed;
            opacity: 0.9;
            z-index: 1000;
            pointer-events: none;
            background: var(--primary);
            color: white;
            animation: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .svg-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            user-select: none;
        }

        .drop-box {
            fill: #fff;
            stroke: #7f8c8d;
            stroke-width: 2;
            stroke-dasharray: 4;
            cursor: pointer;
            pointer-events: all;
        }

        .drop-box.hovered { fill: #e8f4fd; stroke: var(--primary); }
        .drop-box.correct { fill: #e8f8f0; stroke: var(--success); stroke-dasharray: none; }
        .drop-box.incorrect { fill: #fdeaea; stroke: var(--danger); }

        .label-text {
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        /* CARD VIEW FOR SINGLE QUESTIONS */
        .quiz-card {
            background: var(--light);
            padding: 22px;
            border-radius: 12px;
            margin: 10px auto;
            max-width: 600px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .quiz-progress {
            font-size: 13px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .quiz-question-text {
            font-size: 18px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        @media(min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }

        .option-btn {
            background: var(--white);
            border: 2px solid #bdc3c7;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f7f9fa;
        }

        /* Main locked setup */
        .options-grid.answered .option-btn {
            cursor: default;
            opacity: 0.5;
        }
        .options-grid.answered .option-btn.correct,
        .options-grid.answered .option-btn.incorrect {
            opacity: 1;
        }
        .options-grid.answered .option-btn:hover {
            border-color: #bdc3c7;
            background: var(--white);
        }

        .option-btn.correct {
            background: var(--success) !important;
            color: var(--white);
            border-color: var(--success);
        }

        .option-btn.incorrect {
            background: var(--danger) !important;
            color: var(--white);
            border-color: var(--danger);
        }

        .nav-actions {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .action-btn {
            background: var(--dark);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #1a252f; }

        .alert-box {
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .alert-success { background-color: #d4edda; color: #155724; display: block; }
        .alert-danger { background-color: #f8d7da; color: #721c24; display: block; }

        .gap-complete-card {
            background: #e8f8f0;
            border: 2px solid var(--success);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            color: #155724;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👁️ Eye Unit Interactive Study Assistant</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('diagram')">Labeling Activity</button>
        <button class="tab-btn" onclick="switchTab('quiz')">Concepts Quiz</button>
        <button class="tab-btn" onclick="switchTab('reverse')">Reverse Quiz</button>
        <button class="tab-btn" onclick="switchTab('mistakes')">Review Gaps</button>
    </div>

    <div id="feedback-alert" class="alert-box"></div>

    <div id="tab-diagram" class="tab-content active">
        <h2>Practice Labeling</h2>
        <div id="mobile-instructions">
            📱 <strong>Mobile/Tablet Users:</strong> Drag the word cards with your finger and drop them into the target boxes. (Or tap a word, then tap a box).
        </div>
        <div class="diagram-layout">

                        <path d="M 120 200 Q 118 205 120 210"/><path d="M 120 210 Q 118 215 120 220"/><path d="M 120 220 Q 118 225 120 230"/>

                    <path d="M 140 160 A 100 100 0 0 1 310 150" fill="none" stroke="#f1948a" stroke-width="4"/>

                    <g class="drop-zone" data-label="Vitreous Humor">
                        <rect x="385" y="342" width="165" height="35" rx="5" class="drop-box"/>

                </svg>
            </div>
            <button class="tab-btn" style="background-color: var(--dark); color: #fff; max-width: 200px;" onclick="resetDiagram()">Reset Diagram</button>
        </div>
    </div>

    <div id="tab-quiz" class="tab-content">
        <h2>Concepts Quiz</h2>
        <div id="quiz-card-container"></div>
    </div>

    <div id="tab-reverse" class="tab-content">
        <h2>Reverse Vocabulary Quiz</h2>
        <div id="reverse-card-container"></div>
    </div>

    <div id="tab-mistakes" class="tab-content">
        <h2>Review Practice Gaps</h2>
        <div id="gaps-card-container"></div>
    </div>
</div>

<script>
    const rawAnatomyTerms = ["Sclera", "Cornea", "Pupil", "Iris", "Lens", "optic nerve", "Retina", "Vitreous Humor"];
    
    const conceptualQuestions = [
        { id: "q1", text: "What is the primary function of Blinking according to your study guide?", options: ["To let light enter the eye", "Used as a protection", "To carry information to the brain", "To focus on objects"], answer: "Used as a protection" },
        { id: "q2", text: "How does the Pupil behave when walking into a dark room?", options: ["It gets smaller", "It stays completely unchanged", "It gets larger", "It changes its physical color"], answer: "It gets larger" },
        { id: "q3", text: "How does the Pupil behave when stepping into a brightly lit room?", options: ["It gets smaller", "It gets larger", "It disappears", "It expands to let more light in"], answer: "It gets smaller" },
        { id: "q4", text: "What structure functions as a transparent dome in front of the colored part of the eye, behaving like a window to the world?", options: ["Retina", "Sclera", "Iris", "Cornea"], answer: "Cornea" },
        { id: "q5", text: "What is the function of the Nerve Cell (Optic Nerve)?", options: ["It acts as a colorful part of the eye", "It carries information from the eye to the brain", "It opens and closes the eye as protection", "It protects the white portion of the eye"], answer: "It carries information from the eye to the brain" },
        { id: "q6", text: "When does an Optical Illusion occur?", options: ["When the pupil gets smaller", "When the lens turns transparent", "When the eyes trick the brain", "When the sclera changes color"], answer: "When the eyes trick the brain" },
        { id: "q7", text: "Which explicit example of an optical illusion was highlighted on your class study guide?", options: ["A spinning colorful circle pattern", "A 3D cube illustration on paper", "A picture of an old woman that also looks like a young woman", "Parallel straight lines that appear bent"], answer: "A picture of an old woman that also looks like a young woman" }
    ];

    const reverseQuestions = [
        { id: "r1", text: "This part of the eye gets larger when the room is dark and smaller when it is bright.", options: ["Iris", "Pupil", "Lens", "Sclera"], answer: "Pupil" },
        { id: "r2", text: "This functions as a transparent dome in front of the colored part of the eye, like a window.", options: ["Retina", "Cornea", "Optic Nerve", "Vitreous Humor"], answer: "Cornea" },
        { id: "r3", text: "This part carries visual information directly from the eye to your brain.", options: ["Iris", "Pupil", "Optic Nerve", "Sclera"], answer: "Optic Nerve" },
        { id: "r4", text: "This is the tough, white protective outer structure of the eye.", options: ["Sclera", "Retina", "Lens", "Iris"], answer: "Sclera" },
        { id: "r5", text: "This is the colorful part of your eye that controls light entry.", options: ["Lens", "Pupil", "Cornea", "Iris"], answer: "Iris" },
        { id: "r6", text: "This layer acts like the film screen at the back of the eye where images are focused.", options: ["Sclera", "Retina", "Vitreous Humor", "Cornea"], answer: "Retina" },
        { id: "r7", text: "This clear gel fills the large space inside the back of the eyeball to maintain its shape.", options: ["Vitreous Humor", "Lens", "Pupil", "Cornea"], answer: "Vitreous Humor" }
    ];

    let selectedTermElement = null;
    let selectedTermValue = "";
    let activeTouchElement = null;
    let touchStartX = 0;
    let touchStartY = 0;

    // Index tracking for one-at-a-time display
    let currentQuizIndex = 0;
    let currentReverseIndex = 0;
    let currentGapIndex = 0;

    function getStoredMistakes() {
        let stored = localStorage.getItem('eye_exam_gaps_v2');
        return stored ? JSON.parse(stored) : { anatomy: [], concepts: [], reverse: [] };
    }

    function saveMistakes(mistakes) {
        localStorage.setItem('eye_exam_gaps_v2', JSON.stringify(mistakes));
    }

    function addMistake(type, item) {
        let mistakes = getStoredMistakes();
        if(!mistakes[type].includes(item)) {
            mistakes[type].push(item);
            saveMistakes(mistakes);
        }
    }

    function removeMistake(type, item) {
        let mistakes = getStoredMistakes();
        mistakes[type] = mistakes[type].filter(i => i !== item);
        saveMistakes(mistakes);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        const currentBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.getAttribute('onclick').includes(tabName));
        if(currentBtn) currentBtn.classList.add('active');
        
        document.getElementById(`tab-${tabName}`).classList.add('active');
        clearAlert();

        if(tabName === 'quiz') initializeConceptsQuiz();
        if(tabName === 'reverse') initializeReverseQuiz();
        if(tabName === 'mistakes') renderMistakesRoom();
    }

    function showAlert(text, type) {
        const alertBox = document.getElementById('feedback-alert');
        alertBox.innerText = text;
        alertBox.className = `alert-box alert-${type}`;
        setTimeout(clearAlert, 4000);
    }

    function clearAlert() {
        document.getElementById('feedback-alert').style.display = 'none';
    }

    function selectCard(cardElement, termValue) {
        document.querySelectorAll('.vocab-card').forEach(c => c.classList.remove('selected'));
        if (selectedTermElement === cardElement) {
            selectedTermElement = null;
            selectedTermValue = "";
        } else {
            selectedTermElement = cardElement;
            selectedTermValue = termValue;
            cardElement.classList.add('selected');
        }
    }

    // --- SETUP DIAGRAM LABELING GAME ---
    function initializeDiagramGame() {
        const bank = document.getElementById('vocab-bank');
        bank.innerHTML = '';
        selectedTermElement = null;
        selectedTermValue = "";
        
        const shuffled = [...rawAnatomyTerms].sort(() => Math.random() - 0.5);
        shuffled.forEach(term => {
            const card = document.createElement('div');
            card.className = 'vocab-card';
            card.innerText = term;
            card.id = `card-${term.replace(/\s+/g, '_')}`;
            card.draggable = true;

            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', term);
                selectCard(card, term);
            });
            
            // Touch Drag Mechanics
            card.addEventListener('touchstart', (e) => {
                if (activeTouchElement) return;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                activeTouchElement = card;
                selectCard(card, term);
                const rect = card.getBoundingClientRect();
                activeTouchElement.initialTouchOffset = { x: rect.width / 2, y: rect.height / 2 };
            }, {passive: false});
            
            card.addEventListener('touchmove', (e) => {
                if (activeTouchElement !== card) return;
                const touch = e.touches[0];
                e.preventDefault();
                if (Math.abs(touch.clientX - touchStartX) > 10 || Math.abs(touch.clientY - touchStartY) > 10) {
                    activeTouchElement.classList.add('dragging');
                }
                if (activeTouchElement.classList.contains('dragging')) {
                    activeTouchElement.style.left = (touch.clientX - activeTouchElement.initialTouchOffset.x) + 'px';
                    activeTouchElement.style.top = (touch.clientY - activeTouchElement.initialTouchOffset.y) + 'px';
                }
            }, {passive: false});

            card.addEventListener('touchend', (e) => {
                if (activeTouchElement !== card) return;
                const touch = e.changedTouches[0];
                e.preventDefault();
                if (activeTouchElement.classList.contains('dragging')) {
                    activeTouchElement.classList.remove('dragging');
                    activeTouchElement.style.left = '0';
                    activeTouchElement.style.top = '0';
                    activeTouchElement.style.display = 'none';
                    let droppedOver = document.elementFromPoint(touch.clientX, touch.clientY);
                    activeTouchElement.style.display = 'block';

                    if (droppedOver && (droppedOver.classList.contains('drop-box') || droppedOver.classList.contains('label-text'))) {
                        let targetBox = droppedOver.classList.contains('label-text') ? droppedOver.parentElement.querySelector('.drop-box') : droppedOver;
                        const targetLabel = targetBox.parentElement.getAttribute('data-label');
                        const textElement = targetBox.parentElement.querySelector('.label-text');
                        evaluateLabelDrop(term, targetLabel, targetBox, textElement);
                    }
                    activeTouchElement = null;
                } else {
                    activeTouchElement = null;
                }
            }, {passive: false});

            card.addEventListener('click', () => { selectCard(card, term); });
            bank.appendChild(card);
        });

        document.querySelectorAll('.drop-zone').forEach(zone => {
            const box = zone.querySelector('.drop-box');
            const txt = zone.querySelector('.label-text');
            const targetLabel = zone.getAttribute('data-label');

            box.addEventListener('dragover', (e) => e.preventDefault());
            box.addEventListener('drop', (e) => {
                e.preventDefault();
                const droppedTerm = e.dataTransfer.getData('text/plain') || selectedTermValue;
                evaluateLabelDrop(droppedTerm, targetLabel, box, txt);
            });

            const handleTargetClick = (e) => {
                e.preventDefault();
                if(selectedTermValue) evaluateLabelDrop(selectedTermValue, targetLabel, box, txt);
            };
            box.addEventListener('click', handleTargetClick);
            box.addEventListener('touchstart', handleTargetClick, {passive: false});
        });
    }

    function evaluateLabelDrop(chosenTerm, correctTarget, boxElement, textElement) {
        if (!chosenTerm) return;
        if (chosenTerm.toLowerCase() === correctTarget.toLowerCase()) {
            boxElement.className = "drop-box correct";
            textElement.textContent = chosenTerm;
            const card = document.getElementById(`card-${chosenTerm.replace(/\s+/g, '_')}`);
            if(card) card.remove();
            showAlert(`Correct! That is the ${chosenTerm}.`, 'success');
            removeMistake('anatomy', correctTarget);
            selectedTermElement = null;
            selectedTermValue = "";
        } else {
            boxElement.className = "drop-box incorrect";
            showAlert(`Incorrect placement. Try again!`, 'danger');
            addMistake('anatomy', correctTarget);
            setTimeout(() => { if(!boxElement.classList.contains('correct')) boxElement.className = "drop-box"; }, 1500);
        }
    }

    function resetDiagram() {
        document.querySelectorAll('.drop-box').forEach(b => b.className = "drop-box");
        document.querySelectorAll('.label-text').forEach(t => t.textContent = "");
        initializeDiagramGame();
    }

    // --- SETUP SINGLE-QUESTION CONCEPT QUIZ ---
    function initializeConceptsQuiz() {
        const container = document.getElementById('quiz-card-container');
        container.innerHTML = '';

        if (currentQuizIndex >= conceptualQuestions.length) {
            container.innerHTML = `
                <div class="gap-complete-card">
                    <h3>🎉 Quiz Finished!</h3>
                    <p>Excellent progress. Use the tabs above to label structures or view flagged mistakes.</p>
                    <button class="action-btn" onclick="currentQuizIndex=0; initializeConceptsQuiz();">Restart Quiz</button>
                </div>`;
            return;
        }

        const q = conceptualQuestions[currentQuizIndex];
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
            <div class="quiz-progress">Question ${currentQuizIndex + 1} of ${conceptualQuestions.length}</div>
            <p class="quiz-question-text">${q.text}</p>
        `;

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-grid';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            const handleAns = (e) => {
                e.preventDefault();
                if (optionsDiv.classList.contains('answered')) return;
                optionsDiv.classList.add('answered');
                
                if (opt === q.answer) {
                    btn.classList.add('correct');
                    showAlert("Correct summary!", "success");
                    removeMistake('concepts', q.id);
                } else {
                    btn.classList.add('incorrect');
                    addMistake('concepts', q.id);
                    showAlert("Incorrect choice. Added to study gaps.", "danger");
                    optionsDiv.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); });
                }
                document.getElementById('quiz-next-btn').style.display = 'block';
            };
            btn.addEventListener('click', handleAns);
            btn.addEventListener('touchstart', handleAns, {passive: false});
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'nav-actions';
        actionsDiv.innerHTML = `<button id=\"quiz-next-btn\" class=\"action-btn\" style=\"display:none;\">Next Question ➔</button>`;
        card.appendChild(actionsDiv);
        container.appendChild(card);

        document.getElementById('quiz-next-btn').onclick = () => {
            currentQuizIndex++;
            initializeConceptsQuiz();
        };
    }

    // --- SETUP REVERSE VOCABULARY QUIZ ---
    function initializeReverseQuiz() {
        const container = document.getElementById('reverse-card-container');
        container.innerHTML = '';

        if (currentReverseIndex >= reverseQuestions.length) {
            container.innerHTML = `
                <div class="gap-complete-card">
                    <h3>🎉 Reverse Quiz Finished!</h3>
                    <p>Fantastic job tracking descriptions to components!</p>
                    <button class="action-btn" onclick="currentReverseIndex=0; initializeReverseQuiz();">Restart Quiz</button>
                </div>`;
            return;
        }

        const q = reverseQuestions[currentReverseIndex];
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
            <div class="quiz-progress">Reverse Match ${currentReverseIndex + 1} of ${reverseQuestions.length}</div>
            <p class="quiz-question-text">Identify the structure: "<em>${q.text}</em>"</p>
        `;

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-grid';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            const handleAns = (e) => {
                e.preventDefault();
                if (optionsDiv.classList.contains('answered')) return;
                optionsDiv.classList.add('answered');
                
                if (opt === q.answer) {
                    btn.classList.add('correct');
                    showAlert("Perfect description match!", "success");
                    removeMistake('reverse', q.id);
                } else {
                    btn.classList.add('incorrect');
                    addMistake('reverse', q.id);
                    showAlert("Incorrect. Structural gap recorded.", "danger");
                    optionsDiv.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); });
                }
                document.getElementById('reverse-next-btn').style.display = 'block';
            };
            btn.addEventListener('click', handleAns);
            btn.addEventListener('touchstart', handleAns, {passive: false});
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'nav-actions';
        actionsDiv.innerHTML = `<button id=\"reverse-next-btn\" class=\"action-btn\" style=\"display:none;\">Next Question ➔</button>`;
        card.appendChild(actionsDiv);
        container.appendChild(card);

        document.getElementById('reverse-next-btn').onclick = () => {
            currentReverseIndex++;
            initializeReverseQuiz();
        };
    }

    // --- MASTER GAP ROOM: DRILL UNTIL CORRECT (ONE BY ONE) ---
    function renderMistakesRoom() {
        const container = document.getElementById('gaps-card-container');
        container.innerHTML = '';
        const mistakes = getStoredMistakes();

        // Compile list of unresolved questions across activities
        let activeGaps = [];

        mistakes.anatomy.forEach(label => {
            activeGaps.push({ type: 'anatomy', raw: label, heading: 'Anatomy Placement Gap', text: `Where belongs the label structure: "${label}" on your diagram?` });
        });
        mistakes.concepts.forEach(qId => {
            const match = conceptualQuestions.find(c => c.id === qId);
            if(match) activeGaps.push({ type: 'concepts', raw: match, heading: 'Concept Quiz Mistake', text: match.text, options: match.options, answer: match.answer });
        });
        mistakes.reverse.forEach(rId => {
            const match = reverseQuestions.find(r => r.id === rId);
            if(match) activeGaps.push({ type: 'reverse', raw: match, heading: 'Reverse Description Mistake', text: match.text, options: match.options, answer: match.answer });
        });

        if (activeGaps.length === 0) {
            container.innerHTML = `
                <div class="gap-complete-card">
                    <h3>🎉 All Gaps Cleared!</h3>
                    <p>There are no recorded mistakes right now. Keep practice testing to check your knowledge.</p>
                </div>`;
            return;
        }

        if (currentGapIndex >= activeGaps.length) {
            currentGapIndex = 0; // wrap around
        }

        const currentGap = activeGaps[currentGapIndex];
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.style.borderLeft = "5px solid var(--danger)";
        card.innerHTML = `
            <div class="quiz-progress">${currentGap.heading} (Item ${currentGapIndex + 1} of ${activeGaps.length})</div>
            <p class="quiz-question-text">${currentGap.text}</p>
        `;

        if (currentGap.type === 'anatomy') {
            card.innerHTML += `<p style="color:#7f8c8d;">➜ Head to the <strong>Labeling Activity</strong> tab to correct this dynamic visual entry.</p>`;
            const navDiv = document.createElement('div');
            navDiv.className = 'nav-actions';
            
            if(activeGaps.length > 1) {
                navDiv.innerHTML = `<button class="action-btn" onclick="currentGapIndex++; renderMistakesRoom();">Skip / Next Gap ➔</button>`;
            }
            card.appendChild(navDiv);
        } else {
            // Interactive Multiple Choice Card - DRILL UNTIL CORRECT
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options-grid';

            currentGap.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                
                const processGapChoice = (e) => {
                    e.preventDefault();
                    // Block execution if they already found the correct one
                    if(optionsDiv.classList.contains('resolved')) return;

                    if (opt === currentGap.answer) {
                        btn.className = "option-btn correct";
                        optionsDiv.classList.add('resolved');
                        showAlert("Correct! Gap resolved.", "success");
                        
                        // Clear from dynamic registry
                        if(currentGap.type === 'concepts') removeMistake('concepts', currentGap.raw.id);
                        if(currentGap.type === 'reverse') removeMistake('reverse', currentGap.raw.id);
                        
                        document.getElementById('gap-resolve-btn').style.display = 'block';
                    } else {
                        btn.className = "option-btn incorrect";
                        showAlert("Still incorrect. Keep trying options until you find the right one!", "danger");
                    }
                };
                
                btn.addEventListener('click', processGapChoice);
                btn.addEventListener('touchstart', processGapChoice, {passive: false});
                optionsDiv.appendChild(btn);
            });

            card.appendChild(optionsDiv);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'nav-actions';
            actionsDiv.innerHTML = `<button id="gap-resolve-btn" class="action-btn" style="display:none; background-color: var(--success);">Continue Practice ➔</button>`;
            card.appendChild(actionsDiv);
        }

        container.appendChild(card);

        const resBtn = document.getElementById('gap-resolve-btn');
        if(resBtn) {
            resBtn.onclick = () => {
                // Refresh list
                renderMistakesRoom();
            };
        }
    }

    window.onload = () => {
        initializeDiagramGame();
    };
</script>
</body>
</html>
