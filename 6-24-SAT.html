<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3rd Grade Reading Practice - Set 10 (Harvard Challenge)</title>
<style>
    /* General Styles - Harvard Crimson Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fcf8f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        position: relative;
        border: 3px solid #a51c30;
    }
    h1 {
        text-align: center;
        color: #a51c30;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #fffafb;
        padding: 20px;
        border-left: 5px solid #a51c30;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fffcfc;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #f5e6e8;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f9e8ea;
        border-color: #e2b3b8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #4a5568;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2d3748; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #a51c30; }
    .check-btn:hover { background-color: #821424; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #219653; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #fffdf9;
        border: 3px dashed #bc9b6a;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>3rd Grade Reading Practice - Set 10</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #a51c30; margin: 10px 0;"></p>
        <div id="reward-container"></div>
        <p id="results-footer" style="font-size: 1.1em; color: #4a5568;"></p>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "Although the tiny hummingbird is famous for its fast, buzzing wings that beat eighty times per second while flying from flower to flower, it can remain surprisingly ______ when guarding its nest; it perches perfectly still on a small twig, blending into the leaves without moving a feather.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["noisy", "motionless", "excited", "careless"],
            correctAnswer: 1,
            explanation: "'Motionless' means completely still without moving. The text explains that the hummingbird sits 'perfectly still' and blends into leaves 'without moving a feather,' which contrasts directly with its usually fast wings."
        },
        {
            passage: "Leafcutter ants are the ultimate farmers of the insect world. Instead of eating the leaves they cut from tall trees, they carry the green pieces underground into large chambers. There, they chew the leaves up into a mushy paste to grow a special kind of fungus. The ants take great care of this underground garden because the fungus is the only source of food for their entire colony.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Leafcutter ants enjoy climbing to the tops of very tall trees.",
                "Fungus is a plant that grows best during heavy summer rainstorms.",
                "Leafcutter ants use leaves to grow an underground fungus garden for food.",
                "Ant paste can be used to repair broken tunnels in a colony nest."
            ],
            correctAnswer: 2,
            explanation: "The passage explains the complete process of how leafcutter ants gather leaves not to eat them directly, but to cultivate an underground fungus garden that feeds the colony."
        },
        {
            passage: "In the book 'The Secret Reef', Coral's grandmother explains that small, daily helpful choices by individuals can combine to protect an entire ocean sanctuary over time.",
            prompt: "Which sentence from 'The Secret Reef' best supports the grandmother's idea?",
            options: [
                "\"The wooden dock creaked loudly every time a large wave crashed against the shore.\"",
                "\"Coral found a shiny yellow seashell hidden under a patch of green seaweed.\"",
                "\"Even though picking up one plastic wrapper from the beach each morning seemed tiny, when every child in the town did it for a year, the coral reef became completely free of trash.\"",
                "\"The marine scientists wore blue life jackets while riding on the fast motorboat.\""
            ],
            correctAnswer: 2,
            explanation: "This sentence directly shows how individual small actions ('picking up one plastic wrapper each morning') accumulate into a massive positive outcome ('completely free of trash'), supporting the grandmother's philosophy."
        },
        {
            passage: "Hot air balloons rise into the sky because hot air is lighter and less dense than the cold air surrounding the outside of the balloon. To climb higher, the pilot turns on a powerful propane burner to heat the air inside the giant fabric envelope. However, if the pilot turns off the burner and lets the air inside the balloon cool down completely, the balloon will lose its lifting power. Therefore, to land the balloon safely on the grass at the end of a flight, the pilot must ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "make the burner flame twice as hot as before.",
                "allow the air inside the balloon to gradually cool down.",
                "throw all the fabric blankets out into the sky.",
                "wait for a heavy snowstorm to push the balloon higher."
            ],
            correctAnswer: 1,
            explanation: "The text states that cooling the air inside causes the balloon to lose lifting power and drop. To descend and land safely on the grass, the pilot must logically allow that air to cool down."
        },
        {
            passage: "Even though the morning of the big school play was completely chaotic, with actors losing their costumes and scenery falling over, the evening performance was remarkably ______; every student stood in the right spot, the music played at the exact right time, and the audience clapped wildly.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["orderly", "loud", "messy", "frightening"],
            correctAnswer: 0,
            explanation: "'Orderly' means neat, organized, and running smoothly. The description of students being in the right spots and everything working perfectly contrasts with the 'chaotic' morning."
        },
        {
            passage: "For hundreds of years, authors used feathered quills dipped in liquid ink wells to write books, which required them to freeze every few seconds to blot away large, messy wet ink smudges. However, if a writer moved too quickly, the wet ink would smear across the entire page, ruining hours of careful work. To fix this frustrating issue, inventors built the ballpoint pen, which uses a tiny rolling ball to deliver dry, smudge-free ink instantly.",
            prompt: "Which choice best describes what the second sentence ('However, if... work.') does in the text?",
            options: [
                "It describes what kinds of stories early authors liked to write down.",
                "It introduces a major flaw with using feathered quills that led to a new invention.",
                "It proves that early inventors did not know how to read or write books.",
                "It lists step-by-step instructions for mixing blue ink at home."
            ],
            correctAnswer: 1,
            explanation: "The second sentence highlights the severe drawback of quills (ink easily smeared and ruined pages), providing the direct context for why the ballpoint pen was eventually invented."
        },
        {
            passage: "Text 1<br>Assigning daily homework is excellent for young children because it builds strong personal discipline. Sitting down every evening to practice spelling words or math equations teaches students how to manage their time and review what they learned in class.<br><br>Text 2<br>Forcing elementary students to complete hours of homework every night is a mistake. Children spend seven hours sitting at desks in school, and when they come home, they need unstructured playtime outside to move their bodies, explore nature, and let their brains rest.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that homework 'builds strong personal discipline'?",
            options: [
                "By agreeing that math equations are the best way to help kids fall asleep at night.",
                "By arguing that outdoor playtime and brain rest are more valuable for a child's development than extra desk work at home.",
                "By suggesting that teachers should move their desks out into the school playground.",
                "By showing that kids who do homework always forget how to play outside."
            ],
            correctAnswer: 1,
            explanation: "Text 2 directly argues that children need movement, outdoor play, and rest after a long school day, indicating that the author values these experiences above the desk-bound discipline described in Text 1."
        },
        {
            passage: "Sea otters live in cold ocean waters and rely on thick underwater kelp forests for protection. They wrap themselves in the long, floating kelp leaves to keep from drifting away in rough ocean currents while they sleep. However, sea urchins love to eat the roots of kelp, and if the urchin population grows too large, they will destroy entire underwater forests, leaving the otters with nowhere to rest. Because a nearby marine park just introduced a protective zone that keeps the sea urchin population small and balanced, scientists believe that ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "the kelp forests will grow thick and provide safe shelters for the otters.",
                "sea otters will learn to fly out of the water to sleep in trees.",
                "the ocean currents will instantly stop moving completely.",
                "sea urchins will start building nests out of dry sticks on the beach."
            ],
            correctAnswer: 0,
            explanation: "Since sea urchins destroy the kelp forests that otters need, keeping the urchin population small and balanced means the kelp forests will be preserved, providing the necessary safe shelter for the otters."
        },
        {
            passage: "To make sweet maple syrup, farmers drill a small hole into a maple tree during early spring and hang a bucket to collect the clear, watery sap. Next, they pour the collected sap into a massive metal boiling pan. Then, they heat the pan over a hot wood fire for hours to evaporate the extra water. Finally, as the liquid thickens and turns a deep golden brown, they filter the sticky syrup into glass jars to serve on warm pancakes.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It tells an imaginary story about a magical maple tree that could talk.",
                "It outlines a scientific experiment comparing maple trees to oak trees.",
                "It lists the sequential steps used to transform watery tree sap into thick syrup.",
                "It argues that pancakes taste much better than waffles or toast."
            ],
            correctAnswer: 2,
            explanation: "The passage uses sequential milestones ('Next,' 'Then,' 'Finally') to organize and describe the chronological steps of producing maple syrup from raw sap."
        },
        {
            passage: "While the first mile of the hiking trail was incredibly steep and treacherous, forcing the family to scramble up slippery mud slopes and climb over sharp boulders, the final mile was remarkably ______; it was a completely flat, wide dirt path that wound smoothly through a quiet meadow.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["easy", "dangerous", "narrow", "windy"],
            correctAnswer: 0,
            explanation: "'Easy' means requiring little effort or presenting no difficulties. The description of a completely flat, wide, and smooth path contrasts directly with the steep, slippery, and 'treacherous' first mile."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Masterful analysis! 🌟</strong><br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        const rewardContainer = document.getElementById('reward-container');
        const resultsFooter = document.getElementById('results-footer');
        
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        if (score === quizData.length) {
            rewardContainer.innerHTML = `
                <div style="margin: 20px auto; padding: 20px; background-color: #fff9f9; border: 2px solid #a51c30; border-radius: 8px; max-width: 400px;">
                    <h3 style="color: #a51c30; margin-top: 0; font-size: 1.4em;">🏆 Flawless 10/10 Score! 🏆</h3>
                    <p style="font-weight: bold; color: #2c3e50; margin-bottom: 15px;">Congratulations! You have earned the Harvard Logo:</p>
                    <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard Logo" style="max-width: 220px; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            `;
            resultsFooter.textContent = "Magnificent! A true scholar's performance. Review your flawless work below.";
        } else {
            rewardContainer.innerHTML = "";
            resultsFooter.textContent = "Take a close look at the detailed rationales below. Try again to hit that perfect 10/10 milestone and unlock your Harvard reward badge!";
        }
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
