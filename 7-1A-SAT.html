<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th Grade Reading Practice - Set 13 (Harvard Challenge)</title>
<style>
    /* General Styles - Harvard Crimson Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fcf8f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        position: relative;
        border: 3px solid #a51c30;
    }
    h1 {
        text-align: center;
        color: #a51c30;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #fffafb;
        padding: 20px;
        border-left: 5px solid #a51c30;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fffcfc;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #f5e6e8;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f9e8ea;
        border-color: #e2b3b8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #4a5568;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2d3748; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #a51c30; }
    .check-btn:hover { background-color: #821424; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #219653; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #fffdf9;
        border: 3px dashed #bc9b6a;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>4th Grade Reading Practice - Set 13</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #a51c30; margin: 10px 0;"></p>
        <div id="reward-container"></div>
        <p id="results-footer" style="font-size: 1.1em; color: #4a5568;"></p>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "While many deep-sea creatures possess glowing bioluminescent features that make them instantly prominent against the dark waters, the mimic octopus remains uniquely ______; by dynamically shifting its cellular skin color and texture, it blends flawlessly into muddy sea floors, perfectly matching surrounding rocks and weeds to escape discovery.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["conspicuous", "unobtrusive", "aggressive", "sluggish"],
            correctAnswer: 1,
            explanation: "'Unobtrusive' means not conspicuous, unnoticeable, or blending in well. The passage explains that the mimic octopus shifts its skin to blend 'flawlessly' into muddy sea floors to avoid detection, directly contrasting with creatures that are 'instantly prominent.'",
        },
        {
            passage: "Beavers are frequently described as nature's premier ecosystem engineers. By harvesting branches to construct complex wooden dams across swift streams, they slow down water currents and flood small areas of forestland. This engineering process creates expansive, slow-moving wetlands that act as natural filters to purify water. Furthermore, these newly formed ponds provide vital habitats for a diverse array of ducks, frogs, and rare water insects that could not survive in fast-flowing rivers.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Beavers prefer to hunt for small water insects along fast-flowing rivers.",
                "Fast-moving forest streams are dangerous environments for most species of frogs.",
                "Beavers use mud and sticks to build shelters that defend them against large predators.",
                "Beaver dams alter water flow to create vital wetland ecosystems that support diverse wildlife."
            ],
            correctAnswer: 3,
            explanation: "The text focuses on how beaver dams slow down water, create wetlands, filter the water, and provide necessary habitats for various wildlife species.",
        },
        {
            passage: "In the adventure story *The Hidden Valley*, the author emphasizes that resourcefulness is the ability to look at an ordinary, everyday item and creatively adapt it to solve an unexpected problem.",
            prompt: "Which sentence from *The Hidden Valley* best supports this idea?",
            options: [
                "\"The dark canyon walls stretched high into the afternoon sky, blocking out most of the warm sunlight.\"",
                "\"Clara remembered seeing a map of the entire mountain range inside the old wooden welcome center.\"",
                "\"Instead of giving up when her flashlight bracket snapped, Clara unfastened her elastic hairband, wrapped it tightly around the metal cylinder, and secured the light firmly to her bicycle handlebars so she could safely navigate the darkening trail.\"",
                "\"The silver bicycle tires were caked in thick, dark mud after the heavy downpour.\""
            ],
            correctAnswer: 2,
            explanation: "This sentence directly demonstrates a character taking an ordinary object (an elastic hairband) and adapting it to fix a completely different problem (a broken flashlight bracket), which matches the text's definition of resourcefulness.",
        },
        {
            passage: "The carnivorous Venus flytrap grows in nutrient-poor bogs and relies on trapping insects to supplement its diet. The interior of each trap features tiny, sensitive trigger hairs. To prevent the plant from wasting energy closing its leaves on falling raindrops or windblown debris, the trap will only snap shut if an object touches two different trigger hairs within a twenty-second window. Therefore, if a crawling ant steps on only a single trigger hair and then immediately departs the leaf, the Venus flytrap will ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "snap shut instantly to trap the ant anyway.",
                "remain completely open and conserve its mechanical energy.",
                "wilt immediately from a total lack of essential nutrients.",
                "absorb water directly from the air to reset its internal timer."
            ],
            correctAnswer: 1,
            explanation: "The passage states that the trap requires *two* different hairs to be touched within twenty seconds to avoid wasting energy. If only one hair is touched, the trap will logically remain open to conserve energy.",
        },
        {
            passage: "While the waters near the busy industrial shipping port had become heavily **contaminated** due to fuel spills and chemical runoff, the remote mountain lake remained completely ______; its crystalline waters were so pure that observers could easily spot tiny pebbles resting on the lakebed twenty feet below.",
            prompt: "Which choice completes the text with the word that is the most logical *opposite* of **contaminated**?",
            options: ["turbid", "pristine", "hazardous", "shallow"],
            correctAnswer: 1,
            explanation: "'Pristine' means pure, unpolluted, and completely clean. This is the exact opposite of 'contaminated,' and matches the description of 'crystalline waters' that are 'so pure.'",
        },
        {
            passage: "Early astronomical tracking relied entirely on optical telescopes, which collected visible light to view distant stars and planets. However, this method had a significant limitation: dense interstellar dust clouds routinely blocked visible light, rendering vast regions of the galaxy completely invisible to scientists on Earth. To resolve this frustrating obstacle, twentieth-century engineers built radio telescopes, which successfully detect invisible radio waves that pass through cosmic dust clouds without interference.",
            prompt: "Which choice best describes the function of the second sentence (*'However, this method... Earth.'*) in the text?",
            options: [
                "It lists the standard materials needed to construct an optical lens.",
                "It describes how twentieth-century engineers discovered radio waves.",
                "It identifies a critical limitation of optical telescopes that motivated a new technological development.",
                "It argues that interstellar dust clouds are expanding across the galaxy."
            ],
            correctAnswer: 2,
            explanation: "The second sentence explains the major flaw or constraint of optical telescopes (dust blocking visible light), setting up the problem that radio telescopes were designed to fix.",
        },
        {
            passage: "Text 1<br>Electric vehicles (EVs) are the ultimate solution for reducing urban air pollution. By relying completely on battery power rather than burning gasoline, these vehicles emit zero exhaust fumes from their tailpipes, vastly improving air quality and protecting public health in crowded cities.<br><br>Text 2<br>Labeling electric cars as completely eco-friendly ignores a massive environmental cost. The heavy lithium-ion batteries required to power these vehicles depend on intensive mining operations that destroy wilderness habitats and pollute water supplies across the globe; thus, the pollution is simply moved from the city streets to the mining communities.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that electric vehicles are 'the ultimate solution' for reducing environmental harm?",
            options: [
                "By arguing that electric cars simply shift the environmental damage elsewhere through destructive battery mining operations.",
                "By agreeing that urban air quality is the only factor scientists should consider when evaluating vehicles.",
                "By suggesting that all car manufacturing should be halted permanently across the globe.",
                "By demonstrating that gasoline engines are cleaner to manufacture than rubber tires."
            ],
            correctAnswer: 0,
            explanation: "Text 2 directly argues that while EVs reduce city tailpipe emissions, they cause massive environmental harm elsewhere due to battery mining, meaning they move pollution rather than eliminate it.",
        },
        {
            passage: "Monarch butterflies undertake an extraordinary multi-generational migration each autumn, traveling thousands of miles from Canada to specific oyamel fir forests in central Mexico. They rely heavily on warm, rising air currents called thermals to glide long distances without exhausting their fat reserves. However, sudden, unseasonable cold fronts can stall these air currents and cause the monarchs' wing muscles to freeze up completely, rendering them incapable of flight. Because an unexpected Arctic blast has swept across the midwestern migration pathway this week, scientists predict that ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "the monarchs will fly twice as fast to reach Mexico ahead of schedule.",
                "the migrating butterfly population will experience a severe delay or threat to survival.",
                "the oyamel fir trees in Mexico will immediately begin migrating northward.",
                "the butterflies will quickly adapt by swimming across local river currents."
            ],
            correctAnswer: 1,
            explanation: "The passage states that cold fronts stop the necessary air currents and freeze the butterflies' wings so they cannot fly. An unexpected Arctic blast would logically cause a severe delay or threat to their migration.",
        },
        {
            passage: "Transforming raw cacao beans into smooth chocolate bars involves an intensive, step-by-step manufacturing process. First, workers harvest large pods from cacao trees, extract the wet beans, and allow them to ferment under banana leaves for a week to develop flavor. Next, the fermented beans are dried thoroughly under the sun and shipped to factories where they are roasted in massive ovens. Then, the roasted shells are cracked open to isolate the inner nibs, which are ground down into a thick, liquid paste. Finally, factories blend in sugar and milk, pour the smooth mixture into molds, and cool it into solid bars.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It compares the nutritional differences between dark chocolate and milk chocolate.",
                "It uses a sequential timeline to detail the steps of transforming raw cacao beans into chocolate bars.",
                "It presents an argument explaining why cacao trees grow best in tropical climates.",
                "It details the scientific cause-and-effect relationship between baking sugar and milk."
            ],
            correctAnswer: 1,
            explanation: "The passage organizes the information chronologically using sequence words ('First,' 'Next,' 'Then,' 'Finally') to trace the step-by-step production of chocolate.",
        },
        {
            passage: "While the initial phase of the community park renovation project was incredibly **chaotic**, featuring loud bulldozers tearing up lawns, tangled piles of construction fencing, and shouting work crews, the final phase was remarkably ______; local families walked quietly along smooth stone pathways, birds chirped in newly planted trees, and visitors sat peacefully on benches in the sunshine.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["hectic", "serene", "abrupt", "expensive"],
            correctAnswer: 1,
            explanation: "'Serene' means calm, peaceful, and untroubled. The description of families walking quietly, birds chirping, and visitors sitting peacefully in the sunshine directly contrasts with the 'chaotic' and loud environment of the initial phase.",
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Flawless textual deduction! 🌟</strong><br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        const rewardContainer = document.getElementById('reward-container');
        const resultsFooter = document.getElementById('results-footer');
        
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        if (score === quizData.length) {
            rewardContainer.innerHTML = `
                <div style="margin: 20px auto; padding: 20px; background-color: #fff9f9; border: 2px solid #a51c30; border-radius: 8px; max-width: 400px;">
                    <h3 style="color: #a51c30; margin-top: 0; font-size: 1.4em;">🏆 Flawless 10/10 Score! 🏆</h3>
                    <p style="font-weight: bold; color: #2c3e50; margin-bottom: 15px;">Congratulations! You have earned the Harvard Logo:</p>
                    <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard Logo" style="max-width: 220px; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            `;
            resultsFooter.textContent = "Brilliant! You cracked advanced contextual boundaries with incredible critical thinking skills. Review your work below.";
        } else {
            rewardContainer.innerHTML = "";
            resultsFooter.textContent = "Outstanding effort! Analyze the detailed rationales below to master the nuances, and try again to unlock your perfect 10/10 Harvard badge reward!";
        }
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
