    /* =========================================================================
       CORE RUNTIME PLATFORM CODE
       ========================================================================= */
    let quizData = [];
    let currentQuestion = 0;
    let userAnswers = [];
    let isLocked = [];

    // NEW: Automatically builds the dropdown menu using the entries inside questionBank
    function populateDropdown() {
        const selector = document.getElementById('date-selector');
        selector.innerHTML = ''; // Clear any fallback entries
        
        // Extract all date keys (e.g., ["7-13", "7-14"])
        const modules = Object.keys(questionBank);
        
        if (modules.length === 0) {
            selector.innerHTML = '<option value="">No Modules Available</option>';
            return;
        }

        // Loop over the found keys and append custom dropdown option blocks
        modules.forEach(moduleKey => {
            const itemCount = questionBank[moduleKey].length;
            const option = document.createElement('option');
            option.value = moduleKey;
            option.textContent = `Module ${moduleKey} (${itemCount} Items)`;
            selector.appendChild(option);
        });

        // Initialize the interface automatically with the very first module found
        loadQuizModule(modules[0]);
    }

    // Initializes or switches the targeted dataset
    function loadQuizModule(dateKey) {
        quizData = questionBank[dateKey] || [];
        currentQuestion = 0;
        userAnswers = new Array(quizData.length).fill(null);
        isLocked = new Array(quizData.length).fill(false);

        // Hide results window and bring structural layout back
        document.getElementById('results').style.display = 'none';
        document.getElementById('nav-buttons').style.display = 'flex';
        document.getElementById('progress-tracker').style.display = 'block';

        const wrapper = document.getElementById('questions-wrapper');
        wrapper.innerHTML = ''; // Flush old document blocks

        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function handleModuleChange(selectedKey) {
        loadQuizModule(selectedKey);
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "<strong>Selection Required:</strong> Please choose an option before checking accuracy!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Pristine analytical reasoning. 🌟</strong><br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The accurate selection was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        updateNav();
    }

    function updateNav() {
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active'); // Expose all cards for scanning reviews
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Checked.</strong> The correct choice was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Rationale:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        document.getElementById('results-footer').textContent = "Evaluation matrix generated successfully. Review the structural summaries and deep rationales populated below to address any remaining analytical conceptual gaps.";
        
        window.scrollTo(0, 0);
    }

    // Trigger dynamic dropdown compilation as soon as the window opens
    window.onload = function() {
        populateDropdown();
    };
</script>
