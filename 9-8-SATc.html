<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 7</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 7)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Desert cacti store water inside their thick, fleshy stems to survive long droughts. Their sharp spines discourage hungry animals from eating them to reach the moisture stored inside. This physical feature allows cacti to ________ precious water during scorching dry seasons.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["preserve", "discard", "forget", "consume"],
            correctAnswer: 0,
            explanation: "'Preserve' means to keep safe or guard from loss. Thick stems and sharp spines allow cacti to hold onto and save water during dry seasons."
        },
        {
            passage: "Honeybees communicate the location of flower patches to their hive mates using a specialized movement called the 'waggle dance.' By changing the direction and duration of their dance, a honeybee can inform other bees of the exact distance and direction of nectar sources. This efficient communication system ensures the colony can gather food efficiently.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Honeybees use a unique waggle dance to communicate food locations to their colony.",
                "Honeybees only gather nectar from flowers during warm summer afternoons.",
                "Worker bees leave the hive to find new places to build honeycomb structures.",
                "Beekeepers use dances to teach honeybees how to fly in straight lines."
            ],
            correctAnswer: 0,
            explanation: "The main focus of the text is explaining how honeybees communicate food locations through the waggle dance."
        },
        {
            passage: "Solar panels generate electricity by capturing light particles from sunlight and converting them into electric currents. However, solar panels cannot produce energy at night when the sun is down. To ensure homes have continuous power around the clock, solar energy systems are often paired with ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "large storage batteries that save excess daytime electricity for later use.",
                "shaded umbrellas that keep the solar panels cool on hot days.",
                "mirrors that reflect moonlight directly onto the roof at night.",
                "glass covers that prevent dust from collecting on the solar cells."
            ],
            correctAnswer: 0,
            explanation: "Because solar panels only make power during daylight, storing excess electricity in batteries allows homes to maintain power throughout the night."
        },
        {
            passage: "The Grand Canyon was carved over millions of years by the continuous flow of the Colorado River. As water rushed through the region, it gradually wore down layers of rock, cutting deeper and deeper into the Earth's crust. Geological studies show that wind erosion and weathering also helped widen the steep canyon walls over time.",
            prompt: "Which detail from the text best supports the idea that water played a primary role in forming the Grand Canyon?",
            options: [
                "The canyon walls feature many colorful layers of ancient rock.",
                "The continuous flow of the Colorado River gradually wore down rock layers.",
                "Wind erosion helped widen the canyon over many thousands of years.",
                "Many tourists visit the Grand Canyon to study its unique geology."
            ],
            correctAnswer: 1,
            explanation: "The detail about the continuous flow of the Colorado River wearing down rock directly proves water's major role in forming the canyon."
        },
        {
            passage: "Emperor penguins face extreme winter conditions in Antarctica, where temperatures drop well below freezing. To stay warm and protect their eggs from freezing winds, thousands of penguins pack tightly together in giant groups called huddles. By continuously rotating from the cold outer edges to the warm center, the colony ________ bodily heat.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["shares", "destroys", "hides", "ignores"],
            correctAnswer: 0,
            explanation: "'Shares' fits logically because rotating positions ensures that every penguin gets a turn in the center to benefit from group heat."
        },
        {
            passage: "Text 1\nSchool uniforms promote equality by eliminating peer pressure related to expensive clothing brands. When all students wear the same uniform, it fosters a sense of unity and helps students focus on learning.\n\nText 2\nWhile school uniforms can reduce wardrobe distraction, they restrict students' ability to express their individuality and personal identity. Clothing is an important creative outlet for young people to discover who they are.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By arguing that uniforms limit self-expression, even if they help reduce distractions.",
                "By stating that school uniforms cost far too much money for families to afford.",
                "By claiming that students learn better when they wear expensive brand-name clothes.",
                "By suggesting that all schools should ban creative arts classes entirely."
            ],
            correctAnswer: 0,
            explanation: "Text 2 acknowledges that uniforms reduce distractions but highlights that they restrict students' self-expression and individuality."
        },
        {
            passage: "Fireflies light up summer nights using a process called bioluminescence. Inside their abdomens, chemical reactions combine oxygen, calcium, and specialized enzymes to produce a cool glow. **Because this chemical light produces almost no heat energy, fireflies can glow brightly without burning themselves.** This efficient light helps fireflies locate potential mates in the dark.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It explains why bioluminescent light is safe for fireflies to produce.",
                "It details how fireflies build nests in tall grass during the summer.",
                "It proves that fireflies are attracted to outdoor house lights.",
                "It describes how fireflies protect their eggs from nocturnal birds."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence explicitly points out that producing light without heat prevents the fireflies from burning their own bodies."
        },
        {
            passage: "Coral reefs are formed by tiny marine animals called coral polyps that build hard calcium carbonate skeletons. These colorful underwater structures protect coastlines from storm waves and provide shelter for over a quarter of all marine species. Preserving coral reefs is essential to ________ ocean biodiversity.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["safeguarding", "disrupting", "replacing", "forgetting"],
            correctAnswer: 0,
            explanation: "'Safeguarding' means protecting or defending. Protecting coral reefs keeps ocean wildlife and marine biodiversity safe."
        },
        {
            passage: "Pitcher plants are carnivorous plants adapted to nutrient-poor soils like bogs. They lure insects to their tubed leaves using sweet nectar and bright colors. Once inside, insects slip on slick walls and fall into a pool of digestive fluid at the bottom, which breaks down the insect so the plant can absorb vital nutrients.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Pitcher plants use slippery leaves and digestive fluid to catch insects for nutrients.",
                "Sweet nectar is produced by all bog plants to attract honeybees.",
                "Insects in bog ecosystems only eat nectar produced by carnivorous plants.",
                "Pitcher plants grow fast because bog soil is rich in natural fertilizers."
            ],
            correctAnswer: 0,
            explanation: "The text describes how pitcher plants lure, trap, and digest insects to obtain nutrients missing from bog soil."
        },
        {
            passage: "Submarines control their buoyancy underwater using large ballast tanks. To submerge beneath the surface, the submarine floods these tanks with ocean water, increasing its weight until it sinks. To surface again, compressed air is pumped into the tanks to push the water out, making the submarine lighter so that it can ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "rise smoothly back to the ocean surface.",
                "dive deeper into dark underwater trenches.",
                "turn off its navigation systems completely.",
                "collect soil samples from the seafloor."
            ],
            correctAnswer: 0,
            explanation: "Pushing water out makes the submarine lighter, which allows it to float and rise back up to the water's surface."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 7</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
