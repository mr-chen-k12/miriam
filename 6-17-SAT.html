<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3rd Grade Reading Practice - Set 6 (Harvard Challenge)</title>
<style>
    /* General Styles - Harvard Crimson Theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #fcf8f8;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 20px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        position: relative;
        border: 3px solid #a51c30;
    }
    h1 {
        text-align: center;
        color: #a51c30;
        margin-top: 0;
    }
    
    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #fffafb;
        padding: 20px;
        border-left: 5px solid #a51c30;
        margin-bottom: 20px;
        font-size: 1.15em;
        border-radius: 4px;
        line-height: 1.7;
    }
    .prompt {
        font-weight: bold;
        font-size: 1.1em;
        margin-bottom: 15px;
        color: #2c3e50;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 12px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #fffcfc;
        padding: 12px 15px;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #f5e6e8;
        font-size: 1.05em;
    }
    .options label:hover {
        background: #f9e8ea;
        border-color: #e2b3b8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
        background: #f1f2f6;
        border-color: #dcdde1;
    }
    .options input {
        margin-right: 15px;
        transform: scale(1.2);
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        border-left: 5px solid;
        font-size: 1.05em;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #27ae60;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #e74c3c;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #f1f2f6;
        padding-top: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background-color: #4a5568;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #2d3748; }
    button:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .check-btn { background-color: #a51c30; }
    .check-btn:hover { background-color: #821424; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #219653; }
    
    #results {
        display: none;
        text-align: center;
        padding: 25px;
        background: #fffdf9;
        border: 3px dashed #bc9b6a;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 25px;
        font-weight: bold;
        font-size: 1.1em;
        color: #7f8c8d;
    }
</style>
</head>
<body>

<div id="quiz-container">
    <h1>3rd Grade Reading Practice - Set 6</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>🎉 Quiz Complete! 🎉</h2>
        <p id="score-display" style="font-size: 1.6em; font-weight: bold; color: #a51c30; margin: 10px 0;"></p>
        <div id="reward-container"></div>
        <p id="results-footer" style="font-size: 1.1em; color: #4a5568;"></p>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Test</button>
    </div>
</div>

<script>
    const quizData = [
        {
            passage: "Although the cheetah is famous for being incredibly fast when chasing prey across the open savanna, it can be surprisingly ______ when stalking through tall grass; it moves centimeter by centimeter, freezes completely when a deer looks up, and makes absolutely no sound.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["reckless", "patient", "noisy", "scared"],
            correctAnswer: 1,
            explanation: "'Patient' means able to wait quietly or move calmly without rushing. Because the cheetah moves centimeter by centimeter and freezes to avoid being caught, it is acting in a patient way."
        },
        {
            passage: "Honeybees have a fascinating way of telling their hive members where to find the best flowers. When a scout bee finds a patch of sweet clover, it flies back home and performs a special 'waggle dance.' The direction and length of the dance tell the other bees exactly how far to fly and which way to turn. By watching this dance, the hive can gather food quickly without wasting time searching.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Honeybees prefer sweet clover over all other types of desert flowers.",
                "Scout bees enjoy dancing alone inside the dark hive.",
                "Honeybees use a special dance to share directions to food sources.",
                "All insects know how to fly in perfectly straight lines."
            ],
            correctAnswer: 2,
            explanation: "The text focuses on how the 'waggle dance' communicates specific instructions (distance and direction) to help the rest of the hive find food efficiently."
        },
        {
            passage: "In the book 'The Midnight Eclipse', Maya's grandfather explains that trying new things can be scary at first, but facing your fears often reveals a beautiful surprise you would have missed otherwise.",
            prompt: "Which sentence from 'The Midnight Eclipse' best supports the grandfather's idea?",
            options: [
                "\"The old wooden map hung on the living room wall right above the television.\"",
                "\"Even though Maya's knees shook as she stepped into the pitch-black cave, she took a deep breath and looked up to see thousands of glowing blue crystals covering the ceiling.\"",
                "\"Grandfather wore a heavy wool coat with silver buttons to keep out the night chill.\"",
                "\"The path outside was covered in smooth gray gravel and tiny green moss patches.\""
            ],
            correctAnswer: 1,
            explanation: "This sentence directly shows Maya overcoming her initial fear ('knees shook', 'pitch-black cave') and discovering an amazing, hidden reward ('glowing blue crystals'), which matches the grandfather's theme."
        },
        {
            passage: "Polar bears have thick layers of fat and heavy fur coats to survive freezing Arctic blizzards. However, during the summer, when they must walk long distances across dry land to look for food, their heavy coats trap too much heat, causing them to overheat dangerously. Therefore, to cool their bodies down on warm summer days, polar bears will often ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "run as fast as they can across hot sandy beaches.",
                "jump into the icy ocean water for a long swim.",
                "grow a new coat of feathers like an Arctic bird.",
                "hide underneath thick blankets inside a snow cave."
            ],
            correctAnswer: 1,
            explanation: "The text explains that polar bears get dangerously hot in summer due to their fur. Jumping into cold ocean water is the most logical way for an Arctic animal to lower its body temperature."
        },
        {
            passage: "Even though Uncle Larry usually kept his backyard garden messy with wild weeds and untrimmed bushes, his front porch was remarkably ______; every single flower pot was lined up straight, the welcome mat was perfectly clean, and not a single stray leaf was in sight.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["untidy", "organized", "dark", "crowded"],
            correctAnswer: 1,
            explanation: "'Organized' means arranged in an orderly, neat way. The description of straight flower pots, a clean mat, and no mess contrasts directly with his 'messy' backyard."
        },
        {
            passage: "Long ago, sailors used the North Star to steer their ships at night because it always stays in the exact same spot in the sky. However, if a thick fog rolled in or heavy storm clouds covered the stars, sailors would become completely lost in the middle of the ocean. To solve this dangerous problem, ancient inventors created the magnetic compass, which points north no matter how cloudy the weather is.",
            prompt: "Which choice best describes what the second sentence ('However, if... ocean.') does in the text?",
            options: [
                "It explains why some stars look brighter during the winter months.",
                "It introduces a major flaw with using stars that led to a new invention.",
                "It proves that ancient sailors did not like to travel at night.",
                "It gives instructions on how to steer a large wooden ship through a storm."
            ],
            correctAnswer: 1,
            explanation: "The second sentence highlights the main limitation of relying on the North Star (clouds block it, causing ships to get lost), which directly motivated the creation of the compass."
        },
        {
            passage: "Text 1<br>Learning to play a musical instrument like the piano is wonderful because it teaches children how to focus deeply. Practicing scales every single afternoon trains your brain to pay close attention to small details and builds excellent study habits.<br><br>Text 2<br>Forcing children to practice musical instruments for hours after school is a major mistake. Kids need unstructured free time to play outside, rest, and relax, and sitting on a piano bench making repetitive noises just makes kids resent music altogether.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that piano practice 'teaches children how to focus'?",
            options: [
                "By agreeing that kids focus best when they are listening to loud piano music.",
                "By arguing that free time and outdoor play are more valuable for kids than forced, repetitive practice.",
                "By suggesting that piano teachers should move their instruments out into the grass.",
                "By showing that playing sports is the only way to build good study habits."
            ],
            correctAnswer: 1,
            explanation: "Text 2 emphasizes the necessity of play, relaxation, and free time, showing that the author values these experiences far more than the rigid, focused repetition highlighted in Text 1."
        },
        {
            passage: "Sea turtles lay their eggs in dry sand on ocean beaches. When the baby turtles hatch at night, they look for the brightest light to find their way to the water, which is normally the moonlight reflecting off the ocean. However, when beachfront hotels leave bright stadium lights on all night, the confused babies crawl toward the buildings instead of the sea. Because a coastal city just passed a law turning off all hotel lights during hatching season, scientists believe that ______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "baby turtles will start hatching during the middle of the day instead.",
                "many more baby turtles will successfully find their way into the ocean.",
                "hotels will have to build indoor swimming pools for the turtles.",
                "the moon will shine much brighter over the ocean water."
            ],
            correctAnswer: 1,
            explanation: "Hotel lights confuse the baby turtles and lead them away from the sea. Eliminating those distracting lights means the turtles can follow the natural moonlight safely back to the ocean."
        },
        {
            passage: "To figure out whether birds prefer eating sunflower seeds or corn kernels, students set up two identical bird feeders in the school courtyard. One feeder was filled with black sunflower seeds, while the other held yellow corn. For one week, the students counted every bird that visited. They observed that forty birds ate the sunflower seeds while only five ate the corn, proving that local birds prefer sunflower seeds.",
            prompt: "Which choice best describes how this text is organized?",
            options: [
                "It tells a creative story about a bird that got lost while looking for its nest.",
                "It describes an experiment, compares how birds reacted to two types of food, and shares the result.",
                "It lists step-by-step assembly instructions for building a wooden birdhouse.",
                "It argues that humans should never feed wild animals in public parks."
            ],
            correctAnswer: 1,
            explanation: "The text systematically walks through an experimental test (two feeders with different foods), compares the resulting bird counts, and finishes with the scientific takeaway."
        },
        {
            passage: "While the first half of the soccer match was incredibly tense and close, with both teams locked in a fierce 0-0 tie, the second half was remarkably ______; our team scored five easy goals in a row while the other team grew tired and stopped running completely.",
            prompt: "Which choice completes the text with the most logical word?",
            options: ["fair", "lopsided", "stressful", "boring"],
            correctAnswer: 1,
            explanation: "'Lopsided' means heavily unbalanced or unequal. Because one team completely dominated by scoring five straight goals against an exhausted opponent, the game became lopsided, contrasting with the 'close' first half."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please pick an answer before checking!";
            feedbackDiv.className = "feedback warning";
            return;
        }

        lockQuestion(currentQuestion);

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct! Exceptional reading! 🌟</strong><br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Not quite!</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function lockQuestion(qIndex) {
        isLocked[qIndex] = true;
        const radios = document.getElementsByName(`q${qIndex}`);
        radios.forEach(r => r.disabled = true);
        quizData[qIndex].options.forEach((_, optIndex) => {
            document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('disabled');
        });
        updateNav();
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Locked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                lockQuestion(index);
                feedbackDiv.innerHTML = `<strong>Not Answered or Checked.</strong> The right answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Why?</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        
        const resultsDiv = document.getElementById('results');
        const rewardContainer = document.getElementById('reward-container');
        const resultsFooter = document.getElementById('results-footer');
        
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `Final Score: ${score} / ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        if (score === quizData.length) {
            rewardContainer.innerHTML = `
                <div style="margin: 20px auto; padding: 20px; background-color: #fff9f9; border: 2px solid #a51c30; border-radius: 8px; max-width: 400px;">
                    <h3 style="color: #a51c30; margin-top: 0; font-size: 1.4em;">🏆 Flawless 10/10 Score! 🏆</h3>
                    <p style="font-weight: bold; color: #2c3e50; margin-bottom: 15px;">Congratulations! You have earned the Harvard Logo:</p>
                    <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard Logo" style="max-width: 220px; height: auto; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                </div>
            `;
            resultsFooter.textContent = "Incredible performance! Review your perfect work below.";
        } else {
            rewardContainer.innerHTML = "";
            resultsFooter.textContent = "Review your answers and explanations below. Try again to get a perfect 10/10 score and unlock the Harvard badge reward!";
        }
        
        window.scrollTo(0, 0);
    }

    window.onload = initQuiz;
</script>

</body>
</html>
