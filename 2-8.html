<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Voyager: Study Game</title>
    <style>
        :root {
            /* Viking Theme Colors */
            --primary: #2C5282;       /* Deep Ocean Blue */
            --secondary: #38A169;     /* Forest Green */
            --wrong: #E53E3E;         /* Raid Red */
            --accent: #D69E2E;        /* Gold/Treasure */
            --text: #2D3748;
            --bg: #F7FAFC;
            
            --set1-color: #3182CE; /* Vocab Blue */
            --set2-color: #DD6B20; /* Longship Orange */
            --set3-color: #38A169; /* Greenland Green */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* --- MENU STYLES --- */
        h1 { margin: 0 0 10px 0; color: var(--primary); font-size: 2.2rem; }
        .subtitle { color: #718096; margin-bottom: 25px; font-size: 1.1rem; }

        .menu-grid { display: grid; gap: 15px; margin-top: 10px; }

        .level-card {
            padding: 25px;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: left;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .level-card:hover { transform: translateY(-3px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }

        .set-1 { background: linear-gradient(135deg, #3182CE, #63B3ED); }
        .set-2 { background: linear-gradient(135deg, #DD6B20, #F6AD55); }
        .set-3 { background: linear-gradient(135deg, #38A169, #68D391); }

        .level-title { font-size: 1.3rem; font-weight: bold; display: block; margin-bottom: 5px; }
        .level-desc { font-size: 0.9rem; opacity: 0.95; }
        .level-icon { font-size: 2.5rem; }

        /* --- QUIZ STYLES --- */
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #A0AEC0; font-size: 0.9rem; }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #EDF2F7;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            background-color: #EBF8FF;
            border: 3px solid var(--primary);
            color: #2C5282;
            padding: 25px;
            border-radius: 12px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-grid { display: grid; gap: 12px; }

        button.option-btn {
            background: white;
            border: 2px solid #E2E8F0;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.05rem;
            cursor: pointer;
            color: var(--text);
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
        }
        button.option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #F7FAFC;
            transform: translateY(-2px);
        }

        /* Answer States */
        button.correct { background-color: var(--secondary); border-color: #2F855A; color: white; }
        button.wrong { background-color: var(--wrong); border-color: #9B2C2C; color: white; opacity: 0.7; }

        /* "I Don't Know" Button */
        .idk-btn {
            margin-top: 15px;
            background: none;
            border: none;
            color: #718096;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 10px;
        }
        .idk-btn:hover { color: var(--primary); }

        /* Feedback Box */
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .fb-correct { background-color: #C6F6D5; color: #22543D; border: 2px solid #9AE6B4; }
        .fb-wrong { background-color: #FED7D7; color: #822727; border: 2px solid #FEB2B2; }

        /* Navigation Buttons */
        .next-btn, .home-btn, .review-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.2rem;
            margin-top: 20px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .next-btn:hover { background-color: #2A4365; }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="container">
        
        <div id="menu-screen">
            <h1>🛡️ Viking Voyager</h1>
            <p class="subtitle">Choose your adventure to start studying!</p>
            
            <div class="menu-grid">
                <button class="level-card set-1" onclick="startLevel(1)">
                    <div>
                        <span class="level-title">Set 1: Key Terms</span>
                        <span class="level-desc">Runes, Jarls, Fjords & more</span>
                    </div>
                    <div class="level-icon">📖</div>
                </button>

                <button class="level-card set-2" onclick="startLevel(2)">
                    <div>
                        <span class="level-title">Set 2: Life & Longships</span>
                        <span class="level-desc">Navigation, Raids & Skills</span>
                    </div>
                    <div class="level-icon">⛵</div>
                </button>

                <button class="level-card set-3" onclick="startLevel(3)">
                    <div>
                        <span class="level-title">Set 3: Great Explorers</span>
                        <span class="level-desc">Eric the Red & Leif the Lucky</span>
                    </div>
                    <div class="level-icon">🗺️</div>
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="top-bar">
                <span id="level-indicator">Set 1</span>
                <span id="score-indicator">0/0</span>
            </div>
            
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            
            <div id="question-text" class="question-box">Loading...</div>
            
            <div id="options-container" class="options-grid">
                </div>

            <button id="idk-btn" class="idk-btn" onclick="handleIdk()">I don't know this one 🤔</button>
            
            <div id="feedback" class="feedback-box"></div>
            
            <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question ➡️</button>
        </div>

        <div id="end-screen" class="hidden">
            <h1 id="end-title">Adventure Complete! 🎉</h1>
            
            <div style="background: #EDF2F7; padding: 25px; border-radius: 15px; margin: 25px 0;">
                <p style="font-size:1.2rem; margin:10px;">✅ Correct: <strong id="final-correct" style="color: green;">0</strong></p>
                <p style="font-size:1.2rem; margin:10px;">❌ Needs Practice: <strong id="final-wrong" style="color: #E53E3E;">0</strong></p>
            </div>
            
            <div id="review-section" class="hidden">
                <p>You missed a few! Let's master them.</p>
                <button class="next-btn" style="background-color: var(--accent); color: #744210;" onclick="startReviewRound()">🧠 Review My Mistakes</button>
            </div>
            
            <button id="home-btn" class="home-btn" style="background-color: #718096; margin-top:15px;" onclick="goToMenu()">🏠 Back to Map</button>
        </div>

    </div>

<script>
    // --- VIKING DATA SETS ---
    const quizSets = {
        1: [ // KEY TERMS
            { type: 'vocab', answer: "Plunder", question: "To take something by force." },
            { type: 'vocab', answer: "Rune", question: "A letter of the Viking alphabet." },
            { type: 'vocab', answer: "Jarl", question: "A Viking chief." },
            { type: 'vocab', answer: "Pasture", question: "Land covered with grass where farm animals feed." },
            { type: 'vocab', answer: "Myth", question: "An idea or story that many people believe is not true." },
            { type: 'vocab', answer: "Fjord", question: "A deep, narrow portion of the sea with high cliffs on either side." },
            { type: 'vocab', answer: "Prow", question: "The pointed front end of a ship." },
            { type: 'vocab', answer: "Berserker", question: "One of the most fearless and frightening Viking warriors." },
            { type: 'vocab', answer: "Maiden", question: "A young, unmarried woman." },
            { type: 'vocab', answer: "Oarsmen", question: "People responsible for rowing on a ship." }
        ],
        2: [ // LIFE & LONGSHIPS
            { type: 'fact', answer: "Scandinavia", question: "The Vikings came from a land now called..." },
            { type: 'fact', answer: "Farmland was scarce", question: "Why was it hard to farm in the Viking homelands?" },
            { type: 'fact', answer: "The Norse", question: "Another name the Vikings were known as." },
            { type: 'fact', answer: "Fierce Raiders", question: "Vikings were known as being..." },
            { type: 'fact', answer: "Shipbuilding", question: "Vikings were best known for their skill in sailing and..." },
            { type: 'fact', answer: "They were open to the weather", question: "Why did sailing on longships require courage and strength?" },
            { type: 'fact', answer: "Trading and Raiding", question: "Ships allowed Vikings to go on expeditions for..." },
            { type: 'fact', answer: "Sun and Stars", question: "What did Vikings use to navigate their voyages?" },
            { type: 'fact', answer: "To Raid", question: "To go 'a-viking' meant..." },
            { type: 'fact', answer: "North America", question: "Vikings were the first Europeans to arrive in..." }
        ],
        3: [ // EXPLORERS
            { type: 'person', answer: "Eric the Red", question: "He was banished from Iceland and settled in Greenland." },
            { type: 'person', answer: "To attract settlers", question: "Why did Eric the Red call the land 'Greenland'?" },
            { type: 'person', answer: "Leif Eriksson", question: "He was inspired to sail past Greenland to see the land beyond." },
            { type: 'person', answer: "Vineland", question: "What did Leif Eriksson call the land he discovered?" },
            { type: 'person', answer: "Leif the Lucky", question: "Leif Eriksson's nickname was..." },
            { type: 'person', answer: "Rescued a shipwrecked crew", question: "Why was Leif Eriksson called 'The Lucky'?" },
            { type: 'person', answer: "Cargo", question: "What reward was Leif Eriksson given for rescuing the crew?" },
            { type: 'person', answer: "Riches", question: "Vikings brought this back from trading and raiding." }
        ]
    };

    // Flatten all data for smart distractors
    const allData = [...quizSets[1], ...quizSets[2], ...quizSets[3]];

    // --- VARIABLES ---
    let currentQueue = [];
    let missedQueue = [];
    let currentIndex = 0;
    
    // --- ELEMENTS ---
    const menuScreen = document.getElementById('menu-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const endScreen = document.getElementById('end-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const idkBtn = document.getElementById('idk-btn');
    const progressBar = document.getElementById('progress-fill');
    
    // --- LOGIC ---

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function goToMenu() {
        quizScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
    }

    function startLevel(setNum) {
        currentQueue = shuffle([...quizSets[setNum]]);
        missedQueue = [];
        currentIndex = 0;
        
        // Dynamic Coloring
        let color = setNum === 1 ? 'var(--set1-color)' : (setNum === 2 ? 'var(--set2-color)' : 'var(--set3-color)');
        document.querySelector('.question-box').style.borderColor = color;
        document.getElementById('level-indicator').innerText = "Set " + setNum;

        menuScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        loadQuestion();
    }

    function startReviewRound() {
        currentQueue = shuffle([...missedQueue]);
        missedQueue = [];
        currentIndex = 0;
        
        endScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        document.getElementById('level-indicator').innerText = "Review Mode";
        
        loadQuestion();
    }

    function getDistractors(correctItem) {
        // Find wrong answers (preferably same type to be tricky)
        let pool = allData.filter(item => item.type === correctItem.type && item.answer !== correctItem.answer);
        
        // If not enough of the same type, borrow from others
        if (pool.length < 3) {
            pool = allData.filter(item => item.answer !== correctItem.answer);
        }
        
        shuffle(pool);
        // Get unique answers only
        const unique = [...new Set(pool.map(i => i.answer))];
        return unique.slice(0, 3);
    }

    function loadQuestion() {
        // Reset UI
        feedbackBox.style.display = 'none';
        nextBtn.classList.add('hidden');
        idkBtn.classList.remove('hidden');
        optionsContainer.innerHTML = "";
        
        // Update Progress
        const pct = (currentIndex / currentQueue.length) * 100;
        progressBar.style.width = `${pct}%`;
        document.getElementById('score-indicator').innerText = `${currentIndex + 1} / ${currentQueue.length}`;

        if (currentIndex >= currentQueue.length) {
            endGame();
            return;
        }

        const currentItem = currentQueue[currentIndex];
        questionText.innerText = currentItem.question;

        // Generate Options & Shuffle
        const wrongAnswers = getDistractors(currentItem);
        let options = [...wrongAnswers, currentItem.answer];
        shuffle(options);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(btn, opt, currentItem);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(btn, selected, item) {
        disableAllButtons();
        feedbackBox.style.display = 'block';

        if (selected === item.answer) {
            // CORRECT
            btn.classList.add('correct');
            feedbackBox.className = 'feedback-box fb-correct';
            feedbackBox.innerHTML = `<strong>Correct!</strong> Great job! 🛡️`;
        } else {
            // WRONG
            btn.classList.add('wrong');
            missedQueue.push(item);
            highlightCorrect(item.answer);
            
            feedbackBox.className = 'feedback-box fb-wrong';
            feedbackBox.innerHTML = `<strong>Not quite!</strong><br>The correct answer is: <strong>${item.answer}</strong>`;
        }
        nextBtn.classList.remove('hidden');
    }

    function handleIdk() {
        disableAllButtons();
        const item = currentQueue[currentIndex];
        missedQueue.push(item);
        highlightCorrect(item.answer);

        feedbackBox.style.display = 'block';
        feedbackBox.className = 'feedback-box fb-wrong';
        feedbackBox.innerHTML = `<strong>That's okay!</strong><br>The correct answer is: <strong>${item.answer}</strong>`;

        nextBtn.classList.remove('hidden');
    }

    function disableAllButtons() {
        const btns = optionsContainer.querySelectorAll('button');
        btns.forEach(b => b.disabled = true);
        idkBtn.classList.add('hidden');
    }

    function highlightCorrect(correctAnswer) {
        const btns = optionsContainer.querySelectorAll('button');
        btns.forEach(b => {
            if (b.innerText === correctAnswer) b.classList.add('correct');
        });
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function endGame() {
        quizScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');

        const total = currentQueue.length;
        const missed = missedQueue.length;
        const correct = total - missed;

        document.getElementById('final-correct').innerText = correct;
        document.getElementById('final-wrong').innerText = missed;

        const reviewSection = document.getElementById('review-section');
        const homeBtn = document.getElementById('home-btn');

        if (missed > 0) {
            reviewSection.classList.remove('hidden');
            document.getElementById('end-title').innerText = "Good Practice! ⚔️";
            homeBtn.style.background = "#A0AEC0"; // Grey out home button slightly to encourage review
        } else {
            reviewSection.classList.add('hidden');
            document.getElementById('end-title').innerText = "Viking Master! 🏆";
            homeBtn.style.background = "var(--primary)";
        }
    }
</script>

</body>
</html>
