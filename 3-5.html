<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Worksheet - Lesson 62</title>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .problem-container {
            background: #fff;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .math-block {
            font-size: 1.2em;
            margin: 10px 0;
        }
        svg {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Lesson 62: Multiplying Three or More Factors • Exponents</h1>

    <div id="problems-wrapper"></div>

    <script>
        const problems = [
            {
                qNum: 1,
                question: "There were twice as many peacocks as peahens. If there were 12 peacocks, then how many peahens were there?",
                explanation: "Let $p$ be the number of peahens.<br>The problem states: $2 \\times p = 12$<br>To find $p$, divide by 2: <br>$$p = \\frac{12}{2} = 6$$<br><strong>Answer:</strong> 6 peahens."
            },
            {
                qNum: 2,
                question: "Beth's dance class begins at 6 p.m. It takes 20 minutes to drive to dance class. What time should she leave home to get to dance class on time?",
                explanation: "Subtract the driving time from the start time.<br>6:00 p.m. minus 20 minutes is 5:40 p.m.<br><strong>Answer:</strong> 5:40 p.m."
            },
            {
                qNum: 3,
                question: "Mae-Ying bought a package of paper priced at $1.98 and 2 pens priced at $0.49 each. The tax on the entire purchase was 18¢. What was the total cost of the items?",
                explanation: "1. Cost of paper: $\\$1.98$<br>2. Cost of pens: $2 \\times \\$0.49 = \\$0.98$<br>3. Tax: $\\$0.18$<br>4. Total Cost: $1.98 + 0.98 + 0.18 = 3.14$<br><strong>Answer:</strong> $3.14"
            },
            {
                qNum: 4,
                question: "Nalcomb earns $3 a week for washing the car. How much money does he earn in a year of car washing? (There are 52 weeks in a year.)",
                explanation: "Multiply weekly earnings by the number of weeks in a year:<br>$$52 \\times 3 = 156$$<br><strong>Answer:</strong> $156"
            },
            {
                qNum: 5,
                question: "Two thirds of the race was over. What fraction of the race was left?",
                explanation: "A whole race is $1$ (or $\\frac{3}{3}$). Subtract the completed portion:<br>$$1 - \\frac{2}{3} = \\frac{1}{3}$$<br><strong>Answer:</strong> $\\frac{1}{3}$"
            },
            {
                qNum: 6,
                question: "Estimate the difference: 887 - 291",
                explanation: "Round both numbers to the nearest hundred:<br>$887 \\approx 900$<br>$291 \\approx 300$<br>$$900 - 300 = 600$$<br><strong>Answer:</strong> 600"
            },
            {
                qNum: 7,
                question: "In the equation $11 = 100 - y$, the letter $y$ stands for what number?",
                explanation: "To solve for $y$, rearrange the equation:<br>$y = 100 - 11$<br>$$y = 89$$<br><strong>Answer:</strong> 89"
            },
            {
                qNum: 8,
                question: "Compare: $\\frac{2}{4} \\bigcirc \\frac{4}{8}$. Draw and shade two congruent circles to show the comparison.",
                explanation: "Simplify the fractions: $\\frac{2}{4} = \\frac{1}{2}$ and $\\frac{4}{8} = \\frac{1}{2}$.<br>Therefore, $\\frac{2}{4} = \\frac{4}{8}$.<br><br><em>Visual:</em> Both circles would be exactly half-shaded. The first is split into 4 pieces (2 shaded), the second split into 8 pieces (4 shaded).<br><strong>Answer:</strong> = (Equal)"
            },
            {
                qNum: 9,
                question: "What is the sum of the eighth multiple of 5 and the fourth multiple of 10?",
                explanation: "1. Eighth multiple of 5: $8 \\times 5 = 40$<br>2. Fourth multiple of 10: $4 \\times 10 = 40$<br>3. Sum: $40 + 40 = 80$<br><strong>Answer:</strong> 80"
            },
            {
                qNum: 10,
                question: "According to this calendar, July 4, 2014, is what day of the week?",
                explanation: "Looking at the provided July 2014 calendar matrix, the number 4 falls under the 'F' column.<br><strong>Answer:</strong> Friday"
            },
            {
                qNum: 11,
                question: "Write four multiplication/division facts using the numbers 6, 3, and 18.",
                explanation: "Using the fact family rules:<br>1. $6 \\times 3 = 18$<br>2. $3 \\times 6 = 18$<br>3. $18 \\div 6 = 3$<br>4. $18 \\div 3 = 6$<br><strong>Answer:</strong> $6 \\times 3 = 18$, $3 \\times 6 = 18$, $18 \\div 6 = 3$, $18 \\div 3 = 6$"
            },
            {
                qNum: 12,
                question: "$5 \\times 6 \\times 7$",
                explanation: "First, multiply $5 \\times 6 = 30$.<br>Next, multiply $30 \\times 7 = 210$.<br><strong>Answer:</strong> 210"
            },
            {
                qNum: 13,
                question: "$4^3$",
                explanation: "The exponent tells you to multiply the base by itself 3 times:<br>$$4 \\times 4 \\times 4 = 16 \\times 4 = 64$$<br><strong>Answer:</strong> 64"
            },
            {
                qNum: 14,
                question: "$476,385 + 259,518$",
                explanation: "$$476,385 + 259,518 = 735,903$$<br>Align vertically and carry the ones: <br>5+8=13 (carry 1) <br>8+1+1=10 (carry 1) <br>3+5+1=9 <br>6+9=15 (carry 1) <br>7+5+1=13 (carry 1) <br>4+2+1=7<br><strong>Answer:</strong> 735,903"
            },
            {
                qNum: 15,
                question: "$\\$20.00 - \\$17.84$",
                explanation: "$$\\$20.00 - \\$17.84 = \\$2.16$$<br>Borrow across the zeroes.<br><strong>Answer:</strong> $2.16"
            },
            {
                qNum: 16,
                question: "$C - 19,434 = 45,579$",
                explanation: "To isolate $C$, add $19,434$ to both sides:<br>$$C = 45,579 + 19,434 = 65,013$$<br><strong>Answer:</strong> 65,013"
            },
            {
                qNum: 17,
                question: "$\\$4.17 \\times 8$",
                explanation: "Multiply ignoring the decimal, then place it back 2 spots:<br>$7 \\times 8 = 56$ (carry 5)<br>$1 \\times 8 = 8$, $+ 5 = 13$ (carry 1)<br>$4 \\times 8 = 32$, $+ 1 = 33$<br>Result: $33.36$<br><strong>Answer:</strong> $33.36"
            },
            {
                qNum: 18,
                question: "$\\$470 \\times 7$",
                explanation: "$$470 \\times 7 = 3,290$$<br><strong>Answer:</strong> $3,290"
            },
            {
                qNum: 19,
                question: "$608 \\times 4$",
                explanation: "$8 \\times 4 = 32$<br>$0 \\times 4 = 0$ (add 3 carry) $= 3$<br>$6 \\times 4 = 24$<br>Result: 2432<br><strong>Answer:</strong> 2,432"
            },
            {
                qNum: 20,
                question: "$29 \\div 4$",
                explanation: "4 goes into 29 seven times ($4 \\times 7 = 28$).<br>Subtract: $29 - 28 = 1$ remainder.<br><strong>Answer:</strong> 7 R 1"
            },
            {
                qNum: 21,
                question: "$65 \\div 8$",
                explanation: "8 goes into 65 eight times ($8 \\times 8 = 64$).<br>Subtract: $65 - 64 = 1$ remainder.<br><strong>Answer:</strong> 8 R 1"
            },
            {
                qNum: 22,
                question: "$29 \\div 5$",
                explanation: "5 goes into 29 five times ($5 \\times 5 = 25$).<br>Subtract: $29 - 25 = 4$ remainder.<br><strong>Answer:</strong> 5 R 4"
            },
            {
                qNum: 23,
                question: "$65 \\div 7$",
                explanation: "7 goes into 65 nine times ($7 \\times 9 = 63$).<br>Subtract: $65 - 63 = 2$ remainder.<br><strong>Answer:</strong> 9 R 2"
            },
            {
                qNum: 24,
                question: "$39 \\div 5$",
                explanation: "5 goes into 39 seven times ($5 \\times 7 = 35$).<br>Subtract: $39 - 35 = 4$ remainder.<br><strong>Answer:</strong> 7 R 4"
            },
            {
                qNum: 25,
                question: "$65 \\div 9$",
                explanation: "9 goes into 65 seven times ($9 \\times 7 = 63$).<br>Subtract: $65 - 63 = 2$ remainder.<br><strong>Answer:</strong> 7 R 2"
            },
            {
                qNum: 26,
                question: "If 40% of the students are boys, then what percent of the students are girls?",
                explanation: "The total percentage of students is 100%.<br>$$100\\% - 40\\% = 60\\%$$<br><strong>Answer:</strong> 60%"
            },
            {
                qNum: 27,
                question: "(a) What is the perimeter of this square? (b) What is the area of this square?<br><em>(A square with a side length of 6 in. is shown)</em>",
                explanation: "<strong>(a) Perimeter:</strong> Add all 4 sides or multiply by 4.<br>$$P = 4 \\times 6 = 24 \\text{ in}$$<br><strong>(b) Area:</strong> Multiply base times height.<br>$$A = 6 \\times 6 = 36 \\text{ sq in}$$<br><strong>Answer:</strong> Perimeter = 24 in, Area = 36 sq in"
            },
            {
                qNum: 28,
                question: "What type of angle is each angle of a square?<br>A. acute &nbsp;&nbsp;&nbsp; B. right &nbsp;&nbsp;&nbsp; C. obtuse",
                explanation: "A square has four 90-degree angles. A 90-degree angle is called a right angle.<br><strong>Answer:</strong> B. right"
            },
            {
                qNum: 29,
                question: "This bar graph shows the number of colored candies in a package...<br>(a) How many red candies were there?<br>(b) There were how many more green candies than orange candies?",
                explanation: "Reading the graph points:<br>Red = 3, Orange = 4, Yellow = 3, Green = 8, White = 1.<br><br><strong>(a)</strong> Red candies = 3<br><strong>(b)</strong> Green (8) minus Orange (4) = $8 - 4 = 4$<br><br><strong>Answer:</strong> (a) 3, (b) 4"
            }
        ];

        const wrapper = document.getElementById('problems-wrapper');

        problems.forEach(prob => {
            // Create container
            const container = document.createElement('div');
            container.className = 'problem-container';

            // Create question text
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            questionDiv.innerHTML = `Q${prob.qNum}. ${prob.question}`;
            container.appendChild(questionDiv);

            // Create button
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Show Answer & Explanation';
            
            // Create explanation div
            const expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.id = `exp-${prob.qNum}`;
            expDiv.innerHTML = prob.explanation;

            // Add click event to toggle explanation
            btn.onclick = () => {
                if (expDiv.style.display === 'block') {
                    expDiv.style.display = 'none';
                    btn.innerText = 'Show Answer & Explanation';
                } else {
                    expDiv.style.display = 'block';
                    btn.innerText = 'Hide Answer';
                }
            };

            container.appendChild(btn);
            container.appendChild(expDiv);
            wrapper.appendChild(container);
        });
    </script>
</body>
</html>
