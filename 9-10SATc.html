<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 9-10C</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #university-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #university-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .university-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #university-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 9-10C)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="university-reward">
            <div class="university-text" id="reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="reward-img" src="" alt="University Crest">
            <p id="reward-desc" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Beavers are famous for constructing sturdy wood and mud dams across moving streams. By blocking water flow, these rodent engineers create calm, deep ponds that protect their family lodges from land predators like wolves. This unique engineering capability allows beavers to ________ their surrounding wetland landscape.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["transform", "neglect", "abandon", "prohibit"],
            correctAnswer: 0,
            explanation: "'Transform' means to change the shape or character of something. Beaver dams turn flowing streams into still ponds, changing the landscape."
        },
        {
            passage: "Honeybees communicate the location of rich flower patches to hive mates through a figure-eight movement known as the 'waggle dance.' The angle of the dance relative to the sun indicates the exact direction of the food source, while the duration of the waggle run conveys distance. Other worker bees observe these movements in the dark hive and fly straight to the target flowers.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Honeybees use a specialized dance routine to share precise directional information about food sources.",
                "Worker bees only gather nectar on bright sunny days to avoid lost signals.",
                "Beehives are built in complete darkness to protect honey reserves from rival insects.",
                "The duration of a bee's flight determines how much honey can be stored in winter."
            ],
            correctAnswer: 0,
            explanation: "The text explains how honeybees perform the waggle dance to communicate direction and distance to flower patches."
        },
        {
            passage: "Venus flytraps thrive in coastal bog ecosystems where soil lacks nitrogen and essential minerals. To overcome this nutrient deficit, the plant evolved specialized leaves lined with sensitive trigger hairs that snap shut when an insect touches them twice. By digesting trapped insects, Venus flytraps can ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "obtain essential nutrients that are missing from the surrounding soil.",
                "produce warm sunlight during cold winter storms.",
                "filter large quantities of saltwater out of local ocean currents.",
                "prevent all birds from nesting in nearby evergreen trees."
            ],
            correctAnswer: 0,
            explanation: "Digesting insects provides the nitrogen and minerals that the poor bog soil lacks, allowing the plant to survive."
        },
        {
            passage: "In December 1903, Wilbur and Orville Wright achieved the first sustained, powered flight of a heavier-than-air aircraft near Kitty Hawk, North Carolina. They selected Kitty Hawk specifically for its strong, steady Atlantic breezes and soft sand landing sites. Their longest powered flight that historic day covered 852 feet in 59 seconds.",
            prompt: "Which detail from the text best supports the idea that geographic location was crucial to the Wright brothers' success?",
            options: [
                "They chose Kitty Hawk because of its steady wind conditions and soft sand landing areas.",
                "The longest successful test flight covered 852 feet in under one minute.",
                "The historic powered flight took place in the winter month of December 1903.",
                "Wilbur and Orville Wright worked as a team to construct their flying machine."
            ],
            correctAnswer: 0,
            explanation: "Choosing Kitty Hawk specifically for its consistent breezes and soft sand highlights how the location's features enabled successful flight testing."
        },
        {
            passage: "Deep-sea anglerfish live in complete darkness thousands of feet beneath the ocean surface. Female anglerfish feature a glowing, lure-like organ dangling from their heads, powered by light-emitting bioluminescent bacteria. Curious prey animals swim toward the glowing light directly into the fish's waiting jaws. This luminous attachment helps anglerfish ________ prey in total darkness.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["attract", "frighten", "release", "ignore"],
            correctAnswer: 0,
            explanation: "'Attract' means to draw attention or cause something to approach. The glowing light draws curious prey closer to the anglerfish."
        },
        {
            passage: "Text 1\nPlastic recycling programs allow communities to collect discarded soda bottles and food containers, melting them down to produce carpet fibers, clothing, and new packaging. Recycling keeps tons of synthetic waste out of overflowing landfills each year.\n\nText 2\nWhile recycling plastic keeps some waste out of landfills, processing synthetic plastics requires high energy and yields lower-quality materials over time. A more effective solution is reducing the manufacturing and consumer use of single-use plastics altogether.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By arguing that recycling alone is insufficient and that reducing overall plastic production is a better long-term strategy.",
                "By suggesting that all single-use plastic bottles should be burned immediately for heating power.",
                "By claiming that recycled plastic produces much stronger materials than newly manufactured plastic.",
                "By stating that landfills are the safest environment for storing plastic waste long term."
            ],
            correctAnswer: 0,
            explanation: "Text 2 argues that recycling has limits and that reducing overall single-use plastic usage is a more effective solution."
        },
        {
            passage: "Green plants create their own food through photosynthesis using sunlight, water, and carbon dioxide. **During this chemical process, plant leaves absorb solar energy to combine water molecules and carbon dioxide gas into energy-rich sugars.** A byproduct of this reaction is oxygen, which plants release back into the atmosphere for living organisms to breathe.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It describes how solar energy converts water and carbon dioxide into sugars during photosynthesis.",
                "It explains how plant roots absorb nitrogen minerals from rich soil layers.",
                "It measures the exact volume of oxygen gas released by tropical rainforest trees.",
                "It contrasts plant photosynthesis with deep-sea bacterial chemosynthesis."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence details the specific chemical step where solar energy converts water and carbon dioxide into plant sugars."
        },
        {
            passage: "During the brutal Antarctic winter, male emperor penguins stand exposed on open ice sheets for two months, guarding a single egg placed on their feet. To endure temperatures dropping below minus 40 degrees, hundreds of males form tightly packed huddles, constantly rotating positions so every penguin gets time in the warm center. This collective behavior helps the colony ________ vital body heat.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["conserve", "dissipate", "surrender", "waste"],
            correctAnswer: 0,
            explanation: "'Conserve' means to protect from loss or save. Huddling together helps the penguins retain and preserve their body heat."
        },
        {
            passage: "Desert cacti have developed specialized adaptations to survive long droughts in arid environments. Instead of wide leaves that lose moisture through evaporation, cacti feature thick stems that store gallons of water and sharp spines that shield them from thirsty desert animals. Furthermore, their shallow root systems spread outward across large areas to absorb rare rainwater quickly.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Cacti possess unique physical adaptations that enable them to collect and store water in dry deserts.",
                "Sharp cactus spines are harvested by desert farmers to build protective livestock fences.",
                "Rainstorms occur every week in southwestern desert regions during summer months.",
                "Wide leaves are essential for desert plants to absorb maximum sunlight energy."
            ],
            correctAnswer: 0,
            explanation: "The text focuses on how thick stems, sharp spines, and shallow roots help cacti adapt to arid desert environments."
        },
        {
            passage: "Sound travels as mechanical pressure waves moving through physical matter like air, water, or solid rock. Because outer space is a near-complete vacuum devoid of gas molecules to vibrate and transmit kinetic energy, sound waves cannot travel across interstellar space. Consequently, an astronaut standing on the moon without radios would ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "be unable to hear sound waves traveling through the vacuum of space.",
                "hear distant stars shining brightly across space.",
                "transmit sound signals faster than light waves can travel.",
                "cause cosmic dust particles to freeze into solid ice crystals."
            ],
            correctAnswer: 0,
            explanation: "Since space lacks matter to vibrate and transmit sound waves, an astronaut cannot hear sounds through the vacuum of space."
        }
    ];

    // Rotating award possibilities for 10/10 perfect score
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 9-10C</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Dynamic reward selection (Rotates daily between Harvard, BU, and Yale)
        if (score === quizData.length) {
            const todayIndex = new Date().getDate() % universityRewards.length;
            const selectedReward = universityRewards[todayIndex];

            const rewardContainer = document.getElementById('university-reward');
            const rewardTitle = document.getElementById('reward-title');
            const rewardImg = document.getElementById('reward-img');
            const rewardDesc = document.getElementById('reward-desc');

            rewardContainer.style.borderColor = selectedReward.color;
            rewardTitle.style.color = selectedReward.color;
            rewardTitle.textContent = `★ FLAWLESS ACADEMIC EXCELLENCE ★`;
            rewardImg.src = selectedReward.img;
            rewardImg.alt = `${selectedReward.name} Crest`;
            rewardDesc.textContent = `You have successfully earned the ${selectedReward.name} verification crest for achieving a perfect 10/10 score!`;

            rewardContainer.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
