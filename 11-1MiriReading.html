<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11-1 Miri Reading Practice - Multi-Set Collection</title>
<style>
  :root{
    --bg1:#e0f2fe; --bg2:#fef9c3;
    --ink:#1e293b; --muted:#64748b;
    --card:#ffffff; --accent:#0284c7; --accent2:#f59e0b;
    --good:#16a34a; --goodbg:#f0fdf4; --bad:#dc2626; --badbg:#fef2f2;
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
    margin:0; color:var(--ink); line-height:1.65; font-size:1.08rem;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; padding:20px 14px 60px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header.hero{text-align:center;margin-bottom:16px}
  header.hero h1{font-size:1.9rem;margin:.2em 0;color:#0c4a6e}
  header.hero p{color:var(--muted);margin:.2em 0}
  .set-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .set-tab{
    border:3px solid transparent;background:var(--card);border-radius:999px;
    padding:10px 20px;font-size:1.02rem;font-weight:bold;cursor:pointer;color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.08);font-family:inherit;
  }
  .set-tab small{display:block;font-weight:normal;color:var(--muted);font-size:.8rem}
  .set-tab.active{border-color:var(--accent);background:#f0f9ff}
  .progress-card{background:var(--card);border-radius:var(--radius);padding:12px 18px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:14px;text-align:center}
  .progress-label{font-weight:bold;color:#0c4a6e;margin-bottom:8px}
  .dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .dot{width:26px;height:26px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;
    justify-content:center;font-size:.8rem;font-weight:bold;color:var(--muted)}
  .dot.done{background:#bbf7d0;color:#166534}
  .dot.now{background:var(--accent);color:#fff;transform:scale(1.15)}
  .dot.bad{background:#fecaca;color:#991b1b}
  .qcard{background:var(--card);border-radius:var(--radius);padding:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);margin-bottom:14px}
  .passage{
    background:#f8fafc;border-left:6px solid var(--accent);border-radius:0 12px 12px 0;
    padding:14px 18px;margin-bottom:18px;font-size:1.05rem;
  }
  .passage .p-title{font-weight:bold;color:#0c4a6e;margin-bottom:6px;font-size:1.12rem}
  .prompt{font-weight:bold;font-size:1.15rem;margin:14px 0;color:#0c4a6e}
  .opt{
    display:block;width:100%;text-align:left;background:#f1f5f9;border:3px solid #e2e8f0;
    border-radius:14px;padding:13px 16px;margin:10px 0;font-size:1.05rem;cursor:pointer;
    font-family:inherit;color:var(--ink);line-height:1.5;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);background:#f0f9ff}
  .opt .letter{display:inline-block;width:32px;height:32px;border-radius:50%;background:#cbd5e1;
    color:#334155;font-weight:bold;text-align:center;line-height:32px;margin-right:10px}
  .opt.selected{border-color:var(--accent);background:#e0f2fe}
  .opt.selected .letter{background:var(--accent);color:#fff}
  .opt.correct{border-color:var(--good);background:var(--goodbg)}
  .opt.correct .letter{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .opt.wrong .letter{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;opacity:1}
  .feedback{border-radius:14px;padding:14px 18px;margin-top:14px;font-size:1.05rem;display:none}
  .feedback.show{display:block}
  .feedback.good{background:var(--goodbg);border:2px solid var(--good)}
  .feedback.bad{background:var(--badbg);border:2px solid var(--bad)}
  .feedback .exp{margin-top:8px;color:#334155}
  .nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .nav button{
    border:none;border-radius:999px;padding:12px 26px;font-size:1.05rem;font-weight:bold;
    cursor:pointer;font-family:inherit;box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  #prev-btn{background:#e2e8f0;color:#334155}
  #prev-btn:disabled{opacity:.4;cursor:default}
  #check-btn{background:var(--accent2);color:#fff}
  #check-btn:disabled{opacity:.4;cursor:default}
  #next-btn{background:var(--accent);color:#fff}
  #next-btn:disabled{opacity:.4;cursor:default}
  #results{background:var(--card);border-radius:var(--radius);padding:26px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);text-align:center}
  .score-ring{width:150px;height:150px;border-radius:50%;margin:10px auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) 0 0);color:#0c4a6e;font-weight:bold}
  .score-ring .pct{font-size:2rem}
  .stars{font-size:2.4rem;letter-spacing:6px;margin:6px 0}
  .award{background:linear-gradient(135deg,#fef3c7,#fde68a);border:3px solid var(--accent2);
    border-radius:var(--radius);padding:18px;margin:16px 0}
  .award .big{font-size:3rem}
  .retry-note{background:#fff7ed;border:2px dashed var(--accent2);border-radius:14px;
    padding:12px;margin:14px 0;color:#9a3412}
  .review{text-align:left;margin-top:18px}
  .review-item{border:2px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin:12px 0}
  .review-item.ok{border-color:var(--good);background:#f8fef9}
  .review-item.no{border-color:var(--bad);background:#fffafa}
  .review-item details{margin-top:8px}
  .review-item summary{cursor:pointer;color:var(--accent);font-weight:bold}
  .review-item .rp{background:#f8fafc;border-radius:10px;padding:10px 14px;margin-top:8px;font-size:.98rem}
  .retake{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:999px;
    padding:13px 30px;font-size:1.1rem;font-weight:bold;cursor:pointer;font-family:inherit}
  #parent-panel{background:#fff;border:3px solid #7c3aed;border-radius:var(--radius);
    padding:18px;margin-bottom:16px}
  #parent-panel h3{margin-top:0;color:#5b21b6}
  #parent-panel table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}
  #parent-panel th,#parent-panel td{border:1px solid #ddd6fe;padding:6px 8px;text-align:left}
  #parent-panel th{background:#ede9fe}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:9999;pointer-events:none;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media print{
    .set-tabs,.nav,#parent-panel,.retake,.feedback .trybtn{display:none !important}
    body{background:#fff}
    .qcard,.progress-card{box-shadow:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>📚 Reading Practice</h1>
    <p><b>11-1 · Grade 4</b> — Read each passage, then answer the question. Take your time! 🌟</p>
  </header>

  <div id="parent-panel" hidden>

      <tbody id="parent-log"></tbody></table>
    </details>
    <button class="retake" style="background:#7c3aed" onclick="clearLog()">🗑️ Clear activity data</button>
  </div>

  <div class="set-tabs" id="set-tabs"></div>

  <div id="quiz-area">
    <div class="progress-card">
      <div class="progress-label" id="progress-label"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="qcard" id="qcard"></div>
    <div class="nav">
      <button id="prev-btn" onclick="navigate(-1)" disabled>⬅ Previous</button>
      <button id="check-btn" onclick="checkAnswer()">✅ Check Answer</button>
      <button id="next-btn" onclick="navigate(1)">Next ➡</button>
    </div>
  </div>

  <div id="results" hidden></div>

</div>

const AUDIT_KEY = "reading_11_1_miri_audit_v1";
const SET_NAMES = Object.keys(SETS);

let state = { set:"Set A", qi:0, shuffled:[], answers:[], sel:null };

function getAudit(){
  try{
    const d = JSON.parse(localStorage.getItem(AUDIT_KEY));
    if(d && d.attempts) return d;
  }catch(e){}
  return { attempts:{"Set A":[],"Set B":[],"Set C":[]}, events:[] };
}
function saveAudit(d){ try{ localStorage.setItem(AUDIT_KEY, JSON.stringify(d)); }catch(e){} }
function logEvent(type, details){
  const d = getAudit();
  d.events.unshift({ t:new Date().toLocaleString(), type:type, details:details });
  if(d.events.length > 300) d.events.length = 300;
  saveAudit(d);
  if(!document.getElementById("parent-panel").hidden) renderParentPanel();
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function el(id){ return document.getElementById(id); }

function renderTabs(){
  const tabs = el("set-tabs");
  tabs.innerHTML = "";
  SET_NAMES.forEach(name=>{
    const s = SETS[name];
    const b = document.createElement("button");
    b.className = "set-tab" + (name===state.set ? " active" : "");
    b.innerHTML = s.icon+" "+name+"<small>"+s.tag+"</small>";
    b.onclick = ()=>switchSet(name);
    tabs.appendChild(b);
  });
}

function loadSet(name){
  state.set = name;
  state.qi = 0;
  state.sel = null;
  const qs = SETS[name].questions;
  state.shuffled = qs.map(q=>{
    const order = shuffle([0,1,2,3]);
    return { order:order, correctPos: order.indexOf(q.correct) };
  });
  state.answers = new Array(qs.length).fill(null);
  el("quiz-area").hidden = false;
  el("results").hidden = true;
  renderTabs(); renderQ();
  logEvent("Set started", name);
}

function switchSet(name){
  if(name===state.set) return;
  loadSet(name);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderDots(){
  const dots = el("dots"); dots.innerHTML = "";
  const n = SETS[state.set].questions.length;
  el("progress-label").textContent = "Question "+(state.qi+1)+" of "+n+" · "+SETS[state.set].icon+" "+SETS[state.set].tag;
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "dot";
    d.textContent = i+1;
    const a = state.answers[i];
    if(a) d.classList.add(a.ok ? "done" : "bad");
    if(i===state.qi) d.classList.add("now");
    d.onclick = ()=>{ state.qi=i; state.sel=null; renderQ(); };
    d.style.cursor = "pointer";
    dots.appendChild(d);
  }
}

function renderQ(){
  const qs = SETS[state.set].questions;
  const q = qs[state.qi];
  const sh = state.shuffled[state.qi];
  const ans = state.answers[state.qi];
  renderDots();
  const card = el("qcard");
  let html = '<div class="passage"><div class="p-title">📖 '+q.title+'</div>'+q.passage+'</div>';
  html += '<div class="prompt">❓ '+q.prompt+'</div><div id="opts">';
  const letters = ["A","B","C","D"];
  for(let pos=0; pos<4; pos++){
    const optIdx = sh.order[pos];
    let cls = "opt";
    let dis = "";
    if(ans){
      dis = " disabled";
      if(pos===sh.correctPos) cls += " correct";
      else if(pos===ans.sel) cls += " wrong";
    } else if(state.sel===pos){
      cls += " selected";
    }
    html += '<button class="'+cls+'"'+dis+' onclick="selectOpt('+pos+')"><span class="letter">'+letters[pos]+'</span>'+q.options[optIdx]+'</button>';
  }
  html += '</div><div class="feedback" id="feedback"></div>';
  card.innerHTML = html;
  if(ans) showFeedback(ans.ok, q, sh, ans.sel);
  updateNav();
}

function selectOpt(pos){
  if(state.answers[state.qi]) return;
  state.sel = pos;
  renderQ();
}

function checkAnswer(){
  const ans = state.answers[state.qi];
  if(ans) return;
  if(state.sel===null){
    const fb = el("feedback");
    fb.className = "feedback show bad";
    fb.innerHTML = "👆 <b>Pick an answer first!</b> Tap one of the choices above, then check.";
    return;
  }
  const sh = state.shuffled[state.qi];
  const q = SETS[state.set].questions[state.qi];
  const ok = (state.sel===sh.correctPos);
  state.answers[state.qi] = { sel: state.sel, ok: ok };
  logEvent("Answer checked", state.set+" Q"+(state.qi+1)+": "+(ok?"correct":"incorrect"));
  renderQ();
  if(ok) celebrate(false);
}

function showFeedback(ok, q, sh, selPos){
  const fb = el("feedback");
  fb.className = "feedback show " + (ok ? "good" : "bad");
  const letters = ["A","B","C","D"];
  let html = ok
    ? "🎉 <b>Correct! Great reading!</b>"
    : "💪 <b>Not quite.</b> The correct answer was <b>"+letters[sh.correctPos]+"</b>.";
  html += '<div class="exp">💡 <b>Why:</b> '+q.explanation+'</div>';
  fb.innerHTML = html;
}

function updateNav(){
  const n = SETS[state.set].questions.length;
  el("prev-btn").disabled = (state.qi===0);
  el("check-btn").disabled = !!state.answers[state.qi];
  el("next-btn").textContent = (state.qi===n-1) ? "See My Score ⭐" : "Next ➡";
}

function navigate(d){
  const n = SETS[state.set].questions.length;
  const nq = state.qi + d;
  if(nq >= n){ submitQuiz(); return; }
  if(nq < 0) return;
  state.qi = nq; state.sel = null;
  renderQ();
  window.scrollTo({top:0, behavior:"smooth"});
}

function submitQuiz(){
  const qs = SETS[state.set].questions;
  const firstOpen = state.answers.findIndex(a=>!a);
  if(firstOpen !== -1){
    state.qi = firstOpen; state.sel = null;
    renderQ();
    const fb = el("feedback");
    fb.className = "feedback show bad";
    fb.innerHTML = "📝 <b>Almost done!</b> Please answer and check this question first.";
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const correctCount = state.answers.filter(a=>a.ok).length;
  const total = qs.length;
  const pct = Math.round(correctCount/total*100);
  const d = getAudit();
  d.attempts[state.set].push({ t:new Date().toLocaleString(), score:correctCount, total:total });
  saveAudit(d);
  logEvent("Set submitted", state.set+": "+correctCount+"/"+total+" ("+pct+"%)");
  renderResults(correctCount, total, pct);
}

function renderResults(correctCount, total, pct){
  el("quiz-area").hidden = true;
  const box = el("results");
  box.hidden = false;
  const stars = pct===100 ? "★★★" : pct>=80 ? "★★☆" : pct>=60 ? "★☆☆" : "☆☆☆";
  let msg = pct===100 ? "🌟 PERFECT SCORE! You are a superstar reader! 🌟"
    : pct>=80 ? "🎉 Wonderful reading! So close to perfect!"
    : pct>=60 ? "👍 Good work! Keep practicing and you'll get even better!"
    : "💪 Nice try! Every reader gets better with practice. Try again!";
  let html = "<h2>🏁 Set Complete!</h2>";
  html += '<div class="stars">'+stars+'</div>';
  html += '<div class="score-ring" style="background:conic-gradient(var(--accent) '+pct+'%, #e2e8f0 '+pct+'% 100%)"><span class="pct">'+pct+'%</span><span>'+correctCount+' of '+total+'</span></div>';
  html += "<p style='font-size:1.15rem;font-weight:bold'>"+msg+"</p>";
  if(pct===100){
    const s = SETS[state.set];
    html += '<div class="award"><div class="big">🏆</div><div style="font-size:1.3rem;font-weight:bold;color:#92400e">READING CHAMPION</div><div style="color:#92400e">'+s.icon+' '+s.award+' — '+state.set+'</div></div>';
    celebrate(true);
  } else {
    html += '<div class="retry-note">🎯 Score 100% to earn the <b>'+SETS[state.set].award+'</b> trophy for '+state.set+'!</div>';
  }
  html += '<div class="review"><h3 style="color:#0c4a6e">📝 Review your answers</h3>';
  const letters = ["A","B","C","D"];
  const qs = SETS[state.set].questions;
  for(let i=0;i<qs.length;i++){
    const q = qs[i], sh = state.shuffled[i], a = state.answers[i];
    const cls = a.ok ? "ok" : "no";
    const mark = a.ok ? "✅" : "❌";
    html += '<div class="review-item '+cls+'"><b>'+mark+' Question '+(i+1)+':</b> '+q.prompt
      + '<br>Your answer: <b>'+letters[a.sel]+'</b> — '+q.options[sh.order[a.sel]]
      + (a.ok ? "" : '<br>Correct answer: <b>'+letters[sh.correctPos]+'</b> — '+q.options[sh.order[sh.correctPos]])
      + '<div class="exp" style="margin-top:6px">💡 '+q.explanation+'</div>'
      + '<details><summary>📖 Re-read the passage</summary><div class="rp"><b>'+q.title+'</b><br>'+q.passage+'</div></details></div>';
  }
  html += '</div><button class="retake" onclick="loadSet(state.set)">🔄 Try This Set Again</button>';
  box.innerHTML = html;
  window.scrollTo({top:0, behavior:"smooth"});
}

function celebrate(big){
  if(!big) return;
  const colors = ["#f59e0b","#0284c7","#16a34a","#dc2626","#7c3aed","#ec4899"];
  for(let i=0;i<70;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2+Math.random()*2)+"s";
    c.style.animationDelay = (Math.random()*0.8)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}

/* ---------- Parent / teacher panel (?check=true) ---------- */
function renderParentPanel(){
  const d = getAudit();
  let html = "";
  SET_NAMES.forEach(name=>{
    const atts = d.attempts[name]||[];
    const best = atts.length ? Math.max.apply(null, atts.map(a=>Math.round(a.score/a.total*100))) : "—";
    html += "<p style='margin:4px 0'>"+SETS[name].icon+" <b>"+name+" ("+SETS[name].tag+")</b>: "
      + atts.length + " attempt(s), best score "+best+"%</p>";
  });
  el("parent-stats").innerHTML = html;
  const tb = el("parent-log"); tb.innerHTML = "";
  d.events.slice(0,100).forEach(e=>{
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>"+e.t+"</td><td>"+e.type+"</td><td>"+e.details+"</td>";
    tb.appendChild(tr);
  });
}
function clearLog(){
  if(confirm("Clear all recorded activity for Reading 11-1 on this device?")){
    saveAudit({ attempts:{"Set A":[],"Set B":[],"Set C":[]}, events:[] });
    renderParentPanel();
  }
}

/* ---------- init ---------- */
(function init(){
  const params = new URLSearchParams(window.location.search);
  if(params.get("check")==="true"){
    el("parent-panel").hidden = false;
    renderParentPanel();
  }
  logEvent("Page loaded", "Reading 11-1 opened");
  loadSet("Set A");
})();
</script>
