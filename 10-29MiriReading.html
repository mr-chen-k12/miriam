const AUDIT_KEY = "reading_10_28_miri_audit_v1";
const SET_NAMES = Object.keys(SETS);

let state = { set:"Set A", qi:0, shuffled:[], answers:[], sel:null };

function getAudit(){
  try{
    const d = JSON.parse(localStorage.getItem(AUDIT_KEY));
    if(d && d.attempts) return d;
  }catch(e){}
  return { attempts:{"Set A":[],"Set B":[],"Set C":[]}, events:[] };
}
function saveAudit(d){ try{ localStorage.setItem(AUDIT_KEY, JSON.stringify(d)); }catch(e){} }
function logEvent(type, details){
  const d = getAudit();
  d.events.unshift({ t:new Date().toLocaleString(), type:type, details:details });
  if(d.events.length > 300) d.events.length = 300;
  saveAudit(d);
  if(!document.getElementById("parent-panel").hidden) renderParentPanel();
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function el(id){ return document.getElementById(id); }

function renderTabs(){
  const tabs = el("set-tabs");
  tabs.innerHTML = "";
  SET_NAMES.forEach(name=>{
    const s = SETS[name];
    const b = document.createElement("button");
    b.className = "set-tab" + (name===state.set ? " active" : "");
    b.innerHTML = s.icon+" "+name+"<small>"+s.tag+"</small>";
    b.onclick = ()=>switchSet(name);
    tabs.appendChild(b);
  });
}

function loadSet(name){
  state.set = name;
  state.qi = 0;
  state.sel = null;
  const qs = SETS[name].questions;
  state.shuffled = qs.map(q=>{
    const order = shuffle([0,1,2,3]);
    return { order:order, correctPos: order.indexOf(q.correct) };
  });
  state.answers = new Array(qs.length).fill(null);
  el("quiz-area").hidden = false;
  el("results").hidden = true;
  renderTabs(); renderQ();
  logEvent("Set started", name);
}

function switchSet(name){
  if(name===state.set) return;
  loadSet(name);
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderDots(){
  const dots = el("dots"); dots.innerHTML = "";
  const n = SETS[state.set].questions.length;
  el("progress-label").textContent = "Question "+(state.qi+1)+" of "+n+" · "+SETS[state.set].icon+" "+SETS[state.set].tag;
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "dot";
    d.textContent = i+1;
    const a = state.answers[i];
    if(a) d.classList.add(a.ok ? "done" : "bad");
    if(i===state.qi) d.classList.add("now");
    d.onclick = ()=>{ state.qi=i; state.sel=null; renderQ(); };
    d.style.cursor = "pointer";
    dots.appendChild(d);
  }
}

function renderQ(){
  const qs = SETS[state.set].questions;
  const q = qs[state.qi];
  const sh = state.shuffled[state.qi];
  const ans = state.answers[state.qi];
  renderDots();
  const card = el("qcard");
  let html = '<div class="passage"><div class="p-title">📖 '+q.title+'</div>'+q.passage+'</div>';
  html += '<div class="prompt">❓ '+q.prompt+'</div><div id="opts">';
  const letters = ["A","B","C","D"];
  for(let pos=0; pos<4; pos++){
    const optIdx = sh.order[pos];
    let cls = "opt";
    let dis = "";
    if(ans){
      dis = " disabled";
      if(pos===sh.correctPos) cls += " correct";
      else if(pos===ans.sel) cls += " wrong";
    } else if(state.sel===pos){
      cls += " selected";
    }
    html += '<button class="'+cls+'"'+dis+' onclick="selectOpt('+pos+')"><span class="letter">'+letters[pos]+'</span>'+q.options[optIdx]+'</button>';
  }
  html += '</div><div class="feedback" id="feedback"></div>';
  card.innerHTML = html;
  if(ans) showFeedback(ans.ok, q, sh, ans.sel);
  updateNav();
}

function selectOpt(pos){
  if(state.answers[state.qi]) return;
  state.sel = pos;
  renderQ();
}

function checkAnswer(){
  const ans = state.answers[state.qi];
  if(ans) return;
  if(state.sel===null){
    const fb = el("feedback");
    fb.className = "feedback show bad";
    fb.innerHTML = "👆 <b>Pick an answer first!</b> Tap one of the choices above, then check.";
    return;
  }
  const sh = state.shuffled[state.qi];
  const q = SETS[state.set].questions[state.qi];
  const ok = (state.sel===sh.correctPos);
  state.answers[state.qi] = { sel: state.sel, ok: ok };
  logEvent("Answer checked", state.set+" Q"+(state.qi+1)+": "+(ok?"correct":"incorrect"));
  renderQ();
  if(ok) celebrate(false);
}

function showFeedback(ok, q, sh, selPos){
  const fb = el("feedback");
  fb.className = "feedback show " + (ok ? "good" : "bad");
  const letters = ["A","B","C","D"];
  let html = ok
    ? "🎉 <b>Correct! Great reading!</b>"
    : "💪 <b>Not quite.</b> The correct answer was <b>"+letters[sh.correctPos]+"</b>.";
  html += '<div class="exp">💡 <b>Why:</b> '+q.explanation+'</div>';
  fb.innerHTML = html;
}

function updateNav(){
  const n = SETS[state.set].questions.length;
  el("prev-btn").disabled = (state.qi===0);
  el("check-btn").disabled = !!state.answers[state.qi];
  el("next-btn").textContent = (state.qi===n-1) ? "See My Score ⭐" : "Next ➡";
}

function navigate(d){
  const n = SETS[state.set].questions.length;
  const nq = state.qi + d;
  if(nq >= n){ submitQuiz(); return; }
  if(nq < 0) return;
  state.qi = nq; state.sel = null;
  renderQ();
  window.scrollTo({top:0, behavior:"smooth"});
}

function submitQuiz(){
  const qs = SETS[state.set].questions;
  const firstOpen = state.answers.findIndex(a=>!a);
  if(firstOpen !== -1){
    state.qi = firstOpen; state.sel = null;
    renderQ();
    const fb = el("feedback");
    fb.className = "feedback show bad";
    fb.innerHTML = "📝 <b>Almost done!</b> Please answer and check this question first.";
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const correctCount = state.answers.filter(a=>a.ok).length;
  const total = qs.length;
  const pct = Math.round(correctCount/total*100);
  const d = getAudit();
  d.attempts[state.set].push({ t:new Date().toLocaleString(), score:correctCount, total:total });
  saveAudit(d);
  logEvent("Set submitted", state.set+": "+correctCount+"/"+total+" ("+pct+"%)");
  renderResults(correctCount, total, pct);
}

function renderResults(correctCount, total, pct){
  el("quiz-area").hidden = true;
  const box = el("results");
  box.hidden = false;
  const stars = pct===100 ? "★★★" : pct>=80 ? "★★☆" : pct>=60 ? "★☆☆" : "☆☆☆";
  let msg = pct===100 ? "🌟 PERFECT SCORE! You are a superstar reader! 🌟"
    : pct>=80 ? "🎉 Wonderful reading! So close to perfect!"
    : pct>=60 ? "👍 Good work! Keep practicing and you'll get even better!"
    : "💪 Nice try! Every reader gets better with practice. Try again!";
  let html = "<h2>🏁 Set Complete!</h2>";
  html += '<div class="stars">'+stars+'</div>';
  html += '<div class="score-ring" style="background:conic-gradient(var(--accent) '+pct+'%, #e2e8f0 '+pct+'% 100%)"><span class="pct">'+pct+'%</span><span>'+correctCount+' of '+total+'</span></div>';
  html += "<p style='font-size:1.15rem;font-weight:bold'>"+msg+"</p>";
  if(pct===100){
    const s = SETS[state.set];
    html += '<div class="award"><div class="big">🏆</div><div style="font-size:1.3rem;font-weight:bold;color:#92400e">READING CHAMPION</div><div style="color:#92400e">'+s.icon+' '+s.award+' — '+state.set+'</div></div>';
    celebrate(true);
  } else {
    html += '<div class="retry-note">🎯 Score 100% to earn the <b>'+SETS[state.set].award+'</b> trophy for '+state.set+'!</div>';
  }
  html += '<div class="review"><h3 style="color:#0c4a6e">📝 Review your answers</h3>';
  const letters = ["A","B","C","D"];
  const qs = SETS[state.set].questions;
  for(let i=0;i<qs.length;i++){
    const q = qs[i], sh = state.shuffled[i], a = state.answers[i];
    const cls = a.ok ? "ok" : "no";
    const mark = a.ok ? "✅" : "❌";
    html += '<div class="review-item '+cls+'"><b>'+mark+' Question '+(i+1)+':</b> '+q.prompt
      + '<br>Your answer: <b>'+letters[sh.order[a.sel]!==undefined ? a.sel : 0]+'</b> — '+q.options[sh.order[a.sel]]
      + (a.ok ? "" : '<br>Correct answer: <b>'+letters[sh.correctPos]+'</b> — '+q.options[sh.order[sh.correctPos]])
      + '<div class="exp" style="margin-top:6px">💡 '+q.explanation+'</div>'
      + '<details><summary>📖 Re-read the passage</summary><div class="rp"><b>'+q.title+'</b><br>'+q.passage+'</div></details></div>';
  }
  html += '</div><button class="retake" onclick="loadSet(state.set)">🔄 Try This Set Again</button>';
  box.innerHTML = html;
  window.scrollTo({top:0, behavior:"smooth"});
}

function celebrate(big){
  if(!big) return;
  const colors = ["#f59e0b","#0284c7","#16a34a","#dc2626","#7c3aed","#ec4899"];
  for(let i=0;i<70;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (2+Math.random()*2)+"s";
    c.style.animationDelay = (Math.random()*0.8)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}

/* ---------- Parent / teacher panel (?check=true) ---------- */
function renderParentPanel(){
  const d = getAudit();
  let html = "";
  SET_NAMES.forEach(name=>{
    const atts = d.attempts[name]||[];
    const best = atts.length ? Math.max.apply(null, atts.map(a=>Math.round(a.score/a.total*100))) : "—";
    html += "<p style='margin:4px 0'>"+SETS[name].icon+" <b>"+name+" ("+SETS[name].tag+")</b>: "
      + atts.length + " attempt(s), best score "+best+"%</p>";
  });
  el("parent-stats").innerHTML = html;
  const tb = el("parent-log"); tb.innerHTML = "";
  d.events.slice(0,100).forEach(e=>{
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>"+e.t+"</td><td>"+e.type+"</td><td>"+e.details+"</td>";
    tb.appendChild(tr);
  });
}
function clearLog(){
  if(confirm("Clear all recorded activity for Reading 10-28 on this device?")){
    saveAudit({ attempts:{"Set A":[],"Set B":[],"Set C":[]}, events:[] });
    renderParentPanel();
  }
}

/* ---------- init ---------- */
(function init(){
  const params = new URLSearchParams(window.location.search);
  if(params.get("check")==="true"){
    el("parent-panel").hidden = false;
    renderParentPanel();
  }
  logEvent("Page loaded", "Reading 10-28 opened");
  loadSet("Set A");
})();
</script>
