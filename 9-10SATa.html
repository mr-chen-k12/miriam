<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4th-5th Grade Reading Practice - Set 9-10A</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #university-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #university-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .university-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #university-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>Elementary Reading Practice - Grade 4-5 (Set 9-10A)</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="university-reward">
            <div class="university-text" id="reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="reward-img" src="" alt="University Crest">
            <p id="reward-desc" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Octopuses are famed for their ability to blend seamlessly into ocean surroundings. By contracting tiny pigment-filled cells called chromatophores in their skin, an octopus can instantly match the precise color and texture of nearby coral or rocks. This remarkable adaptation allows the octopus to ________ unnoticed by roving ocean predators.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["remain", "depart", "struggle", "hesitate"],
            correctAnswer: 0,
            explanation: "'Remain' fits best because matching colors and textures helps the octopus stay hidden and stay unnoticed by predators."
        },
        {
            passage: "Humpback whales are famous for their complex underwater vocalizations, often called 'songs.' These repeating patterns of low moans and high squeaks can travel tens of miles through deep water. Researchers have observed that all male whales in a specific ocean region sing the exact same song, which gradually evolves over time as new phrases are added.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Male humpback whales in the same region share and gradually evolve a complex, collective song.",
                "Humpback whales use high-pitched squeaks to navigate through icy Arctic waters.",
                "Vocalizations are used by female humpback whales to teach young calves how to swim.",
                "Deep ocean currents carry whale sounds much faster than wind carries sound waves."
            ],
            correctAnswer: 0,
            explanation: "The text focuses on how male humpback whales in a region sing identical songs that evolve over time."
        },
        {
            passage: "Wind power plants generate electricity using huge turbines turned by natural air currents. However, because wind speeds vary constantly throughout the day, electricity production fluctuates unpredictably. To balance supply and satisfy electricity demands on calm days, power grids rely on ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "backup power reserves such as large grid batteries or natural gas generators.",
                "giant fans that blow artificial wind directly onto the turbine blades.",
                "solar panels built exclusively beneath deep subterranean cave systems.",
                "wooden fences installed along coastal shorelines to block sea breezes."
            ],
            correctAnswer: 0,
            explanation: "Because wind fluctuates, backup power sources like grid batteries or backup generators ensure power stays steady on calm days."
        },
        {
            passage: "In 1911, archaeologist Hiram Bingham led an expedition into the Peruvian Andes and encountered Machu Picchu, a 15th-century Inca citadel nestled high on a mountain ridge. Remarkably, the Inca builders cut granite stones so precisely that they fit together without any mortar, allowing the structures to withstand severe earthquakes for centuries.",
            prompt: "Which detail from the text best supports the idea that Inca stonemasons were exceptionally skilled?",
            options: [
                "The granite stones were cut so precisely that they fit together tightly without mortar.",
                "Machu Picchu was built during the 15th century high in the Andes mountains.",
                "Hiram Bingham led an archaeological team to explore the Peruvian mountains in 1911.",
                "Machu Picchu is considered one of the most famous historical landmarks in South America."
            ],
            correctAnswer: 0,
            explanation: "Cutting stones so accurately that mortar wasn't needed directly demonstrates the extraordinary craft skill of Inca builders."
        },
        {
            passage: "Hydrothermal vents on the ocean floor spew superheated, mineral-rich water into the pitch-black abyss. Lacking sunlight, ecosystems around these vents cannot perform photosynthesis. Instead, specialized bacteria convert hydrogen sulfide chemicals into organic energy through a process called chemosynthesis, serving as the foundational food source for giant tube worms and deep-sea crabs. These resilient organisms are ________ to survive in extremely harsh environments.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["equipped", "unable", "unwilling", "forbidden"],
            correctAnswer: 0,
            explanation: "'Equipped' means having the necessary features or abilities. Chemosynthesis allows these organisms to live near extreme deep-sea vents."
        },
        {
            passage: "Text 1\nAssigning daily homework helps elementary students practice foundational skills like reading and math outside the classroom. Regular independent practice reinforces classroom instruction and develops strong personal study habits early in life.\n\nText 2\nHeavy homework assignments often lead to elevated stress and reduced outdoor playtime for young children. Research shows that elementary students gain minimal academic benefits from homework, making quality family time and adequate sleep far more beneficial.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1?",
            options: [
                "By arguing that homework offers limited academic value for young children and can cause unnecessary stress.",
                "By claiming that elementary students should spend all evening studying advanced mathematics.",
                "By agreeing that daily homework is the single most important factor in early childhood success.",
                "By suggesting that schools extend classroom instruction into late evening hours."
            ],
            correctAnswer: 0,
            explanation: "Text 2 directly contends that homework offers minimal academic gains and increases stress, countering the claim in Text 1."
        },
        {
            passage: "Earth is surrounded by a protective magnetic field generated by liquid iron churning within its outer core. **This invisible shield deflects harmful charged particles emitted by the sun, preventing solar winds from stripping away our atmosphere.** Near the polar regions, some solar particles interact with atmospheric gases, creating spectacular glowing lights known as auroras.",
            prompt: "Which choice best describes the function of the bold sentence in the text?",
            options: [
                "It explains how Earth's magnetic field protects the atmosphere from solar particles.",
                "It describes how scientists measure the temperature of liquid iron in the planet's core.",
                "It illustrates how atmospheric gases produce colorful auroras near the North Pole.",
                "It compares Earth's magnetic field with the magnetic forces of other solar system planets."
            ],
            correctAnswer: 0,
            explanation: "The bold sentence describes the magnetic shield's role in deflecting solar wind particles to protect the atmosphere."
        },
        {
            passage: "Tardigrades, often called 'water bears,' are microscopic animals known for surviving extreme conditions like boiling heat, deep-freeze cold, and cosmic radiation. When environmental conditions become harsh, tardigrades enter a state of suspended animation called cryptobiosis, expelling nearly all water from their bodies. This state allows them to ________ severe dehydration for decades.",
            prompt: "Which choice completes the text with the most logical and precise word?",
            options: ["withstand", "accelerate", "misunderstand", "discourage"],
            correctAnswer: 0,
            explanation: "'Withstand' means to endure or resist. Cryptobiosis allows tardigrades to endure extreme dry conditions without dying."
        },
        {
            passage: "The invention of the bicycle gear system transformed personal transportation in the late 19th century. By using different gear ratios connected by a chain, riders can adjust how many times the wheels turn with each pedal rotation. Switching to lower gears makes pedaling easier when climbing steep hills, while higher gears allow riders to travel faster on flat roads.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Bicycle gear systems allow riders to adjust pedaling resistance for climbing hills or riding fast.",
                "High gear ratios are required for riding bicycles safely down steep mountain trails.",
                "Bicycles replaced horses as the primary mode of transportation in major 19th-century cities.",
                "Metal bicycle chains must be lubricated frequently to prevent gear teeth from rusting."
            ],
            correctAnswer: 0,
            explanation: "The main point explains how bicycle gear systems work to adjust pedaling effort across different terrains."
        },
        {
            passage: "When lava erupts onto Earth's surface and cools rapidly in contact with air or water, it forms igneous rock with microscopic crystals, such as basalt. Conversely, when magma cools slowly deep underground over thousands of years, large visible mineral crystals have time to form, creating coarse-grained rocks like granite. Therefore, the size of mineral crystals in igneous rock depends primarily on ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "the speed at which the molten rock cools.",
                "the color of the surrounding soil layer.",
                "the amount of rainwater absorbing into the ground.",
                "the distance the rock is transported by glacier ice."
            ],
            correctAnswer: 0,
            explanation: "The text contrasts rapid cooling (small crystals) with slow underground cooling (large crystals), showing crystal size depends on cooling speed."
        }
    ];

    // Award possibilities for 10/10 perfect score
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">4th-5th Grade Reading Practice - Set 9-10A</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Dynamic reward selection (Rotates by day of the month or picks randomly for variety)
        if (score === quizData.length) {
            const todayIndex = new Date().getDate() % universityRewards.length;
            const selectedReward = universityRewards[todayIndex];

            const rewardContainer = document.getElementById('university-reward');
            const rewardTitle = document.getElementById('reward-title');
            const rewardImg = document.getElementById('reward-img');
            const rewardDesc = document.getElementById('reward-desc');

            rewardContainer.style.borderColor = selectedReward.color;
            rewardTitle.style.color = selectedReward.color;
            rewardTitle.textContent = `★ FLAWLESS ACADEMIC EXCELLENCE ★`;
            rewardImg.src = selectedReward.img;
            rewardImg.alt = `${selectedReward.name} Crest`;
            rewardDesc.textContent = `You have successfully earned the ${selectedReward.name} verification crest for achieving a perfect 10/10 score!`;

            rewardContainer.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
